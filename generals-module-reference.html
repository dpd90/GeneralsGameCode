<title>Zero Hour Module Codex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF0EC; --panel:#F8F9F6; --raise:#FFFFFF; --ink:#1B2220; --ink2:#44504B; --muted:#6C7873;
  --line:#D5DAD4; --line2:#E4E8E2; --accent:#B8741A; --accent-ink:#8A540C; --accent-soft:#F4E7D2;
  --mod:#1E7666; --mod-soft:#DCEFEA; --patch:#6A5AA8; --patch-soft:#E8E4F5;
  --code-bg:#1E2624; --code-ink:#DDE5E1; --code-key:#E8B35C; --code-com:#7F918A; --code-kw:#7FC7B6;
  --onlyA:#F6E2DA; --onlyB:#DDEBE4; --diff:#F3EBD2;
  --display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121715; --panel:#171D1B; --raise:#1C2321; --ink:#E3E9E6; --ink2:#B9C4BF; --muted:#8B9893;
    --line:#2C3633; --line2:#232C29; --accent:#E0A04A; --accent-ink:#EDB86C; --accent-soft:#3A2D19;
    --mod:#5CC4AE; --mod-soft:#173731; --patch:#A999E6; --patch-soft:#2A2640;
    --code-bg:#0D1110; --onlyA:#3A2621; --onlyB:#1B3129; --diff:#342E1C;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121715; --panel:#171D1B; --raise:#1C2321; --ink:#E3E9E6; --ink2:#B9C4BF; --muted:#8B9893;
  --line:#2C3633; --line2:#232C29; --accent:#E0A04A; --accent-ink:#EDB86C; --accent-soft:#3A2D19;
  --mod:#5CC4AE; --mod-soft:#173731; --patch:#A999E6; --patch-soft:#2A2640;
  --code-bg:#0D1110; --onlyA:#3A2621; --onlyB:#1B3129; --diff:#342E1C;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
a{color:var(--accent-ink)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;gap:16px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.02em;white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:8px}
.brand small{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.mark{width:22px;height:22px;border:2px solid var(--accent);transform:rotate(45deg);display:inline-grid;place-items:center}
.mark::after{content:"";width:8px;height:8px;background:var(--accent)}
.search{position:relative;flex:1 1 320px;max-width:620px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:6px;background:var(--raise);font-size:15px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted)}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--raise);border:1px solid var(--line);border-radius:8px;
  box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:min(460px,70vh);overflow:auto;padding:4px}
.res{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 10px;border-radius:6px;cursor:pointer}
.res[aria-selected="true"],.res:hover{background:var(--accent-soft)}
.res b{font-family:var(--mono);font-weight:500;font-size:14px}
.res .rc{grid-column:2;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .rk{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;align-self:center;text-align:right}
.res .hit{grid-column:1/-1;font-size:12px;color:var(--ink2);font-family:var(--mono)}
.noresult{padding:12px;color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--raise);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* layout */
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 60px)}
aside{border-right:1px solid var(--line);background:var(--panel);padding:14px 10px 40px;position:sticky;top:60px;align-self:start;max-height:calc(100vh - 60px);overflow:auto}
aside h4{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:16px 8px 4px;display:flex;justify-content:space-between}
aside h4:first-child{margin-top:0}
aside a{display:flex;justify-content:space-between;gap:6px;padding:3px 8px;border-radius:5px;text-decoration:none;color:var(--ink2);font-family:var(--mono);font-size:12.5px;overflow:hidden}
aside a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
aside a:hover{background:var(--line2);color:var(--ink)}
aside a.on{background:var(--accent-soft);color:var(--ink)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;align-self:center}
.dot.mod{background:var(--mod)} .dot.patched{background:var(--patch)}
main{padding-block:28px 80px;padding-inline:clamp(16px,4vw,48px);min-width:0}
@media (max-width:860px){ .wrap{grid-template-columns:1fr} aside{display:none} }

/* module view */
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.04em;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow code{color:var(--accent-ink)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,4vw,38px);line-height:1.1;margin:6px 0 10px;letter-spacing:.01em;word-break:break-word;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:36px 0 10px;letter-spacing:.02em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-family:var(--body);font-weight:400;font-size:13px;color:var(--muted)}
h3{font-family:var(--mono);font-weight:500;font-size:14px;margin:22px 0 8px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
h3 .role{font-family:var(--body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.badge{font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid transparent}
.badge.mod{background:var(--mod-soft);color:var(--mod);border-color:color-mix(in srgb,var(--mod) 35%,transparent)}
.badge.vanilla{background:var(--line2);color:var(--ink2)}
.badge.patched{background:var(--patch-soft);color:var(--patch)}
.badge.cat{background:transparent;border-color:var(--line);color:var(--ink2)}
.lead{font-size:17px;color:var(--ink);max-width:70ch;margin:0 0 14px}
.prose{max-width:72ch;color:var(--ink2)}
.prose b{color:var(--ink);font-weight:600}
.prose code,td code,.lead code{font-family:var(--mono);font-size:.9em;background:var(--line2);padding:0 4px;border-radius:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 4px}
.btn{border:1px solid var(--line);background:var(--raise);padding:7px 12px;border-radius:6px;cursor:pointer;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b1206;font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
select.btn{padding-right:28px;max-width:100%}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;font-size:13px;margin-top:10px}
.meta dt{color:var(--muted)} .meta dd{margin:0;font-family:var(--mono);font-size:12.5px;word-break:break-all}

.code{position:relative;background:var(--code-bg);color:var(--code-ink);border-radius:8px;overflow:auto;max-width:100%}
.code pre{margin:0;padding:16px 18px;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre}
.code .k{color:var(--code-key)} .code .c{color:var(--code-com);font-style:italic} .code .w{color:var(--code-kw)}
.copy{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.08);color:var(--code-ink);border:1px solid rgba(255,255,255,.15);border-radius:5px;font-size:12px;padding:3px 9px;cursor:pointer}
.copy:hover{background:rgba(255,255,255,.16)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--raise)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-family:var(--body);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.f{font-family:var(--mono);font-weight:500;white-space:nowrap}
td.t{color:var(--ink2);font-size:12.5px;min-width:120px}
td.dv{font-family:var(--mono);font-size:12.5px;color:var(--ink2);white-space:nowrap}
td.x{min-width:260px}
td.st{min-width:90px}
.eg{display:block;margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.eg::before{content:"e.g.  "}
.srcn{display:block;margin-top:3px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.inf{font-size:11px;color:var(--muted);font-style:italic}
tr.hl td{background:var(--accent-soft)}
.fold{border:1px solid var(--line);border-radius:8px;background:var(--raise);margin-top:10px}
.fold summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;list-style:none;display:flex;gap:8px;align-items:center}
.fold summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.fold[open] summary::before{transform:rotate(90deg)}
.fold .inner{padding:0 14px 12px}
.fold .tablewrap{border:0;border-top:1px solid var(--line2);border-radius:0}
.note{font-size:13.5px;color:var(--ink2);padding:10px 0;border-top:1px dashed var(--line);max-width:90ch;white-space:pre-wrap}
.note:first-child{border-top:0}

/* overview */
.hero{display:flex;flex-wrap:wrap;gap:24px;align-items:end;justify-content:space-between;margin-bottom:10px}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.card{display:block;text-decoration:none;color:inherit;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.card:hover{border-color:var(--accent)}
.card b{font-family:var(--mono);font-weight:500;font-size:13.5px;display:flex;gap:6px;align-items:center}
.card p{margin:4px 0 0;font-size:12.5px;color:var(--muted);line-height:1.45}
.pairs{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.pair{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:var(--mono);font-size:13px}
.pair a{text-decoration:none}
.pair .vs{color:var(--muted);font-family:var(--body);font-size:12px}
.pair button{margin-left:auto}

/* compare */
.cmphead{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cmpcol{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.cmpcol h1{font-size:clamp(20px,2.6vw,28px)}
.cmpcol .lead{font-size:15px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2);margin:8px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
tr.onlyA td{background:var(--onlyA)} tr.onlyB td{background:var(--onlyB)} tr.diff td{background:var(--diff)}
td.st{font-size:11px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;color:var(--ink2)}
.cmpbody{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cmpbody .prose{font-size:14px}
@media (max-width:760px){ .cmphead,.cmpbody{grid-template-columns:1fr} }
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:6px;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="brand" id="home" role="link" tabindex="0"><span class="mark" aria-hidden="true"></span>Zero Hour Module Codex <small>GeneralsGameCode</small></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search modules, fields or engine changes (e.g. SlowDeath, HOUSEFX)…" autocomplete="off" aria-label="Search modules" aria-controls="results" aria-expanded="false">
    <span class="kbd" aria-hidden="true">/</span>
    <div class="results" id="results" role="listbox" hidden></div>
  </div>
  <div class="filters" role="group" aria-label="Filter modules">
    <button class="chip" data-f="all" aria-pressed="true">All</button>
    <button class="chip" data-f="mod" aria-pressed="false">Mod (V2)</button>
    <button class="chip" data-f="vanilla" aria-pressed="false">Vanilla</button>
  </div>
</header>
<div class="wrap">
  <aside id="side" aria-label="Module list"></aside>
  <main id="main"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DATA={"mods":[{"name":"ActiveBody","key":"Body","cat":"Body","origin":"vanilla","sum":"Standard body: health, armor-mitigated damage, damage states, death, healing and subdual damage.","body":"The normal body for units. It has <b>MaxHealth<\/b>/<b>InitialHealth<\/b>, applies armor to incoming damage, computes the body damage state (PRISTINE / DAMAGED / REALLYDAMAGED / RUBBLE, thresholds from GameData), notifies damage modules and kills the object at 0 health. Also handles subdual damage (EMP-like non-lethal damage that disables the unit when it reaches MaxHealth, capped by <b>SubdualDamageCap<\/b>, bleeding off at <b>SubdualDamageHealAmount<\/b> per <b>SubdualDamageHealRate<\/b>).","ex":"Body = ActiveBody ModuleTag_Body\n  MaxHealth     = 480\n  InitialHealth = 480\n  SubdualDamageCap        = 960\n  SubdualDamageHealRate   = 500\n  SubdualDamageHealAmount = 50\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ActiveBody.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Body/ActiveBody.cpp","bases":["BodyModule"],"data":"ActiveBodyModuleData","groups":[["ActiveBodyModuleData","own"]],"cp":["ShieldedBody"],"notes":[]},{"name":"ActiveShroudUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that sets the object's active shroud range (makes it cast shroud over enemies, e.g. GLA Radar Jammer).","body":"When triggered, the object's ShroudRange (the area in which it re-shrouds enemy vision) is set to <b>NewShroudRange<\/b>.","ex":"Behavior = ActiveShroudUpgrade ModuleTag_Shroud\n  TriggeredBy    = Upgrade_ShroudGenerator\n  NewShroudRange = 200\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ActiveShroudUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/ActiveShroudUpgrade.cpp","bases":["UpgradeModule"],"data":"ActiveShroudUpgradeModuleData","groups":[["ActiveShroudUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"AIUpdateInterface","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"Standard unit AI: movement, pathfinding, attacking, auto-acquiring targets, turrets. Base of all *AIUpdate modules.","body":"The generic AI brain for mobile units. It executes player/AI commands (move, attack, guard, attack-move, enter, dock…) through a state machine, uses the object's Locomotor for pathfinding, handles idle auto-targeting (<b>AutoAcquireEnemiesWhenIdle<\/b>, re-checked every <b>MoodAttackCheckRate<\/b>) and drives up to two turrets defined in <b>Turret<\/b>/<b>AltTurret<\/b> sub-blocks. Every specialised AI (Dozer, Jet, Missile, SupplyTruck, Chinook, DeployStyle, Transport…) builds on this. Tanks and infantry with no special behaviour just use AIUpdateInterface.","ex":"Behavior = AIUpdateInterface ModuleTag_AI\n  AutoAcquireEnemiesWhenIdle = Yes\n  MoodAttackCheckRate        = 250\n  Turret\n    TurretTurnRate        = 180\n    ControlledWeaponSlots = PRIMARY\n    NaturalTurretAngle    = 0\n    RecenterTime          = 5000\n  End\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/AIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate.cpp","bases":["UpdateModule","AICommandInterface"],"data":"AIUpdateModuleData","groups":[["AIUpdateModuleData","own"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"AnimatedParticleSysBoneClientUpdate","key":"ClientUpdate","cat":"Client update","origin":"vanilla","sum":"Client update that moves attached particle systems with animated bones.","body":"By default particle systems attached to bones stay at the bone's rest position. This client update re-positions them every frame to follow animated bones (e.g. smoke from a rotating part). No fields.","ex":"ClientUpdate = AnimatedParticleSysBoneClientUpdate ModuleTag_AnimPSys\nEnd","header":"Core/GameEngine/Include/GameClient/Module/AnimatedParticleSysBoneClientUpdate.h","cpp":"Core/GameEngine/Source/GameClient/Drawable/Update/AnimatedParticleSysBoneClientUpdate.cpp","bases":["ClientUpdateModule"],"data":"(none)","groups":[],"cp":[],"notes":[]},{"name":"AnimationSteeringUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Plays turning animations (TURN_LEFT/TURN_RIGHT model conditions) while the unit steers.","body":"Sets TURN_LEFT/TURN_RIGHT (and centering transitions) model conditions as the unit's heading changes, so vehicles like bikes or hovercraft can lean into turns. <b>MinTransitionTime<\/b> is the minimum time between state changes to avoid flicker.","ex":"Behavior = AnimationSteeringUpdate ModuleTag_Steering\n  MinTransitionTime = 300\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/AnimationSteeringUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AnimationSteeringUpdate.cpp","bases":["UpdateModule"],"data":"AnimationSteeringUpdateModuleData","groups":[["AnimationSteeringUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"ArmorUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that switches the object to its upgraded armor set (PLAYER_UPGRADE armor set flag).","body":"When triggered, sets the PLAYER_UPGRADE ArmorSet condition so the ArmorSet with <code>Conditions = PLAYER_UPGRADE<\/code> is used (e.g. Composite Armor, Chemical Suits — which also paints the chem-suit decal). No fields besides the upgrade triggers.","ex":"Behavior = ArmorUpgrade ModuleTag_Armor\n  TriggeredBy = Upgrade_AmericaCompositeArmor\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ArmorUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/ArmorUpgrade.cpp","bases":["UpgradeModule"],"data":"UpgradeModuleData","groups":[["UpgradeMuxData","mixin"]],"cp":["PersistentDecalUpdateV2"],"notes":[]},{"name":"AssaultTransportAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"AI for the Troop Crawler: auto-deploys its passengers to attack, and recalls wounded ones to heal inside.","body":"When the transport is ordered to attack, it unloads its passengers and orders them to attack the target; when the attack is over they return inside. Passengers whose health drops below <b>MembersGetHealedAtLifeRatio<\/b> return to the transport to heal. During attack-move the troops keep fighting until the area within <b>ClearRangeRequiredToContinueAttackMove<\/b> is clear.","ex":"Behavior = AssaultTransportAIUpdate ModuleTag_AI\n  AutoAcquireEnemiesWhenIdle = Yes\n  MembersGetHealedAtLifeRatio = 0.5\n  ClearRangeRequiredToContinueAttackMove = 50\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/AssaultTransportAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/AssaultTransportAIUpdate.cpp","bases":["AIUpdateInterface","AssaultTransportAIInterface"],"data":"AssaultTransportAIUpdateModuleData","groups":[["AssaultTransportAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"AssistedTargetingUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Lets other units (e.g. a Patriot with a Laser-assisted target) order this unit to fire at targets beyond its own acquisition, drawing a laser between them.","body":"Used by the USA Patriot Missile System's 'assisted targeting': when a friendly unit with this module is told by an 'assisting' ally to attack something, it fires <b>AssistingClipSize<\/b> shots of its <b>AssistingWeaponSlot<\/b> weapon at that target even if it would not normally acquire it, and draws a laser object from the assisting unit (<b>LaserFromAssisted<\/b>) and to the target (<b>LaserToTarget<\/b>) to visualize the link.","ex":"Behavior = AssistedTargetingUpdate ModuleTag_Assist\n  AssistingClipSize   = 4\n  AssistingWeaponSlot = SECONDARY\n  LaserFromAssisted   = PatriotBinaryDataStream\n  LaserToTarget       = PatriotBinaryDataStream\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/AssistedTargetingUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AssistedTargetingUpdate.cpp","bases":["UpdateModule"],"data":"AssistedTargetingUpdateModuleData","groups":[["AssistedTargetingUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"AutoDepositUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Periodically gives money to the owner (oil derricks, Supply Drop Zone, Hackers' bonus buildings).","body":"Every <b>DepositTiming<\/b> the owner receives <b>DepositAmount<\/b> money (and a floating '+$' text). When a player captures the building for the first time they get <b>InitialCaptureBonus<\/b>. <b>UpgradedBoost<\/b> adds extra money per deposit for owners who have a given upgrade (syntax <code>UpgradeType:Upgrade_X Boost:20<\/code>, repeatable). <b>ActualMoney<\/b> = No shows the text without giving cash.","ex":"Behavior = AutoDepositUpdate ModuleTag_Money\n  DepositTiming      = 3000\n  DepositAmount      = 20\n  InitialCaptureBonus= 1000\n  ActualMoney        = Yes\n  UpgradedBoost      = UpgradeType:Upgrade_AmericaSupplyLines Boost:5\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/AutoDepositUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AutoDepositUpdate.cpp","bases":["UpdateModule"],"data":"AutoDepositUpdateModuleData","groups":[["AutoDepositUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"AutoFindHealingUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Wounded idle infantry automatically walk to the nearest healing unit/structure.","body":"Every <b>ScanRate<\/b> an idle unit checks its health. If it is below <b>AlwaysHeal<\/b> (fraction of max health) it looks within <b>ScanRange<\/b> for something that can heal it (ambulance, barracks, hospital…) and goes there. Between <b>AlwaysHeal<\/b> and <b>NeverHeal<\/b> it only does so when idle; above <b>NeverHeal<\/b> it never bothers.","ex":"Behavior = AutoFindHealingUpdate ModuleTag_FindHeal\n  ScanRate   = 1000\n  ScanRange  = 300\n  NeverHeal  = 0.85\n  AlwaysHeal = 0.25\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/AutoFindHealingUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AutoFindHealingUpdate.cpp","bases":["UpdateModule"],"data":"AutoFindHealingUpdateModuleData","groups":[["AutoFindHealingUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"AutoHealBehavior","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Periodically heals the object itself, or everything in a radius around it.","body":"AutoHealBehavior is a timed healing pulse. Every <b>HealingDelay<\/b> it restores <b>HealingAmount<\/b> health points. With <b>Radius<\/b> = 0 it heals only its own object (classic self-repair on vehicles and structures); with a non-zero Radius it becomes an area heal that affects every friendly object in range that passes the <b>KindOf<\/b>/<b>ForbiddenKindOf<\/b> filter (e.g. an ambulance or a repair drone aura).\n<br><br>Because it is an upgrade module (it inherits UpgradeMux), it can be gated behind an upgrade with <b>TriggeredBy<\/b>, or made always-on with <b>StartsActive = Yes<\/b>. <b>StartHealingDelay<\/b> makes it wait until the object has not been damaged for a while (out-of-combat regeneration). <b>SingleBurst<\/b> heals only once when triggered instead of looping. <b>AffectsWholePlayer<\/b> heals every object the owner has, regardless of distance.","ex":"Behavior = AutoHealBehavior ModuleTag_SelfRepair\n  StartsActive      = No\n  TriggeredBy       = Upgrade_AmericaAdvancedRepair\n  HealingAmount     = 4\n  HealingDelay      = 1000        ; one pulse per second\n  StartHealingDelay = 5000        ; only after 5s without taking damage\nEnd\n\n; Area heal aura\nBehavior = AutoHealBehavior ModuleTag_HealAura\n  StartsActive   = Yes\n  HealingAmount  = 10\n  HealingDelay   = 1000\n  Radius         = 150\n  KindOf         = INFANTRY\n  SkipSelfForHealing = Yes\n  UnitHealPulseParticleSystemName = HealingPulse\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/AutoHealBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/AutoHealBehavior.cpp","bases":["UpdateModule","UpgradeMux","DamageModuleInterface"],"data":"AutoHealBehaviorModuleData","groups":[["AutoHealBehaviorModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"BaikonurLaunchPower","key":"Behavior","cat":"Special power","origin":"vanilla","sum":"Campaign special power that launches the Baikonur rocket and creates a detonation object at the target.","body":"A SpecialPowerModule used by the Baikonur Cosmodrome map object (USA campaign). When triggered it plays the launch and creates <b>DetonationObject<\/b> at the target location. Includes the standard SpecialPowerModule fields.","ex":"Behavior = BaikonurLaunchPower ModuleTag_Launch\n  SpecialPowerTemplate = SuperweaponBaikonurLaunch\n  DetonationObject     = BaikonurRocketDetonation\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/BaikonurLaunchPower.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/BaikonurLaunchPower.cpp","bases":["SpecialPowerModule"],"data":"BaikonurLaunchPowerModuleData","groups":[["BaikonurLaunchPowerModuleData","own"],["SpecialPowerModuleData","inherited"]],"cp":[],"notes":[]},{"name":"BaseRegenerateUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Base structures regenerate health automatically after not being damaged for a while (rates from GameData.ini).","body":"Put on structures. After the structure has not been damaged for GameData's <i>BaseRegenDelay<\/i>, it heals <i>BaseRegenHealthPercentPerSecond<\/i> of its max health per second. The values are global (GameData.ini), so the module has no fields of its own. Structures under construction, sold or disabled do not regenerate.","ex":"Behavior = BaseRegenerateUpdate ModuleTag_BaseRegen\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/BaseRegenerateUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/BaseRenerateUpdate.cpp","bases":["UpdateModule","DamageModuleInterface"],"data":"BaseRegenerateUpdateModuleData","groups":[],"cp":[],"notes":[]},{"name":"BattleBusSlowDeathBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Battle Bus two-stage death: first 'death' throws it in the air and leaves a usable empty hulk, second death is final.","body":"SlowDeathBehavior variant for the GLA Battle Bus. On the first (intentional) death the bus is thrown into the air with <b>ThrowForce<\/b>, plays <b>FXStartUndeath<\/b>/<b>OCLStartUndeath<\/b>, hits passengers for <b>PercentDamageToPassengers<\/b>, lands (<b>FXHitGround<\/b>/<b>OCLHitGround<\/b>) and becomes an immobile bunker hulk that its passengers can still fire from. If the hulk is empty for <b>EmptyHulkDestructionDelay<\/b> it kills itself. The second death uses the normal SlowDeath behaviour. Combine with UndeadBody.","ex":"Behavior = BattleBusSlowDeathBehavior ModuleTag_BusDeath\n  DeathTypes             = ALL\n  FXStartUndeath         = FX_BattleBusStartUndeath\n  OCLStartUndeath        = OCL_BattleBusDebris\n  FXHitGround            = FX_BattleBusHitGround\n  ThrowForce             = 10\n  PercentDamageToPassengers = 50%\n  EmptyHulkDestructionDelay = 3000\n  DestructionDelay       = 500\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/BattleBusSlowDeathBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/BattleBusSlowDeathBehavior.cpp","bases":["SlowDeathBehavior"],"data":"BattleBusSlowDeathBehaviorModuleData","groups":[["BattleBusSlowDeathBehaviorModuleData","own"],["DieMuxData","mixin"],["SlowDeathBehaviorModuleData","inherited"]],"cp":[],"notes":[]},{"name":"BattlePlanUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"USA Strategy Center battle plans: Bombardment, Hold the Line, Search and Destroy — global buffs with building animations.","body":"Drives the Strategy Center. Selecting a plan plays pack/unpack animations (<b>*PlanAnimationTime<\/b>, <b>TransitionIdleTime<\/b>) and sounds, then applies the plan's bonus to every eligible unit of the player (filtered by <b>ValidMemberKindOf<\/b>/<b>InvalidMemberKindOf<\/b>): Bombardment gives a weapon bonus; Hold the Line multiplies armor damage by <b>HoldTheLinePlanArmorDamageScalar<\/b>; Search and Destroy multiplies sight by <b>SearchAndDestroyPlanSightRangeScalar<\/b>. The building itself gets its own bonuses (StrategyCenter* fields: extra vision/stealth detection, more max health). Changing plans paralyzes units for <b>BattlePlanChangeParalyzeTime<\/b>. <b>VisionObjectName<\/b> can reveal shroud.","ex":"Behavior = BattlePlanUpdate ModuleTag_BattlePlan\n  SpecialPowerTemplate               = SpecialAbilityChangeBattlePlans\n  BombardmentPlanAnimationTime       = 2000\n  HoldTheLinePlanAnimationTime       = 2000\n  SearchAndDestroyPlanAnimationTime  = 2000\n  TransitionIdleTime                 = 3000\n  ValidMemberKindOf                  = INFANTRY VEHICLE\n  InvalidMemberKindOf                = AIRCRAFT\n  BattlePlanChangeParalyzeTime       = 5000\n  HoldTheLinePlanArmorDamageScalar   = 0.9\n  SearchAndDestroyPlanSightRangeScalar = 1.2\n  StrategyCenterSearchAndDestroySightRangeScalar = 2.0\n  StrategyCenterSearchAndDestroyDetectsStealth   = Yes\n  StrategyCenterHoldTheLineMaxHealthScalar       = 2.0\n  StrategyCenterHoldTheLineMaxHealthChangeType   = PRESERVE_RATIO\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/BattlePlanUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/BattlePlanUpdate.cpp","bases":["SpecialPowerUpdateModule"],"data":"BattlePlanUpdateModuleData","groups":[["BattlePlanUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"BeaconClientUpdate","key":"ClientUpdate","cat":"Client update","origin":"vanilla","sum":"Client update for multiplayer beacons (map pings): radar pulses at intervals.","body":"Makes the placed beacon pulse on the radar every <b>RadarPulseFrequency<\/b> for <b>RadarPulseDuration<\/b>.","ex":"ClientUpdate = BeaconClientUpdate ModuleTag_Beacon\n  RadarPulseFrequency = 1000\n  RadarPulseDuration  = 500\nEnd","header":"Core/GameEngine/Include/GameClient/Module/BeaconClientUpdate.h","cpp":"Core/GameEngine/Source/GameClient/Drawable/Update/BeaconClientUpdate.cpp","bases":["ClientUpdateModule"],"data":"BeaconClientUpdateModuleData","groups":[["BeaconClientUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"BoneFXDamage","key":"Behavior","cat":"Damage","origin":"vanilla","sum":"Damage module companion of BoneFXUpdate: notifies it when the body damage state changes.","body":"Needed alongside BoneFXUpdate. It listens for body damage state transitions and tells BoneFXUpdate to switch to the effect set of the new state.","ex":"Behavior = BoneFXDamage ModuleTag_BoneFXDamage\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/BoneFXDamage.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Damage/BoneFXDamage.cpp","bases":["DamageModule"],"data":"DamageModuleData","groups":[["DamageModuleData","own"]],"cp":[],"notes":[]},{"name":"BoneFXUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Randomly plays FX, OCLs and particle systems at model bones, depending on the body damage state (e.g. fires and sparks on a damaged building).","body":"For each body damage state (Pristine, Damaged, ReallyDamaged, Rubble) up to 8 FXLists, 8 OCLs and 8 particle systems can be defined. Each entry specifies a bone, whether it's played once or repeatedly, and a random delay range: <code>DamagedFXList1 = bone:Fire01 OnlyOnce:No 1000 3000 FXList:FX_BuildingFire<\/code>. When the object is in that state, each entry fires at its bone at random intervals. <b>DamageFXTypes<\/b>/<b>DamageOCLTypes<\/b>/<b>DamageParticleTypes<\/b> restrict which damage types cause the effects.","ex":"Behavior = BoneFXUpdate ModuleTag_BoneFX\n  DamageFXTypes            = ALL\n  DamagedFXList1           = bone:Fire01 OnlyOnce:No 1000 3000 FXList:FX_BuildingSmallFire\n  ReallyDamagedParticleSystem1 = bone:Fire02 OnlyOnce:Yes 0 0 PSys:BuildingFireLarge\n  RubbleOCL1               = bone:Center OnlyOnce:Yes 0 0 OCL:OCL_RubbleSmoke\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/BoneFXUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/BoneFXUpdate.cpp","bases":["UpdateModule"],"data":"BoneFXUpdateModuleData","groups":[["BoneFXUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"BreakApartDeathBehaviorV2","key":"Behavior","cat":"Die / death","origin":"mod","sum":"Die module that breaks the dying unit apart into its real subobjects as flying debris pieces, with normal / overkill / extreme-overkill tiers.","body":"A mod-original die module. On death it picks a tier based on how violent the killing blow was, then recursively walks the bone hierarchy of a dedicated reference model (<b>BreakApartModel<\/b>) starting from every root bone listed for that tier (<b>BreakApartSubObject<\/b>, <b>OverkillBreakApartSubObject<\/b> or <b>ExtremeOverkillBreakApartSubObject<\/b>). For each bone in that subtree that has geometry, children before parents, it spawns one piece from <b>BreakApartPieceOCL<\/b> and tells that piece's <i>W3DBreakApartPieceDraw<\/i> which single subobject of the reference model to display — so the piece looks exactly like that part of the unit and starts in exactly the same place. Everything that was not broken off is spawned once as a remainder piece via <b>RemainPieceOCL<\/b>. <b>RemainSubObject<\/b> protects a bone (and its whole subtree) from being broken off.\n<br><br><b>Tier selection:<\/b> a tier triggers only if BOTH the killing hit was at least <i>…PercentageFromMaxHealth<\/i> of the unit's max health AND the wasted damage (damage minus health left before the hit) was at least <i>…DamageGreaterOrEqThan<\/i>. Extreme overkill is checked first, then overkill, otherwise the normal tier is used. Defaults disable both overkill tiers.\n<br><br>Pieces are pushed outward from the unit's centre in the direction of the part (<b>Force<\/b>, <b>OverkillForce<\/b>, <b>ExtremeOverkillForce<\/b>) with up to <b>ForceSpreadAngle<\/b> random scatter. The dying object is removed after <b>DestructionDelay<\/b> (+ random variance), which can be overridden per tier. <b>FX<\/b>/<b>OCL<\/b>/<b>Weapon<\/b> are independent decorative effects fired per phase exactly like SlowDeathBehavior (INITIAL / MIDPOINT / FINAL). Because every die module runs on death, partition <b>DeathTypes<\/b> between this and any SlowDeathBehavior on the same object.","ex":"Behavior = BreakApartDeathBehaviorV2 ModuleTag_BreakApart\n  DeathTypes          = ALL -CRUSHED -SPLATTED\n  BreakApartModel     = AVCrusader_BA          ; reference model with the full hierarchy\n  BreakApartPieceOCL  = OCL_BreakApartPiece    ; object uses Draw = W3DBreakApartPieceDraw\n  RemainPieceOCL      = OCL_BreakApartHull\n  BreakApartPieceFX   = FX_SmallDebrisPuff\n\n  BreakApartSubObject               = TURRET01\n  OverkillBreakApartSubObject       = TURRET01 TREADSL TREADSR\n  ExtremeOverkillBreakApartSubObject= TURRET01 TREADSL TREADSR FENDER\n  RemainSubObject                   = ANTENNA01\n\n  OverkillPercentageFromMaxHealth        = 60%\n  OverkillDamageGreaterOrEqThan          = 100\n  ExtremeOverkillPercentageFromMaxHealth = 150%\n  ExtremeOverkillDamageGreaterOrEqThan   = 400\n\n  Force               = 8\n  OverkillForce       = 14\n  ExtremeOverkillForce= 22\n  ForceSpreadAngle    = 45\n\n  DestructionDelay    = 100\n  FX = INITIAL FX_GenericTankDeathEffect\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/BreakApartDeathBehaviorV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/BreakApartDeathBehaviorV2.cpp","bases":["UpdateModule","DieModuleInterface"],"data":"BreakApartDeathBehaviorV2ModuleData","groups":[["BreakApartDeathBehaviorV2ModuleData","own"],["DieMuxData","mixin"]],"cp":["SlowDeathBehavior"],"notes":["FILE: BreakApartDeathBehaviorV2.h /////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 19/09/2026, redesigned 19/09/2026 Desc: Standalone DieModule that breaks a unit apart into its own real subobjects as debris, recursively -- naming a bone/subobject in BreakApartSubObject (e.g. \"TURRET\") walks that bone's own subtree on a dedicated, never-rendered reference W3D model (BreakApartModel; see BreakApartModelHelper.h) and spawns one debris piece per descendant bone that actually has geometry on it (e.g. \"BARREL01\"/\"BARREL02\" hanging off \"TURRET\"), children first, then the bone itself last. No per-part authoring is needed: every piece is spawned from the SAME modder-supplied BreakApartPieceOCL, and at spawn time this module tells that piece's Draw module (W3DBreakApartPieceDraw) which single subobject of BreakApartModel to show, via DrawModule::setBreakApartPiece() -- a fresh clone of the reference model with every OTHER subobject hidden, positioned/oriented exactly like the dying object itself, so the one visible piece lines up with where it looked on the original unit. Deliberately NOT layered on SlowDeathBehavior -- this module owns its own DestructionDelay countdown and its own DieMuxData (DeathTypes/ExemptStatus/RequiredStatus) filter, exactly like SlowDeathBehavior does, so partition DeathTypes between the two on any object that has both (Object::onDie() calls every DieModuleInterface unconditionally -- there's no \"only one die module handles this\" arbitration outside SlowDeathBehavior's own internal lottery between SlowDeathBehavior instances).","GeneralsMod @feature Dimitar 21/09/2026: per-tier overrides for DestructionDelay/ DestructionDelayVariance above -- e.g. a normal death lingers a while before the dying object is actually removed, but an overkill/extreme-overkill death (already violent enough that the pieces flying apart ARE the spectacle) destroys it faster, or slower, or with wildly different variance, independent of the normal-tier timing. Each defaults to a sentinel (0xFFFFFFFF, impossible to reach via INI::parseDurationUnsignedInt's own msec->frame conversion) meaning \"not configured -- inherit DestructionDelay/DestructionDelayVariance above\" -- so a modder who only cares about retiming the normal tier doesn't have to also restate it twice more for the other two tiers; the fields only diverge from the base timing when explicitly set. Which pair applies is picked in onDie() from the SAME tier index (m_dieTier: 0/1/2) that already selects which BreakApartSubObject root list and which Force field apply to this death.","generic decorative effects -- identical shape/semantics to SlowDeathBehavior's own FX/OCL/ Weapon fields, fired at the object's own position at each phase. Fully independent of the real per-subobject debris pieces below -- these are just ambient FX/OCL/Weapon triggers, the same way SlowDeathBehavior uses them.","Root bone/subobject names to recursively break apart -- naming a bone here also breaks apart every descendant bone under it in BreakApartModel's own hierarchy (see BreakApartModelHelper.h's GetBreakApartSubtreeBones()). Exactly one of these three lists is used per death, chosen by OverkillPercentage/ExtremeOverkillPercentage below.","GeneralsMod @feature Dimitar 19/09/2026: root bone/subobject names to PROTECT from the recursive break-apart walk, whichever tier's root list would otherwise have pulled them in -- e.g. a small decorative antenna hanging off TURRET01 that shouldn't fly off as its own tiny piece even though it's technically part of TURRET01's subtree. Deliberately a single, non-tiered list (same convention as RemainPieceOCL/RemainPieceFX below, as opposed to the three tiered lists above) -- \"don't break this specific part apart\" is treated as a property of the part itself, not something that should vary by how hard the unit was overkilled. SUBTREE-WIDE protection: naming a bone here protects it AND every one of its own descendants (walked via GetBreakApartSubtreeBones() the exact same way a BreakApartSubObject root is -- see spawnBreakApartDebris()'s own comment), the mirror image of how a BreakApartSubObject root pulls its whole subtree IN. Every protected bone is left out of both the individual-piece spawn and allBrokenBones, so it stays visible on the RemainPieceOCL/RemainPieceFX remainder piece instead of vanishing -- same as any subobject that was never named under a BreakApartSubObject root to begin with.","GeneralsMod @fix Dimitar 21/09/2026, redesigned same day to an AND of two independent checks after the user identified a real gap in EACH check alone: - Percentage-of-max-health ALONE (the first fix) misfires the other way: a moderate hit that lands while the target still has a lot of health left can be a big fraction of max health and yet barely finish the target off (e.g. 100 max health, 50 remaining, 51 damage dealt -- 51% of max health, but only 1 point of damage was actually WASTED). That's a real kill, not really an \"overkill\" in the sense this field is meant to capture, and worse, it makes certain weapon/target matchups \"hardcoded\" to always-or-never overkill regardless of the situation the hit actually happened in. - Wasted-damage-alone (damage beyond what was needed to kill, i.e. this hit's raw damage minus the health the object had right before it -- the ORIGINAL 19/09/2026 design's own m_healthBeforeDamage, see the .cpp) has the opposite gap: it misfires low, since any finishing blow on an already-worn-down object wastes nearly its full damage almost by definition, so even a basic tank's ordinary shot looks like a huge overkill by this metric alone whenever it happens to land the killing blow. So BOTH must hold for a tier to trigger: the hit must be big RELATIVE TO THIS UNIT'S OWN TOUGHNESS (percentage of max health -- rules out a weak weapon ever qualifying, no matter how little health the target had left), AND the hit must have genuinely WASTED damage beyond what was needed to kill (rules out a merely-large hit that happened to land on a still-healthy target with little to no actual excess). Real overkill, in both senses of the word, has to actually occur.","GeneralsMod @feature Dimitar 21/09/2026: half-angle (radians, INI::parseAngleReal -- write degrees in INI) of random scatter allowed around each per-bone piece's own OUTWARD-FROM- CENTER direction (the dying object's own position -> that bone's actual live world position, projected flat onto XY) when force is applied in spawnBreakApartDebris() below, instead of a fully random direction -- e.g. a part mounted on the tank's left side now reliably flies off toward the left (plus this much random jitter either way), rather than occasionally flying clean across to the right, which looked unnatural. Tier-agnostic (one field, like RemainPieceOCL/RemainPieceFX/RemainSubObject above) -- how much a piece's flight direction is allowed to wander isn't something that should vary by how hard the unit was overkilled. Only meaningful for pieces with a resolved live bone position; the RemainPieceOCL remainder piece has no off-center position of its own to derive a direction from, so it always keeps the old, fully random behavior regardless of this field.","GeneralsMod @feature Dimitar 19/09/2026: the ONE generic OCL used to spawn every debris piece, whatever bone it ends up representing -- its Object must have a W3DBreakApartPieceDraw Draw module; this module tells that module which single subobject of BreakApartModel to actually display, per spawn, via DrawModule::setBreakApartPiece(). No per-bone/per-part authoring is needed -- see the header comment above.","GeneralsMod @feature Dimitar 19/09/2026: the ONE OCL spawned, at most once per death, for every subobject that did NOT get broken apart into its own piece -- i.e. everything left over once every resolved BreakApartSubObject/OverkillBreakApartSubObject/ ExtremeOverkillBreakApartSubObject root's whole subtree has been removed from it. Optional -- leave unset (default nullptr, same convention as m_breakApartPieceOCL) to keep the old behavior of the non-broken-apart remainder simply vanishing with the rest of the object.","GeneralsMod @feature Dimitar 19/09/2026: one-shot FX played at each spawned piece's own position, right alongside BreakApartPieceOCL/RemainPieceOCL -- e.g. a small sparks/debris- puff burst per broken-off part, independent of the phase-keyed FX[]/OCL[]/Weapon[] triples above (those fire once at the DYING OBJECT's own position per phase; these fire once PER SPAWNED PIECE, at that piece's own position). Both optional, default nullptr (disabled), same convention as every other FXList/OCL field on this module."]},{"name":"BridgeBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Core logic of a destructible/repairable bridge: damage states, scaffold repair, death FX.","body":"Placed on the bridge object itself (map bridges created from Bridge definitions). It tracks the bridge's body damage state and propagates it to the bridge towers, handles the bridge dying (objects on it fall and are killed, bridge FX/OCLs are played), and when a Dozer repairs a destroyed bridge it drives the scaffold objects that rise and slide into place (<b>LateralScaffoldSpeed<\/b>, <b>VerticalScaffoldSpeed<\/b>). <b>BridgeDieFX<\/b>/<b>BridgeDieOCL<\/b> can be repeated and are fired along the bridge span with a delay and bone name.","ex":"Behavior = BridgeBehavior ModuleTag_Bridge\n  LateralScaffoldSpeed  = 30\n  VerticalScaffoldSpeed = 20\n  BridgeDieFX  = FX:FX_BridgeDie Delay:0 Bone:Center\n  BridgeDieOCL = OCL:OCL_BridgeDebris Delay:200 Bone:Center\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/BridgeBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/BridgeBehavior.cpp","bases":["UpdateModule","BridgeBehaviorInterface","DamageModuleInterface","DieModuleInterface"],"data":"BridgeBehaviorModuleData","groups":[["BridgeBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"BridgeScaffoldBehavior","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Moves the temporary scaffold pieces during bridge repair. No INI fields.","body":"Used internally on the scaffold objects that BridgeBehavior creates while a destroyed bridge is being rebuilt by a Dozer. It moves the scaffold from its rise position to its build position and back when done. It has no configurable fields — only list it on the scaffold object template.","ex":"Behavior = BridgeScaffoldBehavior ModuleTag_Scaffold\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/BridgeScaffoldBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/BridgeScaffoldBehavior.cpp","bases":["UpdateModule","BridgeScaffoldBehaviorInterface"],"data":"UpdateModuleData","groups":[],"cp":[],"notes":[]},{"name":"BridgeTowerBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Links a bridge tower (the targetable end piece) to its bridge. No INI fields.","body":"Bridge towers are the targetable objects at the corners of a bridge. This module forwards damage and healing between the tower and the bridge object so that attacking a tower damages the bridge and repairing it repairs the bridge. It has no fields.","ex":"Behavior = BridgeTowerBehavior ModuleTag_Tower\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/BridgeTowerBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/BridgeTowerBehavior.cpp","bases":["BehaviorModule","BridgeTowerBehaviorInterface","DieModuleInterface","DamageModuleInterface"],"data":"(none)","groups":[],"cp":[],"notes":[]},{"name":"BunkerBusterBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Bunker-buster bomb: on detonation kills or ejects the occupants of the struck garrison/tunnel/bunker.","body":"Put on the bomb projectile. When it dies it looks for the container it hit (garrisoned building, tunnel, bunker…). If the player has <b>UpgradeRequired<\/b> (or it is empty), all occupants are kicked out and damaged by <b>OccupantDamageWeaponTemplate<\/b> (usually lethal). It plays <b>CrashThroughBunkerFX<\/b> repeatedly while smashing through, <b>DetonationFX<\/b> on detonation, fires <b>ShockwaveWeaponTemplate<\/b> and shakes the camera (<b>SeismicEffectRadius/Magnitude<\/b>).","ex":"Behavior = BunkerBusterBehavior ModuleTag_BunkerBuster\n  UpgradeRequired             = Upgrade_AmericaBunkerBusters\n  DetonationFX                = FX_BunkerBusterExplosion\n  CrashThroughBunkerFX        = FX_BunkerBusterCrash\n  CrashThroughBunkerFXFrequency = 200\n  SeismicEffectRadius         = 140\n  SeismicEffectMagnitude      = 6\n  ShockwaveWeaponTemplate     = BunkerBusterShockwave\n  OccupantDamageWeaponTemplate= BunkerBusterOccupantDamage\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/BunkerBusterBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/BunkerBusterBehavior.cpp","bases":["UpdateModule","DieModuleInterface"],"data":"BunkerBusterBehaviorModuleData","groups":[["BunkerBusterBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"CashBountyPower","key":"Behavior","cat":"Special power","origin":"vanilla","sum":"Passive general's power: you receive a percentage of the cost of every enemy unit you kill.","body":"Once the science is purchased, the player gains <b>Bounty<\/b> percent of the build cost of each enemy object killed. <b>UpgradeBounty<\/b> (<code>Science Percent<\/code> pairs) gives higher percentages for higher ranks.","ex":"Behavior = CashBountyPower ModuleTag_Bounty\n  SpecialPowerTemplate = SuperweaponCashBounty\n  Bounty               = 5%\n  UpgradeBounty        = SCIENCE_CashBounty2 10%\n  UpgradeBounty        = SCIENCE_CashBounty3 20%\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CashBountyPower.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/CashBountyPower.cpp","bases":["SpecialPowerModule"],"data":"CashBountyPowerModuleData","groups":[["CashBountyPowerModuleData","own"],["SpecialPowerModuleData","inherited"]],"cp":[],"notes":[]},{"name":"CashHackSpecialPower","key":"Behavior","cat":"Special power","origin":"vanilla","sum":"Special power that steals money from an enemy player (e.g. Black Lotus Cash Hack / Command Center).","body":"When used on an enemy structure, steals <b>MoneyAmount<\/b> from its owner; with sciences, <b>UpgradeMoneyAmount<\/b> (<code>Science MoneyAmount<\/code> pairs) overrides the amount.","ex":"Behavior = CashHackSpecialPower ModuleTag_CashHack\n  SpecialPowerTemplate = SpecialAbilityBlackLotusStealCashHack\n  MoneyAmount          = 1000\n  UpgradeMoneyAmount   = SCIENCE_CashHack2 2000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CashHackSpecialPower.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/CashHackSpecialPower.cpp","bases":["SpecialPowerModule"],"data":"CashHackSpecialPowerModuleData","groups":[["CashHackSpecialPowerModuleData","own"],["SpecialPowerModuleData","inherited"]],"cp":[],"notes":[]},{"name":"CaveContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"GLA tunnel-style container that stores passengers in a shared cave network identified by CaveIndex.","body":"A version of OpenContain that does not keep passengers itself: it stores them in one of the global 'cave' networks managed by the CaveSystem. All caves with the same <b>CaveIndex<\/b> share a single passenger list regardless of owner, so units entering one cave can exit from any other cave of the same index. Used for map-placed neutral cave/tunnel networks (as opposed to TunnelContain which is per-player). The index can also be changed by map scripts.","ex":"Behavior = CaveContain ModuleTag_Cave\n  ContainMax      = 10\n  CaveIndex       = 1\n  AllowInsideKindOf = INFANTRY VEHICLE\n  EnterSound      = GarrisonEnter\n  ExitSound       = GarrisonExit\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CaveContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/CaveContain.cpp","bases":["OpenContain","CreateModuleInterface","CaveInterface"],"data":"CaveContainModuleData","groups":[["CaveContainModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"CheckpointUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Checkpoint gate: opens when allies are near and no enemies are near.","body":"Every <b>ScanDelayTime<\/b> checks for nearby allies and enemies; opens the gate (DOOR_1_OPENING state and removes geometry) when an ally is near and no enemy is, closes otherwise.","ex":"Behavior = CheckpointUpdate ModuleTag_Checkpoint\n  ScanDelayTime = 1000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CheckpointUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/CheckpointUpdate.cpp","bases":["UpdateModule"],"data":"CheckpointUpdateModuleData","groups":[["CheckpointUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"ChinookAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"Chinook AI: supply-gathering helicopter that can also rappel/ combat-drop infantry via ropes.","body":"Extends SupplyTruckAIUpdate for the USA Chinook: it gathers supplies like a truck (MaxBoxes etc.), and additionally supports the combat drop: hovering at least <b>MinDropHeight<\/b> over a spot and lowering <b>NumRopes<\/b> ropes (rope object <b>RopeName<\/b>, width/colour/wobble configurable) down which passengers rappel at <b>RappelSpeed<\/b>. Each rope starts after a random delay between PerRopeDelayMin/Max. <b>RotorWashParticleSystem<\/b> kicks up dust while hovering low. <b>UpgradedSupplyBoost<\/b> adds extra cash per trip after the Supply Lines style upgrade.","ex":"Behavior = ChinookAIUpdate ModuleTag_AI\n  MaxBoxes                   = 8\n  SupplyCenterActionDelay    = 1500\n  SupplyWarehouseActionDelay = 400\n  SupplyWarehouseScanDistance= 700\n  NumRopes         = 4\n  RopeName         = GenericRope\n  RappelSpeed      = 30\n  RopeDropSpeed    = 300\n  RopeWidth        = 0.5\n  RopeColor        = R:0 G:0 B:0\n  PerRopeDelayMin  = 900\n  PerRopeDelayMax  = 1500\n  MinDropHeight    = 30\n  WaitForRopesToDrop = Yes\n  RotorWashParticleSystem = HelicopterRotorWash\n  UpgradedSupplyBoost = 30\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ChinookAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/ChinookAIUpdate.cpp","bases":["SupplyTruckAIUpdate"],"data":"ChinookAIUpdateModuleData","groups":[["ChinookAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["SupplyTruckAIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"CleanupAreaPower","key":"Behavior","cat":"Special power","origin":"vanilla","sum":"Ability that orders the unit to clean up all hazards (toxins, radiation) in an area (Ambulance 'Cleanup Area').","body":"Works with CleanupHazardUpdate: the unit moves up to <b>MaxMoveDistanceFromLocation<\/b> around the target location and cleans every hazard it finds until none remain.","ex":"Behavior = CleanupAreaPower ModuleTag_Cleanup\n  SpecialPowerTemplate        = SpecialAbilityAmbulanceCleanupArea\n  MaxMoveDistanceFromLocation = 50\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CleanupAreaPower.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/CleanupAreaPower.cpp","bases":["SpecialPowerModule"],"data":"CleanupAreaPowerModuleData","groups":[["CleanupAreaPowerModuleData","own"],["SpecialPowerModuleData","inherited"]],"cp":[],"notes":[]},{"name":"CleanupHazardUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Lets a unit automatically target and clean up hazards (toxin puddles, radiation) near it.","body":"Every <b>ScanRate<\/b> an idle unit scans <b>ScanRange<\/b> for CLEANUP_HAZARD objects and attacks them with the weapon in <b>WeaponSlot<\/b> (e.g. the Ambulance/Hazmat cleaning spray).","ex":"Behavior = CleanupHazardUpdate ModuleTag_Cleanup\n  WeaponSlot = SECONDARY\n  ScanRate   = 1000\n  ScanRange  = 100\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CleanupHazardUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/CleanupHazardUpdate.cpp","bases":["UpdateModule"],"data":"CleanupHazardUpdateModuleData","groups":[["CleanupHazardUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"CommandButtonHuntUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Implements 'hunt' command buttons: the unit repeatedly seeks targets for a special ability (e.g. auto-hijack, auto-snipe).","body":"When the player uses a command button in 'hunt' mode, the unit keeps searching within <b>ScanRange<\/b> every <b>ScanRate<\/b> for a valid target for that button's ability and executes it, until given another order. Used for abilities like the Hijacker or Jarmen Kell's 'kill pilot' hunt.","ex":"Behavior = CommandButtonHuntUpdate ModuleTag_Hunt\n  ScanRate  = 1000\n  ScanRange = 9999\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CommandButtonHuntUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/CommandButtonHuntUpdate.cpp","bases":["UpdateModule"],"data":"CommandButtonHuntUpdateModuleData","groups":[["CommandButtonHuntUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"CommandSetUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that replaces the object's command set (new buttons after an upgrade).","body":"When triggered, the object uses <b>CommandSet<\/b> instead of its normal command set. If the player also has <b>TriggerAlt<\/b>, <b>CommandSetAlt<\/b> is used instead (lets two upgrades combine).","ex":"Behavior = CommandSetUpgrade ModuleTag_Commands\n  TriggeredBy   = Upgrade_UnlockAbility\n  CommandSet    = MyUnitCommandSet_Upgraded\n  CommandSetAlt = MyUnitCommandSet_UpgradedBoth\n  TriggerAlt    = Upgrade_SecondAbility\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CommandSetUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/CommandSetUpgrade.cpp","bases":["UpgradeModule"],"data":"CommandSetUpgradeModuleData","groups":[["CommandSetUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"ContainedTransitionDamageFXV2","key":"Behavior","cat":"Update / behavior","origin":"mod","sum":"Drop-in TransitionDamageFX that also fires on contained riders (e.g. Overlord add-ons), whose damage state is copied without notification.","body":"Mod-original. Riders inside an OverlordContain get their damage state copied from the carrier without their damage modules being notified, so a normal TransitionDamageFX on the rider never fires. This module takes the EXACT same fields as TransitionDamageFX, runs the same effect code, and additionally polls its body's damage state every <b>CheckInterval<\/b>; if the state changed silently, it runs the transition itself, using the container's last DamageInfo while contained so the DamageFX/OCL/Particle type filters work as on the container. Normal notifications update the tracked state first, so effects never play twice. Can replace TransitionDamageFX on any object.","ex":"Behavior = ContainedTransitionDamageFXV2 ModuleTag_Transition\n  CheckInterval                = 100\n  ReallyDamagedParticleSystem1 = Bone:Fire01 RandomBone:No PSys:SmallFire\n  RubbleFXList1                = Loc: X:0 Y:0 Z:5 FXList:FX_AddonDestroyed\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ContainedTransitionDamageFXV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Damage/ContainedTransitionDamageFXV2.cpp","bases":["UpdateModule","DamageModuleInterface"],"data":"ContainedTransitionDamageFXV2ModuleData","groups":[["ContainedTransitionDamageFXV2ModuleData","own"],["DamageModuleData","inherited"],["TransitionDamageFXModuleData","inherited"]],"cp":["TransitionDamageFX"],"notes":["FILE: ContainedTransitionDamageFXV2.h ////////////////////////////////////////////////////////// Desc:   TransitionDamageFX that also works on contained riders (e.g. an OverlordContain rider). Why this exists: TransitionDamageFX only reacts to DamageModuleInterface:: onBodyDamageStateChange(), which ActiveBody only calls from attemptDamage()/attemptHealing(). A rider inside an OverlordContain never takes those hits itself -- OverlordContain:: onBodyDamageStateChange() copies the Overlord's state onto it via BodyModule::setDamageState() -> internalChangeHealth(), which swaps the model (evaluateVisualCondition) but never notifies the rider's damage modules. So a plain TransitionDamageFX on the rider never fires. This module takes the EXACT same INI fields as TransitionDamageFX (it reuses TransitionDamageFXModuleData and its parsers) and runs the same effect code. In addition it polls its own body's damage state every CheckInterval and, if the state changed without the normal notification having reached it, runs the transition itself. When it does that while contained, it uses the CONTAINER's last DamageInfo (the hit that actually caused the change), so DamageFXTypes/DamageOCLTypes/DamageParticleTypes filtering and the OCL damage source work the same as they would on the container. Normal (non-relayed) notifications update the tracked state first, so a transition is never played twice. Can be used as a drop-in replacement for TransitionDamageFX on any object. INI: every TransitionDamageFX field, plus optionally: CheckInterval = 100   ; ms between body-state polls (default 100ms, min 1 frame)","Copy of the file-local helper in TransitionDamageFX.cpp (not reachable from here). Given an FXLoc info struct, return the effect position that we are supposed to use. The position is local to to the object */"]},{"name":"ConvertToCarBombCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"GLA Terrorist 'crate' behaviour: entering a civilian car converts it into a car bomb.","body":"On the Terrorist: when he 'collides' with a valid car it becomes his car bomb (switches owner, activates its CARBOMB weapon set and AI), playing <b>FXList<\/b>. Common crate fields filter valid targets.","ex":"Behavior = ConvertToCarBombCrateCollide ModuleTag_CarBomb\n  RequiredKindOf = CAN_BE_CAR_BOMB\n  ForbiddenKindOf= STRUCTURE\n  FXList         = FX_CarBombConvert\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ConvertToCarBombCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/ConvertToCarBombCrateCollide.cpp","bases":["CrateCollide"],"data":"ConvertToCarBombCrateCollideModuleData","groups":[["ConvertToCarBombCrateCollideModuleData","own"],["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"ConvertToHijackedVehicleCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Hijacker 'crate' behaviour: entering an enemy vehicle steals it (kills the driver, switches owner).","body":"On the Hijacker: colliding with an eligible enemy vehicle transfers it to the hijacker's player and hides the hijacker inside (see HijackerUpdate).","ex":"Behavior = ConvertToHijackedVehicleCrateCollide ModuleTag_Hijack\n  RequiredKindOf  = VEHICLE\n  ForbiddenKindOf = AIRCRAFT BOAT\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ConvertToHijackedVehicleCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/ConvertToHijackedVehicleCrateCollide.cpp","bases":["CrateCollide"],"data":"ConvertToHijackedVehicleCrateCollideModuleData","groups":[["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"CostModifierUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that changes the cost of all objects of certain KindOfs for the player (e.g. cheaper buildings).","body":"When triggered, every object of the player matching <b>EffectKindOf<\/b> costs <b>Percentage<\/b> more (negative = cheaper). Used by general's powers like 'Emergency Repair'-style discounts or GLA 'Cash Bounty'-like economics. Removed when the upgrade is removed.","ex":"Behavior = CostModifierUpgrade ModuleTag_Cost\n  TriggeredBy  = Upgrade_CheaperBuildings\n  EffectKindOf = STRUCTURE\n  Percentage   = -25%\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CostModifierUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/CostModifierUpgrade.cpp","bases":["UpgradeModule"],"data":"CostModifierUpgradeModuleData","groups":[["CostModifierUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"CountermeasuresBehavior","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Aircraft flare countermeasures: launches flare volleys and diverts incoming missiles.","body":"When a missile is fired at the aircraft, this module launches volleys of flare objects (<b>FlareTemplateName<\/b>) from bones named <b>FlareBoneBaseName<\/b>01, 02… Each incoming missile has an <b>EvasionRate<\/b> chance of being diverted to a flare after <b>MissileDecoyDelay<\/b>. The aircraft has <b>NumberOfVolleys<\/b> volleys of <b>VolleySize<\/b> flares, separated by <b>DelayBetweenVolleys<\/b>; when empty it reloads over <b>ReloadTime<\/b> — or, if <b>MustReloadAtAirfield<\/b> = Yes, only when it lands at an airfield. Gated by an upgrade through TriggeredBy (the USA 'Countermeasures' upgrade).","ex":"Behavior = CountermeasuresBehavior ModuleTag_Flares\n  TriggeredBy          = Upgrade_AmericaCountermeasures\n  FlareTemplateName    = CountermeasureFlare\n  FlareBoneBaseName    = Flare\n  VolleySize           = 2\n  VolleyArcAngle       = 60\n  VolleyVelocityFactor = 2.0\n  DelayBetweenVolleys  = 1000\n  NumberOfVolleys      = 3\n  ReloadTime           = 0\n  EvasionRate          = 30%\n  MustReloadAtAirfield = Yes\n  MissileDecoyDelay    = 200\n  ReactionLaunchLatency= 100\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CountermeasuresBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/CountermeasuresBehavior.cpp","bases":["UpdateModule","UpgradeMux","CountermeasuresBehaviorInterface"],"data":"CountermeasuresBehaviorModuleData","groups":[["CountermeasuresBehaviorModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"CreateCrateDie","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"On death, may create a crate (money, veterancy, unit...) according to CrateData rules.","body":"References one or more crate definitions from Crate.ini via <b>CrateData<\/b> (repeatable). When the object dies, each crate definition checks its own conditions (killer, veterancy, chance…) and may spawn its crate object at the death location. Used for salvage and bounty crates.","ex":"Behavior = CreateCrateDie ModuleTag_Crate\n  DeathTypes = ALL\n  CrateData  = SalvageCrateData\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CreateCrateDie.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Die/CreateCrateDie.cpp","bases":["DieModule"],"data":"CreateCrateDieModuleData","groups":[["CreateCrateDieModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"CreateObjectDie","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Creates an ObjectCreationList when the object dies (hulks, debris, replacement objects).","body":"On death, runs <b>CreationList<\/b> at the dying object. With <b>TransferPreviousHealth<\/b> the new object receives the health the old one had before the killing blow (used for 'transform on death'), and <b>TransferSelection<\/b> keeps it selected.","ex":"Behavior = CreateObjectDie ModuleTag_Hulk\n  DeathTypes   = ALL -CRUSHED\n  CreationList = OCL_CrusaderHulk\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CreateObjectDie.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Die/CreateObjectDie.cpp","bases":["DieModule"],"data":"CreateObjectDieModuleData","groups":[["CreateObjectDieModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"CrushDie","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Infantry/vehicle crushed death: plays crush sounds and sets the correct crushed model state.","body":"Handles CRUSHED deaths (e.g. a car run over by a tank). Depending on whether the crusher ran over the front, back or entire object, it sets FRONTCRUSHED/BACKCRUSHED model conditions and plays <b>FrontEndCrushSound<\/b>, <b>BackEndCrushSound<\/b> or <b>TotalCrushSound<\/b> with the given percent chance.","ex":"Behavior = CrushDie ModuleTag_Crush\n  DeathTypes            = NONE +CRUSHED +SPLATTED\n  TotalCrushSound       = CarCrushTotal\n  BackEndCrushSound     = CarCrushBack\n  FrontEndCrushSound    = CarCrushFront\n  TotalCrushSoundPercent    = 100\n  BackEndCrushSoundPercent  = 50\n  FrontEndCrushSoundPercent = 50\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/CrushDie.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Die/CrushDie.cpp","bases":["DieModule"],"data":"CrushDieModuleData","groups":[["CrushDieModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"DamageOverTimeUpdateV2","key":"Behavior","cat":"Update / behavior","origin":"mod","sum":"Generic damage-over-time effect triggered by dedicated OVERTIME1..8 damage channels; tick damage respects armor and can be multi-typed.","body":"Mod-original, modelled on PoisonedBehavior. Put it on the TARGET (often on DefaultThingTemplate via InheritableModule so every unit can suffer it). When hit by a damage type in <b>TriggerDamageTypes<\/b> (default NONE +OVERTIME1), it starts dealing <b>Amount<\/b> + <b>Amount%<\/b> of the triggering hit's actual damage every <b>Rate<\/b> for <b>Lifetime<\/b>, once per type listed in <b>DealDamageTypes<\/b> (each type gets the full amount and goes through the target's armor for that type). Each tick can also fire <b>Weapon<\/b>/<b>OCL<\/b>/<b>FXList<\/b> at the target. <b>FireInitially<\/b> adds an immediate tick on every qualifying hit.\n<br><br>Re-hits refresh (not stack): the amount is recaptured from the newest hit and Lifetime restarts, while the tick cadence is preserved. Healing cancels the effect. Up to 8 instances with different OVERTIME channels (and ModuleTags) can coexist on one object; <b>RequiredKindOf<\/b>/<b>ForbiddenKindOf<\/b> restrict which targets are affected (e.g. 3 KindOf variants × 8 channels). Untriggered instances cost no per-frame update. Give the attacker's weapon <code>DamageType = OVERTIME1<\/code> (or whichever channel).","ex":"; On DefaultThingTemplate (so every object can burn):\nInheritableModule\n  Behavior = DamageOverTimeUpdateV2 ModuleTag_DoT_Burn_Vehicle\n    TriggerDamageTypes = NONE +OVERTIME1\n    DealDamageTypes    = NONE +FLAME\n    RequiredKindOf     = VEHICLE\n    Lifetime           = 8000\n    Rate               = 1000\n    Amount             = 5\n    Amount%            = 10%\n    FireInitially      = No\n    FXList             = FX_BurningTick\n  End\nEnd\n\n; Attacker's weapon:\nWeapon NapalmStrikeWeapon\n  DamageType = OVERTIME1\n  ...\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DamageOverTimeUpdateV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/DamageOverTimeUpdateV2.cpp","bases":["UpdateModule","DamageModuleInterface"],"data":"DamageOverTimeUpdateV2ModuleData","groups":[["DamageOverTimeUpdateV2ModuleData","own"]],"cp":["PoisonedBehavior","FlammableUpdate"],"notes":["FILE: DamageOverTimeUpdateV2.h /////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 15/09/2026, extended 16/09/2026 Generic \"damage over time\" module: reacts to being hit by a qualifying DamageType (TriggerDamageTypes below, default NONE +OVERTIME1 -- see the new DAMAGE_OVERTIME1..8 channels in GameLogic/Damage.h) by dealing Amount (+ Amount% of the triggering hit's own dealt damage) again, once per DamageType flagged in DealDamageTypes, every Rate frames, for a total of Lifetime frames, optionally firing Weapon/OCL/FXList (all at our own position) on every one of those ticks. Modeled directly on the vanilla PoisonedBehavior (same trigger-by-DamageType-in-onDamage / periodic- UPDATE_SLEEP idiom) crossed with ShieldGeneratorUpdateV2's Weapon/OCL/FXList-fired-at-self convention, generalized so a modder can point ANY weapon at this effect via TriggerDamageTypes instead of being hardcoded to one specific flavor (flame/poison) the way the two vanilla modules are. 16/09/2026: split what used to be a single dual-purpose \"DamageTypes\" field into two independent fields -- TriggerDamageTypes (what starts/refreshes the effect) and DealDamageTypes (what tick damage is dealt as) -- so the two no longer have to be the same list. Listing more than one type in DealDamageTypes (e.g. \"NONE +ARMOR_PIERCING +FLAME\") deals the FULL Amount/Amount% separately as EACH listed type, every tick -- not split across them -- so a single instance can deal a \"mixed\" effect that's independently mitigated by a unit's AP Percent AND its FLAME Percent at once, while still being triggered by whatever TriggerDamageTypes says (which need not overlap with DealDamageTypes at all -- e.g. triggered only by OVERTIME1, but always deals ARMOR_PIERCING + FLAME). Previously tick damage was dealt as a single captured m_triggerType (just whichever type happened to trigger the effect); that capture is gone now that ticks iterate DealDamageTypes directly. Also 16/09/2026: added FireInitially (default No). When Yes, every qualifying hit -- a fresh start AND a refresh of an already-active effect -- ALSO deals one tick's worth of damage/Weapon/OCL/ FXList immediately, right when it (re)triggers, on top of (not instead of) the normal Rate-cadence tick already scheduled. Without it, the very first tick doesn't land until Rate frames after the triggering hit, same as before this field existed. See startOrRefresh()'s own comment for the one nuance worth knowing: the immediate tick runs synchronously from inside onDamage(), which itself runs from inside the ORIGINAL hit's own attemptDamage() call -- a nested/reentrant attemptDamage(), not a new top-level one like a normal scheduled tick gets from update(). This is safe (ActiveBody::attemptDamage() holds no static/reentrancy-unsafe state and the object's module list doesn't change during combat), but it does mean any sibling module later in the object's own module list gets notified of OUR immediate tick's hit before it gets notified of the ORIGINAL triggering hit that caused it, since our nested call's full module-notify pass completes before the outer one resumes. Why new DamageTypes instead of reusing DAMAGE_FLAME/DAMAGE_POISON: reusing either ties this effect to their existing ArmorSet/DamageFX resistance tuning and visual baggage (FlammableUpdate's own \"aflame\" status/model-burn state, PoisonedBehavior's green tint) that has nothing to do with a generic overtime strike. DAMAGE_OVERTIME1..8 are clean, mod-owned channels with none of that -- see GameLogic/Damage.h (enum) and GameLogic/System/Damage.cpp (DamageTypeFlags::s_bitNameList[]). Usage -- give the TARGET object (the thing that should be able to suffer overtime damage) this module, and give the ATTACKER's Weapon a DamageType matching this module's TriggerDamageTypes: Behavior = DamageOverTimeUpdateV2 ModuleTag_01 Lifetime    = 8000              ; total duration of the effect once triggered, in msec Rate        = 1000              ; how often (msec) the tick damage/Weapon/OCL/FXList re-fire Amount      = 5.0               ; flat damage dealt on every tick Amount%     = 10%               ; PLUS this percentage of the triggering hit's own dealt ; damage (damageInfo->out.m_actualDamageDealt), captured once ; when the effect starts/refreshes -- not re-measured per tick FireInitially = No              ; optional, default No; if Yes, ALSO deals one tick's worth of ; damage/Weapon/OCL/FXList immediately on every qualifying hit ; (fresh start or refresh), instead of waiting Rate frames for ; the first tick to land. See the header comment above for the ; one nuance (nested attemptDamage()) this implies. Weapon      = ...               ; optional; fired at self on every tick (subject to the ; weapon's own ReadyToFire/ammo/reload state, same as any ; other \"fire at self\" module in this mod) OCL         = ...               ; optional; created at self on every tick FXList      = ...               ; optional; played at self on every tick TriggerDamageTypes = NONE +OVERTIME1   ; which incoming DamageTypes start/refresh this effect. ; Default shown here IS the module's actual default. 8 dedicated ; channels exist (OVERTIME1..OVERTIME8, see GameLogic/Damage.h) ; so up to 8 independently-configured instances of this module ; can coexist on one object without refreshing/clobbering each ; other -- give each instance a different single channel and a ; different ModuleTag. Widen to more than one type (e.g. ; \"NONE +OVERTIME1 +FLAME\") to also trigger from an existing ; real DamageType. DealDamageTypes    = NONE +OVERTIME1   ; which DamageType(s) tick damage is dealt as -- every ; flagged type gets the FULL Amount/Amount% each tick (not split ; across them), each passing through the target's own ArmorSet ; Percent coefficient for that type independently. Default shown ; here IS the module's actual default; does NOT have to match ; TriggerDamageTypes -- e.g. TriggerDamageTypes = NONE +OVERTIME1 ; with DealDamageTypes = NONE +ARMOR_PIERCING +FLAME is a valid, ; and common, setup (triggered by one channel, deals a mixed ; real-type effect). RequiredKindOf = INFANTRY       ; optional; if set, the TARGET must match at least one listed ; KindOf to be af
