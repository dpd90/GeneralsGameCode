Update"],"notes":["FILE: WeaponBonusUpdateV2.h ///////////////////////////////////////////////// GeneralsMod @feature Dimitar 08/09/2026 WeaponBonusUpdateV2 is a copy of WeaponBonusUpdate (see WeaponBonusUpdate.h) that additionally lets the INI specify a custom \"Tint\" color to use instead of the hardcoded FRENZY_COLOR / FRENZY_COLOR_INFANTRY constants in Drawable.cpp, and applies the same color to both infantry and vehicles (no kindof-based branching). It is a separate module purely so that WeaponBonusUpdate itself does not need to change, keeping this feature easy to merge/rebase against upstream changes. purpose:\tLike healing in that it can affect just me or people around, except this gives a Weapon Bonus instead of health, with a modder-specified tint color.","FILE: WeaponBonusUpdateV2.cpp ///////////////////////////////////////////////// GeneralsMod @feature Dimitar 08/09/2026 See WeaponBonusUpdateV2.h. This is a copy of WeaponBonusUpdate.cpp with a single behavioral difference: the tint applied while the bonus is active comes from the \"Tint\" INI field instead of the hardcoded FRENZY_COLOR / FRENZY_COLOR_INFANTRY constants, and is not varied by kindof. The custom color is scaled down by WEAPON_BONUS_V2_TINT_SCALE before being handed to the Drawable, because the tint is added directly to the scene lights' diffuse color (see Drawable::getTintColor / W3DScene.cpp), so a raw 0-255 -> 0.0-1.0 color would blow out the model instead of just tinting it. The scale keeps the visual intensity in line with the stock FRENZY_COLOR magnitude no matter what hue is chosen.","GeneralsMod @feature Dimitar 08/09/2026: uniform dampening applied to any modder-specified Tint color, regardless of hue, so it stays an additive light tint (like the stock FRENZY_COLOR ~0.3 magnitude) rather than blowing out the model when a full-saturation color is specified in INI.","Leaving this here commented out to show that I need to reach valid contents of invalid transports. So these checks are on an individual basis, not in the Partition query PartitionFilterAcceptByKindOf filterKindof(data->m_requiredAffectKindOf,data->m_forbiddenAffectKindOf);"]},{"name":"WeaponBonusUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that grants the PLAYER_UPGRADE weapon bonus condition (e.g. +damage/+range from research).","body":"When triggered, sets the WEAPONBONUSCONDITION_PLAYER_UPGRADE on the object; the actual effect is defined by WeaponBonus = PLAYER_UPGRADE ... lines in GameData.ini (or per-weapon bonus sets).","ex":"Behavior = WeaponBonusUpgrade ModuleTag_Bonus\n  TriggeredBy = Upgrade_ChinaUraniumShells\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/WeaponBonusUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/WeaponBonusUpgrade.cpp","bases":["UpgradeModule"],"data":"UpgradeModuleData","groups":[["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"WeaponSetUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that switches the object to its upgraded weapon set (PLAYER_UPGRADE weapon set flag).","body":"When triggered, sets the PLAYER_UPGRADE weapon set flag so the WeaponSet with <code>Conditions = PLAYER_UPGRADE<\/code> is chosen (e.g. TOW missile on a Humvee).","ex":"Behavior = WeaponSetUpgrade ModuleTag_Weapons\n  TriggeredBy = Upgrade_AmericaTOWMissile\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/WeaponSetUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/WeaponSetUpgrade.cpp","bases":["UpgradeModule"],"data":"UpgradeModuleData","groups":[["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"WorkerAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"GLA Worker AI: a unit that is both a Dozer (build/repair) and a Supply Truck (gather).","body":"Combines DozerAIUpdate and SupplyTruckAIUpdate: the Worker builds and repairs (<b>RepairHealthPercentPerSecond<\/b>, <b>BoredTime<\/b>, <b>BoredRange<\/b>) and gathers supplies (<b>MaxBoxes<\/b>, <b>SupplyCenterActionDelay<\/b>, <b>SupplyWarehouseActionDelay<\/b>, <b>SupplyWarehouseScanDistance<\/b>, <b>UpgradedSupplyBoost<\/b>). Note the engine requires editing both Dozer and Worker data if extending them.","ex":"Behavior = WorkerAIUpdate ModuleTag_AI\n  RepairHealthPercentPerSecond = 2%\n  BoredTime                  = 5000\n  BoredRange                 = 150\n  MaxBoxes                   = 1\n  SupplyCenterActionDelay    = 1000\n  SupplyWarehouseActionDelay = 1000\n  SupplyWarehouseScanDistance= 300\n  UpgradedSupplyBoost        = 0\n  SuppliesDepletedVoice      = WorkerVoiceSuppliesDepleted\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/WorkerAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/WorkerAIUpdate.cpp","bases":["AIUpdateInterface","DozerAIInterface","SupplyTruckAIInterface","WorkerAIInterface"],"data":"WorkerAIUpdateModuleData","groups":[["WorkerAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":[],"notes":[]}],"groups":{"UpgradeMuxData":{"src":"UpgradeMuxData","nested":"","file":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/UpgradeModule.h","fields":[{"n":"TriggeredBy","t":"String list","d":"","x":"One or more Upgrade names that activate this module. The module stays dormant until the object (or its player, for player upgrades) has the upgrade. With several names, any one of them is enough unless RequiresAllTriggers = Yes.","e":"Upgrade_AmericaAdvancedTraining","i":false},{"n":"ConflictsWith","t":"String list","d":"","x":"Upgrade names that block this module. If any of these upgrades is present, this module will not activate even when TriggeredBy is satisfied. Used to make mutually-exclusive upgrade branches.","e":"Upgrade_SomeOtherBranch","i":false},{"n":"RemovesUpgrades","t":"String list","d":"","x":"Upgrade names that are removed from the object at the moment this module activates. Handy for const ENGINE=[{"id": "HouseFX", "name": "HOUSEFX per-pass house color", "area": "Rendering & art", "date": "27/09/2026", "sum": "Player color on any W3D pass, masked by a texture: additive passes glow, multiply passes tint, alpha-blend passes paint. No per-color texture copies.", "body": "<p>Vanilla has two house color paths: meshes named <code>HOUSECOLOR*<\/code> (the whole sub-mesh is tinted) and <code>ZHC*<\/code> textures (recolored on the CPU into one uncompressed copy per player color, never reduced by the texture-quality option). Both are poor fits for high-resolution textures or small glowing details.<\/p>\n<p><b>HOUSEFX<\/b> recolors the <b>vertex material<\/b> of individual passes instead, so a normal (DDS-compressible, any size) mask texture decides where the color goes and one texture serves every player. Only the tiny vertex material is cloned per color.<\/p>\n<p><b>Opt-in<\/b> (any one): the pass texture name starts with <code>HOUSEFX<\/code> (e.g. <code>HOUSEFX_tank_l.tga<\/code>), the 3ds Max/RenX material (or sub-material) name starts with <code>HOUSEFX<\/code>, or the mesh name starts with <code>HOUSEFX<\/code> (every material on it qualifies). Texture/material opt-in keeps mesh names free for <code>BARREL01<\/code>, turrets and other INI bone logic.<\/p>\n<p>What happens to each qualifying pass depends on its blend mode. Pass 1 (opaque) is never touched:<\/p>\n<div class=\"tablewrap\"><table><thead><tr><th>Pass blend<\/th><th>Engine sets<\/th><th>Mask texture<\/th><th>Result<\/th><\/tr><\/thead><tbody>\n<tr><td>Add<\/td><td>Emissive = player color, Ambient/Diffuse = 0<\/td><td>grayscale, black = no glow<\/td><td>unlit glow. Paint the base dark under it.<\/td><\/tr><tr><td>Add, <b>Emissive = 0<\/b> in RenX<\/td><td>Ambient/Diffuse = player color, Emissive = 0<\/td><td>the same grayscale mask<\/td><td>lit color, no glow (e.g. heavily damaged model). Base must be dark under the mask.<\/td><\/tr>\n<tr><td>Multiply + Primary Gradient <b>Add<\/b><\/td><td>Emissive = player color, Ambient/Diffuse = 0<\/td><td>white = no change, black = full color<\/td><td>tint. Base must be light gray there.<\/td><\/tr>\n<tr><td>Alpha Blend<\/td><td>Ambient/Diffuse = player color, Emissive = 0<\/td><td>RGB light gray detail, alpha = mask<\/td><td>lit team paint over an unchanged base<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>The engine also forces the pass color sources to MATERIAL, lighting on, and switches Primary Gradient <i>Disable<\/i> to <i>Modulate<\/i>. Multi-material meshes are handled. A vertex material shared with a pass of a different kind is skipped (DEBUG_LOG), so the base is never recolored by accident.<\/p>\n<p><b>Gotchas:<\/b> masks must be RGB TGA or DDS. An RLE grayscale TGA (type 11) loads as alpha-only A8, so its RGB is black and nothing glows. Don't prefix masks with <code>ZHC<\/code>. House color only shows in-game, not in W3DView/WorldBuilder. Each extra pass costs one draw call per mesh.<\/p>", "ex": "; 3ds Max / RenX material, any mesh name (e.g. BARREL01)\n; Pass 1: tank_diffuse.dds   Blend = Opaque\n; Pass 2: HOUSEFX_tank_l.tga Blend = Add\n;         Primary Gradient = Modulate, Ambient/Diffuse = 0\n;         mask: black = nothing, white = full player-color glow", "files": ["GeneralsMD/Code/GameEngineDevice/Source/W3DDevice/GameClient/W3DAssetManager.cpp (Recolor_Mesh, getMeshColorMethods, recolorHouseFxPasses)"], "note": "Not committed yet (working tree)."}, {"id": "ScorchAtlas", "name": "Terrain scorch atlas 4×4 + ScorchTexture", "area": "Rendering & art", "date": "12–13/09/2026", "sum": "Scorch mark atlas grew from 3×3 to a 4×4 grid (15 scorch cells + shadow blob), texture set from GameData, tighter packing and per-mark rotation.", "body": "<p>The terrain scorch texture is an atlas. Vanilla used a 3×3 grid with a 50%-of-cell gap between cells and a hardcoded <code>EXScorch01.tga<\/code>.<\/p>\n<ul><li><b>4×4 grid<\/b> (<code>SCORCH_PER_ROW = 4<\/code>, <code>SCORCH_MARKS_IN_TEXTURE = 16<\/code>). <code>SCORCH_1<\/code>…<code>SCORCH_15<\/code> are now one contiguous block, and <code>SHADOW_SCORCH<\/code> moved to the last cell (15). The old <code>SCORCH_5<\/code> gap is filled.<\/li>\n<li><b>Fixed-pixel packing<\/b>: the atlas is assumed to be <b>512×512<\/b> with a <b>4 px<\/b> gap between cells and around the border (<code>SCORCH_TEXTURE_SIZE_PIXELS<\/code>, <code>SCORCH_TEXTURE_GAP_PIXELS<\/code>). Change these together with the texture.<\/li>\n<li><b>GameData <code>ScorchTexture<\/code><\/b> picks the atlas (default <code>EXScorch01.tga<\/code>).<\/li>\n<li>FXList <code>TerrainScorch Type = RANDOM<\/code> now picks from <code>SCORCH_1<\/code>…<code>SCORCH_8<\/code> (was 1…4). Named types up to <code>SCORCH_15<\/code> are parseable.<\/li>\n<li>Each mark's UVs are <b>rotated by a hash of its world position<\/b>, so repeated marks don't all face the same way. No RNG, so it's save/load stable and doesn't affect sim determinism.<\/li>\n<li>Bugfix: the mark bounding box overshoot that the old wide gap hid is clamped, so marks don't bleed into neighbouring cells.<\/li><\/ul>", "ex": "GameData\n  ScorchTexture = EXScorch01.tga   ; 512x512, 4x4 cells, 4px gaps; cell 16 = shadow blob\nEnd\n\nFXList FX_BigBoom\n  TerrainScorch\n    Type = RANDOM      ; SCORCH_1..SCORCH_8, or a named SCORCH_1..SCORCH_15\n    Radius = 20\n  End\nEnd", "files": ["Core/GameEngine/Include/Common/GameType.h (Scorches enum)", "Core/GameEngine/Source/GameClient/FXList.cpp", "Core/GameEngineDevice/Include/W3DDevice/GameClient/W3DScorch.h", "Core/GameEngineDevice/Source/W3DDevice/GameClient/W3DScorch.cpp", "Core/GameEngineDevice/Source/W3DDevice/GameClient/TerrainTex.cpp", "GeneralsMD/Code/GameEngine/Include/Common/GlobalData.h / Source/Common/GlobalData.cpp"]}, {"id": "TreadFixes", "name": "Tank tread UV scrolling fixes", "area": "Rendering & art", "date": "19–23/09/2026", "sum": "W3DTankDraw / W3DTankTruckDraw: out-of-bounds write fixed, and multi-pass TREADS* meshes now count as one tread.", "body": "<ul><li><b>Out-of-bounds fix:<\/b> the tread-gathering loop had no <code>MAX_TREADS_PER_TANK<\/code> guard. A single <code>TREADS*<\/code> sub-mesh with several UV-scrolling vertex materials could write past the fixed <code>m_treads[]<\/code> array.<\/li>\n<li><b>Multi-pass treads:<\/b> a <code>TREADS*<\/code> sub-mesh with several passes has one LinearOffset material per pass, and each used to register as a separate tread. Two multi-pass treads filled every slot, and the remaining <code>TREADS*<\/code> meshes never scrolled. Each sub-mesh is now registered once. This matters for tread meshes that use an extra glow or detail pass.<\/li><\/ul>", "ex": "", "files": ["Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DTankDraw.cpp", "Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DTankTruckDraw.cpp"]}, {"id": "DecalRendering", "name": "Decal rendering: color fix, culling, persistent decals", "area": "Rendering & art", "date": "12–14/09/2026", "sum": "Fixes decal colors collapsing to blue, adds opt-in off-screen/shroud culling for free-floating decals, object-bound INI decals and a global MaxDecalCount.", "body": "<ul><li><b>Color bugfix<\/b> (<code>Shadow.h<\/code>): packing a decal color OR'd the scaled R/G/B into the blue byte without shifting, so e.g. white decals came out pure blue. Channels are now shifted into place.<\/li>\n<li><b>Culling for free-floating decals<\/b>: decals with no owning render object (RadiusDecal, DecalUpdateV2) were never visibility-checked. A new opt-in <code>ShadowTypeInfo::m_allowOffscreenCulling<\/code> flag, copied onto the Shadow, lets <code>renderShadows()<\/code> skip them when off-screen or under the local player's shroud. It's off by default, so reticles and radius cursors are unchanged. Currently only DecalUpdateV2 sets it.<\/li>\n<li><b>Persistent object decals<\/b>: <code>Drawable::setPersistentDecal(texture, sizeX, sizeY, style)<\/code> goes through <code>DrawModule<\/code>/<code>W3DModelDraw<\/code>. It uses the same object-bound path as <code>setTerrainDecal()<\/code>, with free culling and shroud awareness, and <code>SHADOW_ALPHA_DECAL<\/code> or <code>SHADOW_ADDITIVE_DECAL<\/code> style. W3DModelDraw caches the decal so a ConditionState model rebuild re-applies it (fix). Used by PersistentDecalUpdateV2.<\/li>\n<li><b>GameData <code>MaxDecalCount<\/code><\/b> (default 32): a global cap on concurrent DecalUpdateV2 decals.<\/li><\/ul>", "ex": "GameData\n  MaxDecalCount = 32   ; max concurrent DecalUpdateV2 decals\nEnd", "files": ["GeneralsMD/Code/GameEngine/Include/GameClient/Shadow.h", "GeneralsMD/Code/GameEngineDevice/Source/W3DDevice/GameClient/Shadow/W3DProjectedShadow.cpp", "GeneralsMD/Code/GameEngine/Include/GameClient/Drawable.h / Source/GameClient/Drawable.cpp", "GeneralsMD/Code/GameEngine/Include/Common/DrawModule.h", "Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DModelDraw.cpp", "Core/GameEngine/Include/GameClient/RadiusDecal.h / RadiusDecal.cpp"]}, {"id": "LaserWeapons", "name": "Laser weapons: barrel bones and impact FX/OCL", "area": "Weapons", "date": "08–15/09/2026", "sum": "Lasers alternate between WeaponFireFXBone barrels, and fire ProjectileDetonationFX/OCL at the beam's impact point, oriented along the beam.", "body": "<ul><li><b>Per-barrel laser origin:<\/b> if <code>LaserBoneName<\/code> is set it still wins. If it's empty, the laser asks the firer's Drawable for the current barrel's <code>WeaponFireFXBone<\/code> (<code>Drawable::getWeaponFireFXBoneName()<\/code>), so ClipSize-driven alternation (<code>WEAPONA01<\/code>, <code>WEAPONA02<\/code>…) works for lasers with no new INI fields. W3DModelDraw now remembers each barrel's FX bone name to support this.<\/li>\n<li><b>Impact FX/OCL:<\/b> lasers never spawn a real projectile, so vanilla never fired <code>ProjectileDetonationFX<\/code>/<code>ProjectileDetonationOCL<\/code> for them. They now fire at the laser's impact point, whether it hit the target or the ground.<\/li>\n<li><b>OCL orientation:<\/b> nuggets with <code>Disposition = LIKE_EXISTING<\/code> now face along the beam instead of angle 0.<\/li><\/ul>", "ex": "Weapon MyLaserCannon\n  LaserName = MyLaserBeam\n  ; LaserBoneName left empty -> uses WeaponFireFXBone per barrel\n  ProjectileDetonationFX = FX_LaserImpact\n  ProjectileDetonationOCL = OCL_LaserScorch\nEnd", "files": ["GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Weapon.cpp / Include/GameLogic/Weapon.h (createLaser)", "GeneralsMD/Code/GameEngine/Source/GameClient/Drawable.cpp (getWeaponFireFXBoneName)", "Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DModelDraw.cpp (m_fxBoneName)"]}, {"id": "DamageTypes", "name": "New damage types: HEALING_* and OVERTIME1–8", "area": "Game logic & INI", "date": "11–15/09/2026", "sum": "Per-KindOf healing damage types that behave exactly like HEALING, and 8 dedicated damage-over-time channels.", "body": "<ul><li><b><code>HEALING_VEHICLE<\/code>, <code>HEALING_INFANTRY<\/code>, <code>HEALING_STRUCTURE<\/code>, <code>HEALING_AIRCRAFT<\/code><\/b> (38–41). Each can get its own ArmorSet percentage, so a healer can be tuned per healed KindOf. They're treated as <code>DAMAGE_HEALING<\/code> everywhere via the new <code>IsHealingDamage()<\/code> helper: they redirect to attemptHealing, don't count as an attack, and don't break stealth. Use that helper, not <code>== DAMAGE_HEALING<\/code>, in new code.<\/li>\n<li><b><code>OVERTIME1<\/code>…<code>OVERTIME8<\/code><\/b> (42–49): trigger and tick types for DamageOverTimeUpdateV2. They're separate from FLAME/POISON so they don't inherit those resistances or visuals, and there are 8 channels so up to 8 independent DoT modules can coexist on one object.<\/li><\/ul>", "ex": "Armor MyTankArmor\n  Armor = HEALING_VEHICLE 100%\n  Armor = HEALING_INFANTRY 0%\n  Armor = OVERTIME1 50%\nEnd", "files": ["Core/GameEngine/Include/GameLogic/Damage.h", "Core/GameEngine/Source/GameLogic/System/Damage.cpp"]}, {"id": "HealthBeforeDamage", "name": "DamageInfo: health before the hit", "area": "Game logic & INI", "date": "19/09/2026", "sum": "DamageInfoOutput carries the victim's health right before the hit (for overkill checks). Save format bumped to version 2.", "body": "<p><code>ActiveBody<\/code> copies its <code>m_prevHealth<\/code> into <code>damageInfo-&gt;out.m_healthBeforeDamage<\/code>, so die modules (e.g. BreakApartDeathBehaviorV2) can compute this hit's raw damage as a percentage of the health just before it. The DamageInfo xfer version went from 1 to 2. Older saves still load, but saves made with this build won't load in builds without it.<\/p>", "ex": "", "files": ["Core/GameEngine/Include/GameLogic/Damage.h", "Core/GameEngine/Source/GameLogic/System/Damage.cpp (xfer v2)", "GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Body/ActiveBody.cpp"]}, {"id": "ConditionSlots", "name": "Extra condition slots: RIDER9–32, ARMORSET_RIDER, HEALING_DETAIL", "area": "Game logic & INI", "date": "10–26/09/2026", "sum": "More rider slots across WeaponSet, ModelCondition and ObjectStatus; ArmorSet rider conditions; a HEALING_DETAIL weapon set; dedicated special power enums.", "body": "<ul><li><b>RIDER9<\/b>…<b>RIDER32<\/b> were added to WeaponSet conditions (<code>WEAPON_RIDER9<\/code>…), model conditions (<code>RIDER9<\/code>…) and object status (<code>STATUS_RIDER9<\/code>…) for RiderChangeContainV2. Vanilla stops at 8.<\/li>\n<li><b><code>ARMORSET_RIDER1<\/code>…<code>RIDER8<\/code><\/b> mirror the weapon set rider conditions and can be used for anything.<\/li>\n<li><b>WeaponSet <code>HEALING_DETAIL<\/code><\/b> keeps a healing weapon off the normal orderable slot until a module (HealAIUpdateV2) sets the flag, the same pattern as <code>MINE_CLEARING_DETAIL<\/code>.<\/li>\n<li><b>Special powers<\/b> <code>SPECIAL_SWITCH_STATE<\/code> (SwitchStateV2) and <code>SPECIAL_SHIELD_GENERATOR<\/code> (ShieldGenerator V2 modules) are dedicated enum values. Don't reuse them for other powers.<\/li><\/ul>", "ex": "WeaponSet\n  Conditions = HEALING_DETAIL\n  Weapon = PRIMARY RepairBeam\nEnd", "files": ["GeneralsMD/Code/GameEngine/Include/GameLogic/WeaponSetType.h / WeaponSet.h / Source/GameLogic/Object/WeaponSet.cpp", "GeneralsMD/Code/GameEngine/Include/Common/ModelState.h / Source/Common/BitFlags.cpp", "Core/GameEngine/Include/Common/ObjectStatusTypes.h / Source/Common/System/ObjectStatusTypes.cpp", "GeneralsMD/Code/GameEngine/Include/GameLogic/ArmorSet.h", "GeneralsMD/Code/GameEngine/Include/Common/SpecialPowerType.h / Source/Common/RTS/SpecialPower.cpp, ActionManager.cpp"]}, {"id": "DisabledMaskParser", "name": "INI parser: DisabledTypes masks", "area": "Game logic & INI", "date": "13/09/2026", "sum": "INI::parseDisabledMaskType reads DisabledTypes with the same ALL / NONE / +X / -X grammar as DamageTypes fields.", "body": "<p>A new generic field parser lets any module expose a \"which disabled states matter to me\" field without hand-rolling a token grammar. It's used by <code>W3DPersistentAnimModelDraw<\/code>'s <code>AnimateThroughDisabledTypes<\/code>.<\/p>", "ex": "AnimateThroughDisabledTypes = ALL -DISABLED_HELD", "files": ["Core/GameEngine/Include/Common/INI.h", "Core/GameEngine/Source/Common/INI/INI.cpp"]}, {"id": "ModuleHooks", "name": "Engine hooks used by mod modules", "area": "Developer hooks", "date": "08–26/09/2026", "sum": "Small virtual hooks and overrides added to vanilla classes so V2 modules can plug in without special cases.", "body": "<ul><li><code>ContainModule::handleKillPilot(damager)<\/code>: a rider-change container can handle <code>DAMAGE_KILLPILOT<\/code> itself (RiderChangeContainV2 <code>ScuttleOnDeath = No<\/code>). The default returns FALSE, which runs the vanilla combat-bike path. <code>ActiveBody<\/code> calls it.<\/li>\n<li><code>ContainModule::friend_getVisibleRiders()<\/code>: multi-rider drawing (OverlordContainV2).<\/li>\n<li><code>SpecialPowerUpdateInterface<\/code> auto-trigger: a non-pure default no-op called by automatic triggers such as SwitchStateWhenDamagedBehaviorV2.<\/li>\n<li><code>Drawable::setFrenzyTintColorOverride()<\/code> / <code>Object::doTempWeaponBonus(…, tintColorOverride)<\/code>: a custom <code>TINT_STATUS_FRENZY<\/code> color for WeaponBonusUpdateV2. It's not saved, so after a load the default color shows until the effect ends.<\/li>\n<li><code>Drawable::setPersistentDecal()<\/code> and <code>getWeaponFireFXBoneName()<\/code>: see the decal and laser entries.<\/li><\/ul>", "ex": "", "files": ["GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ContainModule.h", "GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SpecialPowerUpdateModule.h", "GeneralsMD/Code/GameEngine/Include/GameClient/Drawable.h", "GeneralsMD/Code/GameEngine/Include/GameLogic/Object.h / Helper/TempWeaponBonusHelper.cpp"]}, {"id": "DebugLeftovers", "name": "Temporary diagnostics to remove", "area": "Cleanup", "date": "12–21/09/2026", "sum": "Two @debug traces are still in the code and should be removed once their investigations are closed.", "body": "<ul><li><code>W3DFileSystem.cpp<\/code>: logs local-vs-archive resolution for any file name containing \"corch\" (from the ScorchTexture override investigation).<\/li>\n<li><code>PhysicsUpdate.cpp<\/code>: a per-frame trace for objects whose template name contains \"DebrisPiece\" (from BreakApartDeathBehaviorV2 floating debris).<\/li><\/ul>\n<p>Both go through DEBUG_LOG, so Release builds are unaffected, but Debug logs get noisy.<\/p>", "ex": "", "files": ["GeneralsMD/Code/GameEngineDevice/Source/W3DDevice/GameClient/W3DFileSystem.cpp", "GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/PhysicsUpdate.cpp"]}];
const EBY={}; ENGINE.forEach(e=>EBY[e.id]=e);
const EAREAS=[...new Set(ENGINE.map(e=>e.area))];
function engVis(){ return filter!=="vanilla"; }
function engCard(e){ return `<a class="card" href="#engine/${e.id}"><b>${esc(e.name)}<i class="dot mod"></i></b><p>${esc(e.sum)}</p></a>`; }
function renderEngineIndex(){
  document.title="Engine changes · Zero Hour Module Codex";
  let h=`<div class="eyebrow"><span class="badge mod">Engine change</span></div><h1>Engine changes from vanilla</h1>
  <p class="lead">Changes to the engine itself that aren't a module of their own: rendering and art pipeline, weapons, new enum values and INI parsers, and hooks the V2 modules rely on. Collected from the <code>GeneralsMod @feature / @fix / @bugfix</code> tags in the source.</p>`;
  EAREAS.forEach(a=>{ const l=ENGINE.filter(e=>e.area===a); h+=`<h2>${esc(a)} <small>${l.length}</small></h2><div class="grid">${l.map(engCard).join("")}</div>`; });
  $("#main").innerHTML=h; renderSide("engine"); scrollTo(0,0);
}
function renderEngine(id){
  const e=EBY[id]; document.title=e.name+" · Zero Hour Module Codex";
  let h=`<div class="eyebrow"><span class="badge cat">${esc(e.area)}</span><span class="badge mod">Engine change</span>${e.note?`<span class="badge patched">${esc(e.note)}</span>`:""}</div>
  <h1>${esc(e.name)}</h1><p class="lead">${esc(e.sum)}</p>
  <h2>How it works</h2><div class="prose">${e.body}</div>`;
  if(e.ex) h+=`<h2>Example</h2>${codeBlock(e.ex)}`;
  h+=`<h2>Source</h2><dl class="meta"><dt>Added</dt><dd>${esc(e.date)}</dd><dt>Files</dt><dd>${e.files.map(esc).join("<br>")}</dd></dl>
  <p style="margin-top:22px"><a href="#engine">← All engine changes</a></p>`;
  $("#main").innerHTML=h; renderSide("engine/"+id); scrollTo(0,0);
}
const CATS=["Update / behavior","AI update","Die / death","Contain","Damage","Upgrade","Create","Collide / crate","Special power","Body","Client update","Draw"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let filter="all";
try{ filter=localStorage.getItem("zhmc-filter")||"all"; }catch(e){}

function fieldsOf(m){ return m.groups.flatMap(([gid,role])=>G[gid].fields.map(f=>({...f,src:G[gid].src,role,nested:G[gid].nested}))); }
function vis(m){ return filter==="all" || (filter==="mod"? m.origin==="mod" : m.origin!=="mod"); }
function badge(m){ return m.origin==="mod"?'<span class="badge mod">Mod-original</span>':m.origin==="patched"?'<span class="badge patched">Vanilla · patched by mod</span>':'<span class="badge vanilla">Vanilla</span>'; }

/* sidebar */
function renderSide(cur){
  let h="";
  if(engVis()){
    h+=`<h4><span><a href="#engine" style="padding:0;color:inherit">Engine changes</a></span><span>${ENGINE.length}</span></h4>`;
    ENGINE.forEach(e=>h+=`<a href="#engine/${e.id}" class="${cur==="engine/"+e.id?"on":""}"><span>${esc(e.name)}</span><i class="dot mod" title="Engine change"></i></a>`);
  }
  CATS.forEach(c=>{
    const list=MODS.filter(m=>m.cat===c&&vis(m)); if(!list.length) return;
    h+=`<h4><span>${c}</span><span>${list.length}</span></h4>`;
    list.forEach(m=>h+=`<a href="#${m.name}" class="${m.name===cur?"on":""}"><span>${m.name}</span>${m.origin!=="vanilla"?`<i class="dot ${m.origin}" title="${m.origin==="mod"?"Mod-original":"Patched by mod"}"></i>`:""}</a>`);
  });
  $("#side").innerHTML=h;
  const on=$("#side a.on"); if(on) on.scrollIntoView({block:"nearest"});
}

/* INI highlighter */
function ini(src){
  return esc(src).split("\n").map(l=>{
    let c=""; const i=l.indexOf(";"); if(i>=0){c=`<span class="c">${l.slice(i)}</span>`; l=l.slice(0,i);}
    l=l.replace(/^(\s*)(Behavior|Body|Draw|ClientUpdate|Object|Weapon|InheritableModule|End)\b/,'$1<span class="w">$2</span>')
       .replace(/^(\s*)([A-Za-z][\w%]*)(\s*=)/,'$1<span class="k">$2</span>$3');
    return l+c;
  }).join("\n");
}
function codeBlock(src){ return `<div class="code"><button class="copy" data-copy>Copy</button><pre>${ini(src)}</pre></div>`; }

function roleLabel(role,g){
  if(role==="own") return "this module's own fields";
  if(role==="mixin") return g.src==="UpgradeMuxData"?"upgrade trigger fields (mixed in)":"death filter fields (mixed in)";
  if(role==="nested") return "sub-block: "+esc(g.nested);
  return "inherited";
}
function fieldTable(fields,hl){
  let h='<div class="tablewrap"><table><thead><tr><th>Field</th><th>Type</th><th>Default</th><th>What it does</th></tr></thead><tbody>';
  fields.forEach(f=>{
    h+=`<tr id="f-${esc(f.n)}" class="${hl&&f.n.toLowerCase()===hl?"hl":""}"><td class="f">${esc(f.n)}</td><td class="t">${esc(f.t)}</td><td class="dv">${esc(f.d)}</td><td class="x">${esc(f.x)}${f.i?' <span class="inf">(same-named field elsewhere)</span>':""}${f.e&&f.e!=="(sub-block)"?`<span class="eg">${esc(f.n)} = ${esc(f.e)}</span>`:""}</td></tr>`;
  });
  return h+"</tbody></table></div>";
}

function compareControls(m){
  const others=MODS.filter(o=>o.name!==m.name&&!m.cp.includes(o.name));
  let h='<div class="actions">';
  m.cp.forEach(c=>h+=`<button class="btn ${BY[c].origin==="mod"||m.origin==="mod"?"primary":""}" data-cmp="${m.name}|${c}">Compare with ${esc(c)}</button>`);
  h+=`<select class="btn" id="cmpany" aria-label="Compare with another module"><option value="">${m.cp.length?"Compare with another module…":"Compare with…"}</option>`+
     others.map(o=>`<option value="${o.name}">${o.name}${o.origin==="mod"?"  (V2 / mod)":""}</option>`).join("")+"</select>";
  return h+"</div>";
}

function renderModule(name,hl){
  const m=BY[name]; if(!m) return renderHome();
  document.title=m.name+" · Zero Hour Module Codex";
  let h=`<div class="eyebrow"><code>${m.key} = ${m.name} ModuleTag_XX</code><span class="badge cat">${m.cat}</span>${badge(m)}</div>
  <h1>${m.name}</h1><p class="lead">${esc(m.sum)}</p>${compareControls(m)}
  <h2>How it works</h2><div class="prose">${m.body}</div>
  <h2>Example <small>INI, inside an Object definition</small></h2>${codeBlock(m.ex)}`;
  const own=m.groups.filter(g=>g[1]!=="nested");
  const total=fieldsOf(m).length;
  h+=`<h2>Fields <small>${total?total+" fields, parsed from the module's FieldParse tables":"this module has no INI fields of its own"}</small></h2>`;
  if(!total) h+=`<p class="prose">Only the module line and <code>End</code> are needed. Everything it does is fixed in code or driven by other modules/global data.</p>`;
  m.groups.forEach(([gid,role],i)=>{
    const g=G[gid]; if(!g.fields.length) return;
    const title=`<span>${esc(g.src)}</span><span class="role">${roleLabel(role,g)} · ${g.fields.length}</span>`;
    if(role==="own"||(i===0)) h+=`<h3>${title}</h3>`+fieldTable(g.fields,hl);
    else h+=`<details class="fold" ${hl&&g.fields.some(f=>f.n.toLowerCase()===hl)?"open":""}><summary>${title}</summary>${fieldTable(g.fields,hl)}</details>`;
  });
  if(m.notes.length){
    h+=`<h2>Developer notes <small>comments from the mod's source</small></h2><details class="fold"><summary>${m.notes.length} note${m.notes.length>1?"s":""} from ${esc(m.header.split("/").pop())}</summary><div class="inner">${m.notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")}</div></details>`;
  }
  h+=`<h2>Source</h2><dl class="meta"><dt>Header</dt><dd>${esc(m.header)}</dd><dt>Source</dt><dd>${esc(m.cpp||"—")}</dd><dt>Base classes</dt><dd>${esc(m.bases.join(", "))}</dd><dt>Module data</dt><dd>${esc(m.data)}</dd></dl>`;
  $("#main").innerHTML=h; renderSide(name);
  if(hl){ const r=document.getElementById("f-"+[...fieldsOf(m)].find(f=>f.n.toLowerCase()===hl)?.n); if(r) r.scrollIntoView({block:"center"}); else scrollTo(0,0);} else scrollTo(0,0);
}

function renderCompare(a,b){
  const A=BY[a],B=BY[b]; if(!A||!B) return renderHome();
  document.title=a+" vs "+b+" · Zero Hour Module Codex";
  const fa=fieldsOf(A),fb=fieldsOf(B),ma={},mb={};
  fa.forEach(f=>ma[f.n]=ma[f.n]||f); fb.forEach(f=>mb[f.n]=mb[f.n]||f);
  const rank=n=>!mb[n]?0:!ma[n]?1:(ma[n].d!==mb[n].d||ma[n].t!==mb[n].t)?2:3;
  const names=[...new Set([...fa.map(f=>f.n),...fb.map(f=>f.n)])].map((n,i)=>[n,i]).sort((x,y)=>rank(x[0])-rank(y[0])||x[1]-y[1]).map(x=>x[0]);
  let cBoth=0,cA=0,cB=0,cDiff=0;
  const rows=names.map(n=>{
    const x=ma[n],y=mb[n]; let cls="",st="";
    if(x&&y){ cBoth++; if(x.d!==y.d||x.t!==y.t){cls="diff";st="default differs";cDiff++;} else st="both"; }
    else if(x){cls="onlyA";st="only "+a;cA++;} else {cls="onlyB";st="only "+b;cB++;}
    const cell=f=>f?`<code>${esc(f.t)}</code>${f.d?` · default <code>${esc(f.d)}</code>`:""}<span class="srcn">${esc(f.src)}</span>`:'<span class="inf">not available</span>';
    const desc=(x&&y&&x.x!==y.x)?`<b>${esc(a)}:</b> ${esc(x.x)}<br><b>${esc(b)}:</b> ${esc(y.x)}`:esc((x||y).x);
    return `<tr class="${cls}"><td class="f">${esc(n)}</td><td class="t">${cell(x)}</td><td class="t">${cell(y)}</td><td class="x">${desc}</td><td class="st">${st}</td></tr>`;
  }).join("");
  const col=m=>`<div class="cmpcol"><div class="eyebrow"><span class="badge cat">${m.cat}</span>${badge(m)}</div><h1><a href="#${m.name}" style="color:inherit;text-decoration:none">${m.name}</a></h1><p class="lead">${esc(m.sum)}</p></div>`;
  let h=`<div class="eyebrow"><code>Compare</code><button class="btn" data-swap="${b}|${a}">Swap sides</button></div><h1 style="font-size:22px">${a} <span style="color:var(--muted)">vs</span> ${b}</h1>
  <div class="cmphead">${col(A)}${col(B)}</div>
  <h2>Field by field <small>${cBoth} shared (${cDiff} with a different type or default) · ${cA} only in ${a} · ${cB} only in ${b}</small></h2>
  <div class="legend"><span><i style="background:var(--onlyA)"></i>only in ${a}</span><span><i style="background:var(--onlyB)"></i>only in ${b}</span><span><i style="background:var(--diff)"></i>shared, default or type differs</span></div>
  <div class="tablewrap"><table><thead><tr><th>Field</th><th>${esc(a)}</th><th>${esc(b)}</th><th>What it does</th><th>Status</th></tr></thead><tbody>${rows||'<tr><td colspan="5">Neither module has INI fields.</td></tr>'}</tbody></table></div>
  <h2>How each one works</h2><div class="cmpbody"><div class="prose"><h3>${a}</h3>${A.body}</div><div class="prose"><h3>${b}</h3>${B.body}</div></div>
  <h2>Examples</h2><div class="cmpbody"><div>${codeBlock(A.ex)}</div><div>${codeBlock(B.ex)}</div></div>`;
  $("#main").innerHTML=h; renderSide(a); scrollTo(0,0);
}

function renderHome(){
  document.title="Zero Hour Module Codex";
  const list=MODS.filter(vis), nf=Object.values(G).reduce((s,g)=>s+g.fields.length,0);
  const pairs=MODS.filter(m=>m.origin==="mod"&&m.cp.length);
  let h=`<div class="hero"><div><div class="eyebrow"><code>GeneralsMD · ModuleFactory + W3DModuleFactory</code></div><h1>Every module the game can load</h1>
  <p class="lead">All ${MODS.length} modules registered in the engine, with how they work, every INI field and an example block. Search above to open one, or pick from the list. Mod-original modules (the V2 family) can be compared field by field with the vanilla module they build on.</p></div>
  <div class="stats"><div class="stat"><b>${MODS.length}</b><span>modules</span></div><div class="stat"><b>${MODS.filter(m=>m.origin==="mod").length}</b><span>mod-original</span></div><div class="stat"><b>${nf}</b><span>unique fields</span></div></div></div>
  ${engVis()?`<h2><a href="#engine" style="color:inherit;text-decoration:none">Engine changes from vanilla</a> <small>${ENGINE.length} · not modules, changes to the engine itself</small></h2><div class="grid">${ENGINE.map(engCard).join("")}</div>`:""}
  <h2>Mod modules and their vanilla counterparts</h2><div class="pairs">${pairs.map(m=>`<div class="pair"><a href="#${m.name}">${m.name}</a><span class="vs">builds on</span><a href="#${m.cp[0]}">${m.cp[0]}</a><button class="btn" data-cmp="${m.name}|${m.cp[0]}">Compare</button></div>`).join("")}</div>`;
  CATS.forEach(c=>{
    const l=list.filter(m=>m.cat===c); if(!l.length) return;
    h+=`<h2>${c} <small>${l.length}</small></h2><div class="grid">${l.map(m=>`<a class="card" href="#${m.name}"><b>${m.name}${m.origin!=="vanilla"?`<i class="dot ${m.origin}"></i>`:""}</b><p>${esc(m.sum)}</p></a>`).join("")}</div>`;
  });
  $("#main").innerHTML=h; renderSide(null); scrollTo(0,0);
}

/* routing */
let cmpState=null;
function route(){
  const hsh=decodeURIComponent(location.hash.slice(1));
  if(cmpState&&hsh===cmpState.join("-vs-")) return renderCompare(...cmpState);
  const cm=hsh.match(/^(\w+)-vs-(\w+)$/);
  if(cm&&BY[cm[1]]&&BY[cm[2]]) return renderCompare(cm[1],cm[2]);
  if(hsh==="engine") return renderEngineIndex();
  if(hsh.startsWith("engine/")&&EBY[hsh.slice(7)]) return renderEngine(hsh.slice(7));
  if(BY[hsh]) return renderModule(hsh,pendingHl);
  renderHome();
}
let pendingHl=null;
window.addEventListener("hashchange",()=>{route();pendingHl=null;});
function go(name,hl){ pendingHl=hl||null; if(location.hash==="#"+name) route(); else location.hash=name; }
function compare(a,b){ cmpState=[a,b]; const h=a+"-vs-"+b; if(location.hash==="#"+h) route(); else location.hash=h; }

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-cmp],[data-swap]");
  if(c){ const [a,b]=(c.dataset.cmp||c.dataset.swap).split("|"); compare(a,b); return; }
  const cp=e.target.closest("[data-copy]");
  if(cp){ const txt=cp.nextElementSibling.textContent;
    const ok=()=>toast("Copied to clipboard");
    try{ navigator.clipboard.writeText(txt).then(ok,()=>selectPre(cp.nextElementSibling)); }catch(err){ selectPre(cp.nextElementSibling); } }
});
document.addEventListener("change",e=>{ if(e.target.id==="cmpany"&&e.target.value){ const cur=decodeURIComponent(location.hash.slice(1)); compare(cur,e.target.value);} });
function selectPre(el){ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected — press Ctrl+C to copy"); }
function toast(t){ const el=$("#toast"); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,1600); }
$("#home").addEventListener("click",()=>{ cmpState=null; history.pushState("", "", location.pathname); renderHome(); });
$("#home").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#home").click(); });

document.querySelectorAll(".chip").forEach(b=>{
  b.setAttribute("aria-pressed",b.dataset.f===filter);
  b.onclick=()=>{ filter=b.dataset.f; try{localStorage.setItem("zhmc-filter",filter);}catch(e){}
    document.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed",x===b)); route(); };
});

/* search */
const q=$("#q"), R=$("#results"); let hits=[], sel=0;
function search(s){
  s=s.trim().toLowerCase(); if(!s) return [];
  const out=[];
  MODS.forEach(m=>{
    if(!vis(m)) return;
    const n=m.name.toLowerCase(); let score=0, field=null;
    if(n===s) score=100; else if(n.startsWith(s)) score=80; else if(n.includes(s)) score=60;
    else if(s.split(/\s+/).every(w=>n.includes(w))) score=50;
    if(!score){ const f=fieldsOf(m).find(f=>f.n.toLowerCase()===s)||fieldsOf(m).find(f=>f.n.toLowerCase().startsWith(s)&&s.length>2);
      if(f){score=40; field=f.n;} }
    if(!score&&s.length>2&&(m.sum.toLowerCase().includes(s)||m.cat.toLowerCase().includes(s))) score=20;
    if(score) out.push({m,score,field});
  });
  if(engVis()) ENGINE.forEach(e=>{
    const n=e.name.toLowerCase(), t=(e.id+" "+e.sum+" "+e.body.replace(/<[^>]+>/g," ")+" "+e.ex).toLowerCase(); let score=0;
    if(n.startsWith(s)||e.id.toLowerCase()===s) score=70; else if(n.includes(s)) score=55; else if(s.length>2&&t.includes(s)) score=35;
    if(score) out.push({m:{name:e.name,cat:"Engine change · "+e.area,sum:e.sum,origin:"engine"},score,field:null,eng:e.id});
  });
  return out.sort((a,b)=>b.score-a.score||a.m.name.localeCompare(b.m.name)).slice(0,40);
}
function showResults(){
  hits=search(q.value); sel=0;
  if(!q.value.trim()){ R.hidden=true; q.setAttribute("aria-expanded","false"); return; }
  R.innerHTML=hits.length?hits.map((h,i)=>`<div class="res" role="option" data-i="${i}" aria-selected="${i===sel}"><b>${h.m.name}${h.m.origin==="mod"?' <i class="dot mod" style="display:inline-block"></i>':""}</b><span class="rk">${h.m.cat}</span><span class="rc">${esc(h.m.sum)}</span>${h.field?`<span class="hit">field: ${esc(h.field)}</span>`:""}</div>`).join(""):`<div class="noresult">No module or field matches “${esc(q.value)}”.</div>`;
  R.hidden=false; q.setAttribute("aria-expanded","true");
}
function pick(i){ const h=hits[i]; if(!h) return; R.hidden=true; q.value=""; q.blur(); cmpState=null; if(h.eng){ location.hash="engine/"+h.eng; return; } go(h.m.name,h.field?h.field.toLowerCase():null); }
q.addEventListener("input",showResults);
q.addEventListener("focus",()=>{ if(q.value) showResults(); });
q.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!hits.length) return; sel=(sel+(e.key==="ArrowDown"?1:hits.length-1))%hits.length;
    R.querySelectorAll(".res").forEach((r,i)=>r.setAttribute("aria-selected",i===sel)); R.querySelector(`[data-i="${sel}"]`).scrollIntoView({block:"nearest"}); }
  else if(e.key==="Enter"){ e.preventDefault(); pick(sel); }
  else if(e.key==="Escape"){ R.hidden=true; q.blur(); }
});
R.addEventListener("mousedown",e=>{ const r=e.target.closest(".res"); if(r){ e.preventDefault(); pick(+r.dataset.i); }});
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) R.hidden=true; });
document.addEventListener("keydown",e=>{ if(e.key==="/"&&document.activeElement!==q&&!/input|select|textarea/i.test(document.activeElement.tagName)){ e.preventDefault(); q.focus(); } });
route();
</script>
