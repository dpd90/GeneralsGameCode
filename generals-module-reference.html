ehouseDockUpdateModuleData","groups":[["SupplyWarehouseDockUpdateModuleData","own"],["DockUpdateModuleData","inherited"]],"cp":[],"notes":[]},{"name":"SwayClientUpdate","key":"ClientUpdate","cat":"Client update","origin":"vanilla","sum":"Client update that makes trees and plants sway in the wind.","body":"Applies a wind-driven sway to the object's model (visual only), using the global wind settings. No fields.","ex":"ClientUpdate = SwayClientUpdate ModuleTag_Sway\nEnd","header":"Core/GameEngine/Include/GameClient/Module/SwayClientUpdate.h","cpp":"Core/GameEngine/Source/GameClient/Drawable/Update/SwayClientUpdate.cpp","bases":["ClientUpdateModule"],"data":"(none)","groups":[],"cp":[],"notes":[]},{"name":"SwitchStateV2","key":"Behavior","cat":"Update / behavior","origin":"mod","sum":"Toggles a unit in place between two full configurations (model condition, weapon set, armor set, status, command set, locomotor), optionally timed.","body":"Mod-original. Holds two configurations, <b>DefaultState<\/b> and <b>AlteredState<\/b>; each is <code>&lt;ModelCondition&gt; &lt;WeaponSetFlag&gt; &lt;ArmorSetFlag&gt; &lt;ObjectStatus&gt; &lt;CommandSet&gt; &lt;LocomotorSet&gt;<\/code> — every value must be given (repeat the same value in both states for anything that should not change). Pressing the button toggles between them, with no container or second unit involved. <b>Lifetime<\/b> &gt; 0 makes AlteredState auto-revert after that time. On switching to Altered it fires <b>WeaponIn<\/b>/<b>OCLIn<\/b>/<b>FXListIn<\/b> at itself; switching back fires the *Out ones.\n<br><br><b>Simple mode:<\/b> if <b>ConditionStateType<\/b> is set, Default/AlteredState are ignored entirely and toggling only sets/clears that one model condition flag (e.g. USER_1).\n<br><br><b>Pairing:<\/b> the button side is the companion module <i>SwitchStateV2Activate<\/i>, which must use the same <b>SpecialPowerTemplate<\/b>. A <i>SwitchStateWhenDamagedBehaviorV2<\/i> with the same template can trigger it automatically from damage (always drives toward Altered; with Lifetime it keeps re-arming while damage continues).","ex":"Behavior = SwitchStateV2Activate ModuleTag_SwitchButton\n  SpecialPowerTemplate = SpecialPower_SiegeMode\nEnd\nBehavior = SwitchStateV2 ModuleTag_Switch\n  SpecialPowerTemplate = SpecialPower_SiegeMode\n  ;               ModelCond   WeaponSet   ArmorSet   Status        CommandSet             Locomotor\n  DefaultState  = NONE        NONE        NONE       NONE          MyTank_NormalCmdSet    SET_NORMAL\n  AlteredState  = DEPLOYED    PLAYER_UPGRADE CRATE_UPGRADE_ONE DEPLOYED MyTank_SiegeCmdSet SET_SLUGGISH\n  Lifetime      = 0          ; permanent until toggled back\n  FXListIn      = FX_SiegeDeploy\n  FXListOut     = FX_SiegeUndeploy\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SwitchStateV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/SwitchStateV2.cpp","bases":["SpecialPowerUpdateModule"],"data":"SwitchStateV2ModuleData","groups":[["SwitchStateV2ModuleData","own"]],"cp":["SpecialAbilityUpdate","ShieldGeneratorUpdateV2"],"notes":["FILE: SwitchStateV2.h ////////////////////////////////////////////////////////////////////////// Desc:   Flips a unit between two fully-specified configurations (model condition, weapon set, armor set, status bit, command set override, locomotor set) in place, with no Contain module and no second unit involved. Optionally auto-reverts to DefaultState after Lifetime frames; a Lifetime of 0 means the switch is permanent until manually toggled back. GeneralsMod @feature Dimitar 14/09/2026: if ConditionStateType is given in INI, this module switches into a much simpler mode instead -- DefaultState/AlteredState are completely ignored (model condition, weapon set, armor set, status bit, command set override, locomotor set all stay untouched), and toggling just sets/clears that one ModelConditionFlagType flag. Everything else about the module (WeaponIn/Out, OCLIn/Out, FXListIn/Out, Lifetime, the button/damage triggers) works identically either way -- this is purely an alternate, cheaper way to drive the \"what changes\" half of the module, for cases that only ever needed a single condition flag and don't want to fill out two full SwitchStateInfo blocks to get it. This module holds the state and does the actual work. It cannot also be what the CommandButton (Command = SPECIAL_POWER) talks to directly, because Object::doSpecialPower only ever looks for a module satisfying SpecialPowerModuleInterface (getSpecialPower()), and the GameLogic update scheduler only ever schedules real UpdateModule* instances -- a single class cannot be both without multiply inheriting from two incompatible concrete BehaviorModule branches. So the button-facing half lives in the companion module SwitchStateV2Activate (see SwitchStateV2Activate.h); both must be given on the object with the SAME SpecialPowerTemplate so they find each other. This mirrors how the retail game already pairs SpecialAbility (trigger) with SpecialAbilityUpdate (the module that actually does the work). GeneralsMod @feature Dimitar 11/09/2026: an object can optionally also (or instead) carry a SwitchStateWhenDamagedBehaviorV2 module sharing the same SpecialPowerTemplate, to trigger the switch automatically off qualifying damage rather than (or in addition to) the button. It calls notifyQualifyingDamage() below instead of initiateIntentToDoSpecialPower() -- see that method's declaration comment for how its semantics differ from the button's toggle.","One full configuration for the unit -- everything SwitchStateV2 is allowed to change about the object. DefaultState and AlteredState are each one of these; toggling flips between them. Every field must be given in the INI (duplicate the current value in both states for anything that should not change).","GeneralsMod @feature Dimitar 11/09/2026: automatic (non-button) trigger hook, called by a companion SwitchStateWhenDamagedBehaviorV2 module when its damage condition is met. Unlike initiateIntentToDoSpecialPower() above (which always TOGGLES, for the manual button), this always drives us TOWARD AlteredState: if Lifetime is 0 (permanent), it is a one-time switch -- once Altered, further calls are a no-op and we never auto-revert. If Lifetime > 0, every call (whether we're currently Default or already Altered) re-applies AlteredState, re-fires WeaponIn/OCLIn/FXListIn (each idempotent/self-rate-limiting), and restarts the revert countdown from now -- so sustained qualifying damage keeps us Altered indefinitely and we only revert once damage stops coming in for a full Lifetime. See SwitchStateV2.h's file comment for why this can't just reuse the button's toggle path.","Reads one full SwitchStateInfo off a single INI line: ModelConditionState WeaponSetCondition ArmorSetCondition StatusBitType CommandSetEntry LocomotorSetType, in that order. Mirrors RiderChangeContainModuleData::parseRiderInfo. static*/ void SwitchStateV2ModuleData::parseStateInfo( INI* ini, void *instance, void *store, const void* /*userData*/ )","Apply every property of the target state. For the flag-style properties (model condition, weapon set, armor set, status) we clear whatever the OTHER state would have set first, so nothing lingers if DefaultState and AlteredState differ there. Command set override and locomotor set are plain selectors, so they're just re-applied directly. */","GeneralsMod @feature Dimitar 14/09/2026: ConditionStateType, when given, REPLACES DefaultState/AlteredState entirely -- toggle just the one flag and return, completely ignoring model condition/weapon set/armor set/status bit/command set/locomotor set from both states.","Fires WeaponIn/OCLIn/FXListIn once (at our own position). Called whenever we switch TO AlteredState -- both from the manual button (initiateIntentToDoSpecialPower) and from automatic damage-driven triggers (notifyQualifyingDamage). Each is independently optional and safe to call redundantly: the weapon naturally rate-limits to its own reload time, and OCL/FXList are simply skipped if not configured. */","Called by our companion SwitchStateV2Activate module (via the base SpecialPowerModule's doSpecialPower -> initiateIntentToDoSpecialPower hand-off) whenever the button is pressed. This is a pure self-toggle -- no target object, position, or waypoint is used. */","Called by a companion SwitchStateWhenDamagedBehaviorV2 module whenever its damage condition is met. See the declaration comment in SwitchStateV2.h for the full semantics -- in short: drives us toward AlteredState (never toggles back to Default), and if Lifetime is configured, refreshes the revert countdown every time this is called instead of only on the first call. */"]},{"name":"SwitchStateV2Activate","key":"Behavior","cat":"Special power","origin":"vanilla","sum":"Button-facing half of SwitchStateV2: the special power module a SPECIAL_POWER command button triggers.","body":"Mod-original. Does only standard special power bookkeeping (science gating, recharge, initiate sound) and forwards to the SwitchStateV2 on the same object with the same <b>SpecialPowerTemplate<\/b>, which performs the toggle. Needed because the command button only finds SpecialPowerModules, while the state logic must be an UpdateModule. All configuration lives on SwitchStateV2.","ex":"Behavior = SwitchStateV2Activate ModuleTag_01\n  SpecialPowerTemplate = SpecialPower_SwitchState\n  StartsReady          = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SwitchStateV2Activate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/SwitchStateV2Activate.cpp","bases":["SpecialPowerModule"],"data":"SwitchStateV2ActivateModuleData","groups":[["SpecialPowerModuleData","inherited"]],"cp":["SpecialAbility","ShieldGeneratorActivateV2"],"notes":[]},{"name":"SwitchStateWhenDamagedBehaviorV2","key":"Behavior","cat":"Damage","origin":"mod","sum":"Automatically triggers the companion SwitchStateV2 when the object takes qualifying damage.","body":"Mod-original, a pure DamageModule (no per-frame update). When a hit of a type in <b>DamageTypes<\/b> has actual (post-armor) damage >= <b>DamageAmount<\/b> (or <= with <b>GreaterOrEqual<\/b> = No), it calls the SwitchStateV2 on the same object sharing <b>SpecialPowerTemplate<\/b>. That always drives toward AlteredState: with SwitchStateV2 Lifetime = 0 it's a one-time permanent switch; with Lifetime > 0 every qualifying hit re-arms the revert countdown, so sustained damage keeps it Altered. Can be upgrade-gated (StartsActive = No + TriggeredBy); upgrades are permanent unlocks.","ex":"Behavior = SwitchStateV2 ModuleTag_Switch\n  SpecialPowerTemplate = SpecialPower_SwitchState\n  ConditionStateType   = USER_2\n  Lifetime             = 5000\nEnd\nBehavior = SwitchStateWhenDamagedBehaviorV2 ModuleTag_DamageTrigger\n  SpecialPowerTemplate = SpecialPower_SwitchState\n  DamageTypes          = NONE +EXPLOSION +FLAME\n  DamageAmount         = 25\n  GreaterOrEqual       = Yes\n  StartsActive         = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SwitchStateWhenDamagedBehaviorV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/SwitchStateWhenDamagedBehaviorV2.cpp","bases":["DamageModule","UpgradeMux"],"data":"SwitchStateWhenDamagedBehaviorV2ModuleData","groups":[["SwitchStateWhenDamagedBehaviorV2ModuleData","own"],["UpgradeMuxData","mixin"],["DamageModuleData","inherited"]],"cp":["FireWeaponWhenDamagedBehavior"],"notes":["FILE: SwitchStateWhenDamagedBehaviorV2.h /////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 11/09/2026 Automatic, damage-triggered counterpart to the button-driven SwitchStateV2 / SwitchStateV2Activate pair (see SwitchStateV2.h). Modeled on FireWeaponWhenDamagedBehavior's DamageTypes/DamageAmount INI shape, but instead of firing a weapon when the threshold is met, it calls notifyQualifyingDamage() on the companion SwitchStateV2 module (matched by SpecialPowerTemplate, same pairing convention SwitchStateV2Activate uses) so that module reacts to the damage itself. This module does no state-holding of its own -- it is a pure DamageModule (no per-frame Update needed) that just watches onDamage() and, when the configured threshold is met, hands off to SwitchStateV2. See SwitchStateV2::notifyQualifyingDamage()'s declaration comment in SwitchStateV2.h for exactly what happens on the receiving end (short version: drives toward AlteredState, refreshes the revert countdown on every qualifying hit if Lifetime is configured, is a one-time switch if not). Usage -- give the target object all three modules, all sharing the same SpecialPowerTemplate: Behavior = SwitchStateV2Activate ModuleTag_01     ; optional -- only needed if a player can also SpecialPowerTemplate = SpecialPower_SwitchState  ; manually trigger/toggle the same switch End Behavior = SwitchStateV2 ModuleTag_02 SpecialPowerTemplate = SpecialPower_SwitchState DefaultState  = ... AlteredState  = ... Lifetime      = 0 End Behavior = SwitchStateWhenDamagedBehaviorV2 ModuleTag_03 SpecialPowerTemplate = SpecialPower_SwitchState DamageTypes    = NONE +EXPLOSION +FLAME         ; DamageTypes uses the same NONE/ALL/+X/-X token ; syntax as every other DamageTypeFlags field in ; the engine (see INI::parseDamageTypeFlags) -- ; bare names with no +/- prefix are a parse error. DamageAmount   = 25.0 GreaterOrEqual = Yes                            ; No = trigger when damage <= DamageAmount instead ; Optional -- same UpgradeMux gating FireWeaponWhenDamagedBehavior/AutoHealBehavior use. Omit both ; and the module is simply always active (the default). Upgrades are permanent/one-shot, so this ; is a durable unlock, not a re-togglable enable/disable switch. StartsActive   = No TriggeredBy    = Upgrade_SomeUpgradeName        ; from Upgrade.ini; module activates once this completes End","Damage has been dealt -- check whether it qualifies, and if so hand off to whichever companion module (matched by SpecialPowerTemplate) implements SpecialPowerUpdateInterface. In practice that's the object's SwitchStateV2 module; see SwitchStateWhenDamagedBehaviorV2.h for the intended INI pairing. */","Find the companion module for our SpecialPowerTemplate and let it react. This is the same lookup SpecialPowerModule::initiateIntentToDoSpecialPower() uses to find the module a command button hands off to -- we're just an automatic trigger using the same mechanism.","Xfer method Version Info: 1: Initial version 2: added UpgradeMux (StartsActive/TriggeredBy/etc.) support (GeneralsMod) */"]},{"name":"TechBuildingBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Tech building: captured neutral structures that pulse an FX while owned and revert to neutral when destroyed.","body":"Used on capturable tech buildings (oil derrick, hospital, artillery platform…). While owned by a player it plays <b>PulseFX<\/b> every <b>PulseFXRate<\/b>. When it 'dies' it does not get destroyed: it goes back to neutral (rubble state) and can be recaptured after repair.","ex":"Behavior = TechBuildingBehavior ModuleTag_Tech\n  PulseFX     = FX_TechBuildingPulse\n  PulseFXRate = 2000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/TechBuildingBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/TechBuildingBehavior.cpp","bases":["UpdateModule","DieModuleInterface"],"data":"TechBuildingBehaviorModuleData","groups":[["TechBuildingBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"TensileFormationUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Springy linked-formation movement (avalanche/ice-sheet pieces) that cracks and slides together.","body":"Used for map props that move as a connected 'tensile' group (e.g. collapsing ice or avalanche chunks): once <b>Enabled<\/b> (usually by script), pieces pull on their neighbours like springs and slide, playing <b>CrackSound<\/b>.","ex":"Behavior = TensileFormationUpdate ModuleTag_Tensile\n  Enabled    = No\n  CrackSound = IceCrack\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/TensileFormationUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/TensileFormationUpdate.cpp","bases":["UpdateModule"],"data":"TensileFormationUpdateModuleData","groups":[["TensileFormationUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"ToppleUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Makes an object (tree, lamp post, sign) topple over when a vehicle hits it.","body":"When crushed/collided with by a vehicle (or hit by blast push), the object falls over in the direction of impact, accelerating from <b>InitialVelocityPercent<\/b>/<b>InitialAccelPercent<\/b> and bouncing (<b>BounceVelocityPercent<\/b>, <b>BounceFX<\/b>). It may leave a <b>StumpName<\/b> object, and can be killed when it starts or finishes toppling. <b>ToppleLeftOrRightOnly<\/b> constrains the fall direction (fences).","ex":"Behavior = ToppleUpdate ModuleTag_Topple\n  ToppleFX   = FX_TreeFall\n  BounceFX   = FX_TreeBounce\n  StumpName  = TreeStumpSmall\n  KillWhenFinishedToppling = Yes\n  InitialVelocityPercent   = 20%\n  InitialAccelPercent      = 1%\n  BounceVelocityPercent    = 30%\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ToppleUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/ToppleUpdate.cpp","bases":["UpdateModule","CollideModuleInterface"],"data":"ToppleUpdateModuleData","groups":[["ToppleUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"TransitionDamageFX","key":"Behavior","cat":"Damage","origin":"vanilla","sum":"Plays FX, OCLs and particle systems at bones when the object transitions to a new damage state.","body":"When the body state changes to Damaged, ReallyDamaged or Rubble, up to 12 FXLists, 12 OCLs and 12 particle systems configured for that state play once at their bones (e.g. explosion + smoke plume when a building becomes badly damaged). Entry syntax: <code>ReallyDamagedFXList1 = Loc: X:0 Y:0 Z:10 FXList:FX_StructureMediumDamage<\/code> (or <code>Bone:BoneName<\/code> with RandomBone:Yes), OCLs use <code>OCL:<\/code>, particles <code>PSys:<\/code>. <b>DamageFXTypes/DamageOCLTypes/DamageParticleTypes<\/b> filter by the damage type that caused the transition.","ex":"Behavior = TransitionDamageFX ModuleTag_Transition\n  DamagedParticleSystem1       = Bone:Smoke01 RandomBone:No PSys:StructureTransitionSmallSmoke\n  ReallyDamagedFXList1         = Loc: X:0 Y:0 Z:10 FXList:FX_StructureMediumDamage\n  ReallyDamagedParticleSystem1 = Bone:Fire01 RandomBone:No PSys:StructureTransitionMediumFire\n  RubbleOCL1                   = Loc: X:0 Y:0 Z:0 OCL:OCL_StructureRubbleDebris\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/TransitionDamageFX.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Damage/TransitionDamageFX.cpp","bases":["DamageModule"],"data":"TransitionDamageFXModuleData","groups":[["TransitionDamageFXModuleData","own"],["DamageModuleData","inherited"]],"cp":["ContainedTransitionDamageFXV2"],"notes":[]},{"name":"TransportAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"AI for transports: validates evacuate orders and moves to a legal spot before unloading.","body":"Standard AIUpdate for transports (APCs, helicopters). When told to evacuate it checks that unloading is legal here (e.g. not over water/cliff) and may move to a better place first. Uses only the AIUpdate fields.","ex":"Behavior = TransportAIUpdate ModuleTag_AI\n  AutoAcquireEnemiesWhenIdle = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/TransportAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/TransportAIUpdate.cpp","bases":["AIUpdateInterface"],"data":"AIUpdateModuleData","groups":[["AIUpdateModuleData","own"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"TransportContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Vehicle/aircraft transport: carries units in slots, unloads them, optional healing and armed-passenger upgrades.","body":"The standard transport container used on Humvees, APCs, Chinooks, Battle Buses, etc. Capacity is measured in <b>Slots<\/b> (each passenger's TransportSlotCount). Controls where and how passengers exit (<b>ExitBone<\/b>, <b>ScatterNearbyOnExit<\/b>, <b>ExitDelay<\/b>, <b>DelayExitInAir<\/b>), whether they are pre-loaded (<b>InitialPayload<\/b>), healed (<b>HealthRegen%PerSec<\/b>) and whether armed passengers switch the transport to its upgraded weapon set (<b>ArmedRidersUpgradeMyWeaponSet<\/b>). All OpenContain fields also apply (PassengersAllowedToFire for firing ports, DamagePercentToUnits on death...).","ex":"Behavior = TransportContain ModuleTag_Transport\n  Slots                 = 5\n  AllowInsideKindOf     = INFANTRY\n  ForbidInsideKindOf    = HERO\n  PassengersAllowedToFire = Yes\n  ExitDelay             = 250\n  NumberOfExitPaths     = 1\n  DoorOpenTime          = 1000\n  ScatterNearbyOnExit   = Yes\n  HealthRegen%PerSec    = 0\n  DamagePercentToUnits  = 100%\n  EnterSound            = HumveeEnter\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/TransportContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/TransportContain.cpp","bases":["OpenContain"],"data":"TransportContainModuleData","groups":[["TransportContainModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"TunnelContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"GLA Tunnel Network: passengers are stored in the owning player's shared tunnel system.","body":"A version of OpenContain whose passengers are kept in the owning player's TunnelTracker, so every tunnel of that player shares one passenger list (capacity is set by MaxTunnelCapacity in GameData.ini). Units entering one tunnel can exit from any other. Contained units are healed to full over <b>TimeForFullHeal<\/b>. If the last tunnel of the network dies, everyone inside is killed.","ex":"Behavior = TunnelContain ModuleTag_Tunnel\n  TimeForFullHeal = 5000\n  AllowInsideKindOf = INFANTRY VEHICLE\n  ForbidInsideKindOf = AIRCRAFT HUGE_VEHICLE\n  NumberOfExitPaths = 3\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/TunnelContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/TunnelContain.cpp","bases":["OpenContain","CreateModuleInterface"],"data":"TunnelContainModuleData","groups":[["TunnelContainModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"UndeadBody","key":"Body","cat":"Body","origin":"vanilla","sum":"Body with two lives: the first death is intercepted and the object continues with SecondLifeMaxHealth (Battle Bus).","body":"The first time the object would die, it instead gets the SECOND_LIFE status, its max health set to <b>SecondLifeMaxHealth<\/b> (full), and its SlowDeath modules can run a 'fake' death (see BattleBusSlowDeathBehavior). The second death is handled normally.","ex":"Body = UndeadBody ModuleTag_Body\n  MaxHealth           = 400\n  InitialHealth       = 400\n  SecondLifeMaxHealth = 200\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/UndeadBody.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Body/UndeadBody.cpp","bases":["ActiveBody"],"data":"UndeadBodyModuleData","groups":[["UndeadBodyModuleData","own"],["ActiveBodyModuleData","inherited"]],"cp":[],"notes":[]},{"name":"UnitCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Crate that gives the collector some free units.","body":"On pickup creates <b>UnitCount<\/b> units of <b>UnitName<\/b> for the collector's player near the crate.","ex":"Behavior = UnitCrateCollide ModuleTag_Crate\n  RequiredKindOf = INFANTRY VEHICLE\n  UnitCount      = 2\n  UnitName       = GLAInfantryRebel\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/UnitCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/UnitCrateCollide.cpp","bases":["CrateCollide"],"data":"UnitCrateCollideModuleData","groups":[["UnitCrateCollideModuleData","own"],["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"UnpauseSpecialPowerUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that starts (unpauses) the recharge timer of a special power that StartsPaused.","body":"Pairs with a SpecialPowerModule that has <b>StartsPaused = Yes<\/b>: when this upgrade triggers, the timer of <b>SpecialPowerTemplate<\/b> starts ticking, so the power only becomes available after the upgrade (logic-side equivalent of NEED_UPGRADE on buttons).","ex":"Behavior = UnpauseSpecialPowerUpgrade ModuleTag_Unpause\n  TriggeredBy          = Upgrade_UnlockPower\n  SpecialPowerTemplate = SpecialPower_MyPower\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/UnpauseSpecialPowerUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/UnpauseSpecialPowerUpgrade.cpp","bases":["UpgradeModule"],"data":"UnpauseSpecialPowerUpgradeModuleData","groups":[["UnpauseSpecialPowerUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"UpgradeDie","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"On death, removes an object upgrade from the producer that created this object (e.g. Battlemaster drone, Overlord add-on).","body":"Objects created by an object-upgrade (drones, add-ons) carry this so that when they die the parent object loses <b>UpgradeToRemove<\/b>, allowing the player to buy it again.","ex":"Behavior = UpgradeDie ModuleTag_UpgradeDie\n  DeathTypes      = ALL\n  UpgradeToRemove = Upgrade_AmericaBattleDrone\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/UpgradeDie.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Die/UpgradeDie.cpp","bases":["DieModule"],"data":"UpgradeDieModuleData","groups":[["UpgradeDieModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"VeterancyCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Crate that gives a veterancy level to the collector (or everything in range). Also used by pilots entering vehicles.","body":"On pickup grants one veterancy level to the collector, or to every friendly unit within <b>EffectRange<\/b>. <b>AddsOwnerVeterancy<\/b> gives the crate owner's veterancy instead of +1 (used by the USA pilot 'crate' when a pilot enters a vehicle, with <b>IsPilot<\/b> = Yes).","ex":"Behavior = VeterancyCrateCollide ModuleTag_Crate\n  RequiredKindOf     = VEHICLE\n  EffectRange        = 0\n  AddsOwnerVeterancy = Yes\n  IsPilot            = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/VeterancyCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/VeterancyCrateCollide.cpp","bases":["CrateCollide"],"data":"VeterancyCrateCollideModuleData","groups":[["VeterancyCrateCollideModuleData","own"],["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"VeterancyGainCreate","key":"Behavior","cat":"Create","origin":"vanilla","sum":"On creation, gives the object a starting veterancy level if the player has a science.","body":"If the player owns <b>ScienceRequired<\/b>, newly created objects start at <b>StartingLevel<\/b> (VETERAN, ELITE, HEROIC). This is how General's promotions like 'Veteran Tanks' work.","ex":"Behavior = VeterancyGainCreate ModuleTag_Vet\n  StartingLevel   = VETERAN\n  ScienceRequired = SCIENCE_TankVeteran\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/VeterancyGainCreate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Create/VeterancyGainCreate.cpp","bases":["CreateModule"],"data":"VeterancyGainCreateModuleData","groups":[["VeterancyGainCreateModuleData","own"]],"cp":[],"notes":[]},{"name":"W3DBreakApartPieceDraw","key":"Draw","cat":"Draw","origin":"mod","sum":"Draw module for BreakApartDeathBehaviorV2 debris pieces: shows exactly one subobject of a reference model, set at spawn.","body":"Mod-original. Has no INI fields. The object it's on is spawned by BreakApartDeathBehaviorV2 (BreakApartPieceOCL / RemainPieceOCL); right after spawning, that module tells this draw which reference model and which bone/subobject to display. It clones the whole reference model, hides every other subobject, and positions it exactly like the dying unit so the one visible part lines up where it was, then follows the piece as it is flung by physics. The remainder variant shows everything that was not broken off. Put this on the generic debris object template used by the OCL.","ex":"Object BreakApartPiece\n  KindOf = NO_COLLIDE\n  Draw = W3DBreakApartPieceDraw ModuleTag_Draw\n  End\n  Behavior = PhysicsBehavior ModuleTag_Physics\n    Mass = 5\n    AllowBouncing = Yes\n    KillWhenRestingOnGround = Yes\n  End\n  Behavior = LifetimeUpdate ModuleTag_Life\n    MinLifetime = 6000\n    MaxLifetime = 8000\n  End\n  Body = InactiveBody ModuleTag_Body\n  End\nEnd","header":"GeneralsMD/Code/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DBreakApartPieceDraw.h","cpp":"GeneralsMD/Code/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DBreakApartPieceDraw.cpp","bases":["DrawModule"],"data":"(none)","groups":[],"cp":["W3DDebrisDraw"],"notes":["FILE: W3DBreakApartPieceDraw.h /////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 19/09/2026 Desc: Draw module for a BreakApartDeathBehaviorV2 debris piece. Deliberately carries NO INI fields of its own (MAKE_STANDARD_MODULE_MACRO, not _WITH_MODULE_DATA -- same shape as W3DDebrisDraw) -- every instance starts with nothing loaded, and is told, exactly once, right after the Object it belongs to is spawned, which single subobject of which reference model to display, via DrawModule::setBreakApartPiece() (see Common/DrawModule.h for why that hand-off is a non-pure virtual on the shared DrawModule base rather than a dedicated interface: BreakApartDeathBehaviorV2.cpp, the caller, is a z_gameengine file and must never #include anything from this class's own GameEngineDevice header). GeneralsMD-only: registered in the SHARED Core/GameEngineDevice/.../W3DModuleFactory.cpp under an #if RTS_ZEROHOUR guard (see that file), same as W3DPersistentAnimModelDraw/ W3DWheeledTankDraw -- this header/source pair does not exist on the plain Generals build at all.","GeneralsMod @feature Dimitar 19/09/2026: the real entry point -- see DrawModule:: setBreakApartPiece()'s own comment in Common/DrawModule.h. One-shot: a second call while m_renderObject is already set is silently ignored, same re-entrancy guard shape as W3DDebrisDraw::setModelName(). Default argument deliberately NOT repeated here (it's on the DrawModule base declaration, the only one that matters for calls made through a DrawModule*, which is how every real caller reaches this).","GeneralsMod @feature Dimitar 19/09/2026: the complementary \"remainder\" entry point -- see DrawModule::setBreakApartRemainder()'s own comment in Common/DrawModule.h. Same one-shot guard shape as setBreakApartPiece() above (a second call while m_renderObject is already set is silently ignored) -- the two entry points are mutually exclusive on any one instance in practice (BreakApartDeathBehaviorV2 only ever calls one or the other on a given spawned Object, never both), but sharing the guard costs nothing and keeps that safe either way.","GeneralsMod @feature Dimitar 19/09/2026: the fixed delta (captured once, in setBreakApartPiece()) between the debris Drawable's own transform and this piece's bone-aligned root transform -- identity when no live bone transform was available (old behavior: just mirror the Drawable's transform every frame). doDrawModule()/reactToTransformChange() recompose currentDrawableTransform * m_pieceOffset every frame instead of a bare copy, so the bone alignment established at spawn time (including any turret/pitch rotation captured then) survives the piece being subsequently flung/tumbled by PhysicsBehavior.","FILE: W3DBreakApartPieceDraw.cpp ///////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 19/09/2026 Desc: See W3DBreakApartPieceDraw.h. This file lives under GameEngineDevice, so per this mod's own convention it does NOT include \"PreRTS.h\".","Hide every subobject except the one(s) attached to the requested bone -- this is what makes one spawned clone of the reference model visually look like just a single broken-off part. WW3D uses bone index 0 for both \"the skeleton's true root bone\" and \"bone not found\" (see BreakApartModelHelper.h's own comment on the same ambiguity) -- if boneName doesn't resolve, targetBoneIndex ends up 0, which in practice means every subobject gets hidden (no subobject in a normal HLOD is attached directly to the true root), a safe, visually-inert failure mode rather than a crash.","GeneralsMod @feature Dimitar 19/09/2026: align this piece with the bone's ACTUAL live world transform at the moment of death (turret/barrel aim rotation etc -- see the liveBoneWorldTransform comment on DrawModule::setBreakApartPiece() in Common/DrawModule.h), not just the reference model's own bind pose. Default/fallback: mirror the debris Drawable's own plain transform, same as before this feature was added -- m_pieceOffset stays identity unless one of the two corrections below actually fires, so doDrawModule()/ reactToTransformChange() behave exactly as before this feature existed whenever neither does.","Solve for the root transform that makes THIS clone's own copy of targetBoneIndex land exactly at liveBoneWorldTransform: since Get_Bone_Transform(idx) == root * bindChain, and cloneBoneBindXform (captured above, root==identity) IS that bindChain, the desired root is liveBoneWorldTransform * Inverse(bindChain). This assumes both the reference model and the live model are unscaled (or scaled identically) -- Get_Orthogonal_Inverse assumes a pure rotation+translation matrix, same assumption W3DModelDraw:: getCurrentBonePositions() already makes for its own analogous inverse.","GeneralsMod @fix Dimitar 21/09/2026: correct for the target subobject's own visible mesh sitting away from its bone's pivot -- e.g. a barrel bone rigged up at its mount point on the turret, with the actual barrel geometry authored well below (or above) that pivot in the bone's own local space. PhysicsBehavior's ground-clamp only ever knows about this Object's single tracked point (the bone pivot, when one was resolved above) -- it has no idea the visible mesh extends away from that point, so it settles the PIVOT at true ground height and leaves the geometry floating/sunk by however far it sits from that pivot. Root-caused 21/09/2026 (\"BARREL still floats even though TURRET lands correctly\"): this correction used to live INSIDE the `liveBoneWorldTransform != nullptr` branch above, so any bone that fell back to the plain-transform path never got its own mesh-to-pivot offset removed at all -- it just hovered at its authored bind-pose height above wherever PhysicsBehavior settled the piece's root. That fallback path is the COMMON case, not a rare edge case: BreakApartModel is typically subdivided more finely than the live unit's own animated skeleton (see spawnBreakApartDebris()'s own comment -- a bone that exists purely to give one subtree several independent debris chunks, e.g. splitting a barrel into a tube + muzzle brake + mount, has no reason to also exist as a separately-named bone on the LIVE, rendered model), so most resolved bones legitimately have targetBoneIndex != 0 (found on the reference model) while liveBoneWorldTransform is nullptr (no same-named bone on the live model to align against) -- TURRET/BARREL01 in the original report happened to still be real, individually-posed live bones; the rest of that unit's pieces weren't. This correction is therefore gated on targetBoneIndex alone: it only needs the CLONE's own resolved bone index to query that subobject's local bounding box, independent of whether a live transform was also available. Query the target subobject's own local-space bounding box for its lowest point (Center.Z - Extent.Z, i.e. how far the mesh extends below its own pivot; a NEGATIVE box-relative value here means the mesh actually sits ABOVE its pivot, which is what pushes it up into the air once the pivot lands) and shift pieceRootXform's world Z by the negation of that, before it's captured into m_pieceOffset below -- so the correction is baked into the bone-local frame same as the bindChain correction above (when that also ran), and keeps rotating correctly with the piece as applyRandomRotation() tumbles it, rather than being a one-time world-space nudge that would drift out of alignment the moment the piece starts spinning. Best-effort only: for a piece that lands in a wildly different final orientation than its spawn pose, this can't perfectly zero out the gap (that would need per-orientation collision, out of scope) -- it just removes the fixed, always-wrong offset that made every landing look identically bad.","GeneralsMod @fix Dimitar 21/09/2026: root-caused (2nd pass) -- Adjust_Z_Translation() is a raw `Row[2][3] += z`, i.e. it nudges the matrix's WORLD-space Z translation directly, with no regard for pieceRootXform's own rotation. groundOffset, however, was measured along the target subobject's own OBJECT-space Z axis (Get_Obj_Space_Bounding_Box), which only coincides with world-up when that bone's local Z happens to still point straight up -- true for TURRET (which only ever yaws about world Z) but false for anything pitched or mounted at another angle (BARREL01-03's aim pitch, TURRET01-04's own mount angles) -- which is exactly why TURRET landed correctly while everything hanging off it kept floating/sinking by the wrong amount in the wrong direction. Matrix3D::Translate() (unlike Adjust_Z_Translation) post-multiplies -- it rotates the given LOCAL offset by the matrix's own current orientation before adding it to the world translation, which is what actually implements \"push this piece up along its own local Z axis\" for a piece at any orientation, not just one whose local Z is world-up."]},{"name":"W3DDebrisDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"Draw module for debris objects created by OCLs; the model is set by the OCL at creation time.","body":"Used on generic debris objects. The OCL's CreateDebris nugget tells this module which model/animation to use (ModelNames, AnimationSet), so a single debris object template can show many different chunks. No INI fields of its own.","ex":"Draw = W3DDebrisDraw ModuleTag_Draw\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DDebrisDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DDebrisDraw.cpp","bases":["DrawModule","DebrisDrawInterface"],"data":"(none)","groups":[],"cp":["W3DBreakApartPieceDraw"],"notes":[]},{"name":"W3DDefaultDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"Placeholder draw module that draws a default box/marker; used for objects without real art.","body":"Draws nothing meaningful (a debug placeholder). Used on logic-only or test objects that still need a Draw module. No fields.","ex":"Draw = W3DDefaultDraw ModuleTag_Draw\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DDefaultDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DDefaultDraw.cpp","bases":["DrawModule"],"data":"(none)","groups":[],"cp":[],"notes":[]},{"name":"W3DDependencyModelDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"W3DModelDraw for riders/add-ons: only draws when its container draws, attached to a bone of the container.","body":"Used by Overlord/Helix add-ons and OverlordContainV2 riders: the model is drawn only when the container tells it to (right after itself), attached to <b>AttachToBoneInContainer<\/b> on the container's model.","ex":"Draw = W3DDependencyModelDraw ModuleTag_Draw\n  AttachToBoneInContainer = TURRETPOS\n  DefaultConditionState\n    Model = NVOverlordGattling\n  End\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DDependencyModelDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DDependencyModelDraw.cpp","bases":["W3DModelDraw"],"data":"W3DDependencyModelDrawModuleData","groups":[["W3DDependencyModelDrawModuleData","own"],["W3DModelDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":[],"notes":[]},{"name":"W3DLaserDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"Draws laser beams (multi-layered textured beams, optional arc) for laser objects driven by LaserUpdate.","body":"Renders the beam between the laser's endpoints: <b>NumBeams<\/b> concentric beams interpolating from <b>InnerBeamWidth<\/b>/<b>InnerColor<\/b> to <b>OuterBeamWidth<\/b>/<b>OuterColor<\/b>, textured with <b>Texture<\/b> (scrolling at <b>ScrollRate<\/b>, tiled if <b>Tile<\/b>). The beam is at full intensity for <b>MaxIntensityLifetime<\/b>, then fades over <b>FadeLifetime<\/b>. With <b>Segments<\/b> > 1 and <b>ArcHeight<\/b> the beam curves (e.g. electric arcs).","ex":"Draw = W3DLaserDraw ModuleTag_Draw\n  NumBeams       = 3\n  InnerBeamWidth = 0.5\n  OuterBeamWidth = 3.0\n  InnerColor     = R:255 G:255 B:255 A:255\n  OuterColor     = R:255 G:0 B:0 A:128\n  MaxIntensityLifetime = 300\n  FadeLifetime   = 200\n  Texture        = EXLaser.tga\n  ScrollRate     = -2.5\n  Tile           = Yes\n  Segments       = 1\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DLaserDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DLaserDraw.cpp","bases":["DrawModule","LaserDrawInterface"],"data":"W3DLaserDrawModuleData","groups":[["W3DLaserDrawModuleData","own"]],"cp":[],"notes":[]},{"name":"W3DModelDraw","key":"Draw","cat":"Draw","origin":"patched","sum":"Main 3D model draw module: picks the model/animation for each model condition state, turrets, weapon bones, recoil, tracks.","body":"The workhorse Draw module. You define a <b>DefaultConditionState<\/b> and any number of <b>ConditionState<\/b> blocks, each keyed by a set of model condition flags (DAMAGED, MOVING, ATTACKING, REALLYDAMAGED, SNOW, NIGHT, USER_1…). Each block sets the <b>Model<\/b>, <b>Animation<\/b>(s) and mode, turret bones, which subobjects to show/hide, and weapon bone names (fire FX, launch, recoil, muzzle flash) per weapon slot. The best-matching block for the object's current flags is used. <b>AliasConditionState<\/b> reuses the previous block for other flags, <b>TransitionState<\/b> plays animations between states (via TransitionKey). Other fields control recoil, house colour, track marks, extra public bones and LOD.","ex":"Draw = W3DModelDraw ModuleTag_Draw\n  OkToChangeModelColor = Yes\n  TrackMarks = EXTireTrack.tga\n  DefaultConditionState\n    Model              = AVCrusader\n    Turret             = Turret01\n    WeaponFireFXBone   = PRIMARY Muzzle\n    WeaponRecoilBone   = PRIMARY Barrel\n    WeaponMuzzleFlash  = PRIMARY MuzzleFX\n    WeaponLaunchBone   = PRIMARY Muzzle\n  End\n  ConditionState = REALLYDAMAGED\n    Model = AVCrusader_D\n  End\n  AliasConditionState = REALLYDAMAGED MOVING\n  ConditionState = RUBBLE\n    Model = AVCrusader_D\n    ParticleSysBone = Smoke01 SmokeBlack\n  End\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DModelDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DModelDraw.cpp","bases":["DrawModule","ObjectDrawInterface"],"data":"W3DModelDrawModuleData","groups":[["W3DModelDrawModuleData","own"],["ModelConditionInfo","nested"]],"cp":["W3DPersistentAnimModelDraw"],"notes":["GeneralsMod @fix Dimitar 14/09/2026: nukeCurrentRender() unconditionally releases m_terrainDecal whenever the render object is torn down (e.g. a ConditionState-driven Model swap), but the model-rebuild code that follows only recreates m_shadow, never m_terrainDecal -- so any active terrain/persistent decal was silently lost forever on the next model change. These cache the currently-active decal's parameters so it can be reapplied right after the rebuild."]},{"name":"W3DOverlordAircraftDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"W3DModelDraw for aircraft carrying a portable-structure rider (Helix): draws the rider right after itself.","body":"Same as W3DModelDraw plus the Overlord rider-drawing behaviour, used by the China Helix so its add-on (Gattling, Bunker, Propaganda) is drawn attached.","ex":"Draw = W3DOverlordAircraftDraw ModuleTag_Draw\n  DefaultConditionState\n    Model = NVHelix\n  End\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DOverlordAircraftDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DOverlordAircraftDraw.cpp","bases":["W3DModelDraw"],"data":"W3DOverlordAircraftDrawModuleData","groups":[["W3DModelDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":[],"notes":[]},{"name":"W3DOverlordTankDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"W3DTankDraw for the Overlord: explicitly draws the rider (add-on) right after itself.","body":"Same as W3DTankDraw, but draws the OverlordContain rider (Gattling/Propaganda/Bunker add-on) immediately after itself and propagates hidden state to it, so the add-on stays in sync with the tank.","ex":"Draw = W3DOverlordTankDraw ModuleTag_Draw\n  OkToChangeModelColor = Yes\n  TreadAnimationRate   = 2.0\n  DefaultConditionState\n    Model  = NVOverlord\n    Turret = Turret01\n  End\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DOverlordTankDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DOverlordTankDraw.cpp","bases":["W3DTankDraw"],"data":"W3DOverlordTankDrawModuleData","groups":[["W3DModelDrawModuleData","inherited"],["W3DTankDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":["W3DOverlordWheeledTankDraw"],"notes":[]},{"name":"W3DOverlordTruckDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"W3DTruckDraw that draws its contained rider immediately after itself (wheeled Overlord-style carriers).","body":"Same as W3DTruckDraw, plus the Overlord rider-drawing behaviour (draws and hides/shows the contained add-on in sync with itself).","ex":"Draw = W3DOverlordTruckDraw ModuleTag_Draw\n  LeftFrontTireBone  = Tire01\n  RightFrontTireBone = Tire02\n  DefaultConditionState\n    Model = MyCarrierTruck\n  End\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DOverlordTruckDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DOverlordTruckDraw.cpp","bases":["W3DTruckDraw"],"data":"W3DOverlordTruckDrawModuleData","groups":[["W3DModelDrawModuleData","inherited"],["W3DTruckDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":[],"notes":[]},{"name":"W3DOverlordWheeledTankDraw","key":"Draw","cat":"Draw","origin":"mod","sum":"W3DWheeledTankDraw + W3DOverlordTankDraw: wheeled skid-steer draw that also draws its Overlord rider(s).","body":"Mod-original. Everything W3DWheeledTankDraw does (W3DTankDraw + differential Left/RightTireBones spin) plus the Overlord rider drawing (draws contained rider(s) right after itself, propagates hidden state), including OverlordContainV2's multiple visible riders. No new fields.","ex":"Draw = W3DOverlordWheeledTankDraw ModuleTag_Draw\n  TireRotationMultiplier = 0.2\n  LeftTireBones  = Tire01 Tire02 Tire03\n  RightTireBones = Tire04 Tire05 Tire06\n  DefaultConditionState\n    Model  = MyWheeledOverlord\n    Turret = Turret01\n  End\nEnd","header":"GeneralsMD/Code/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DOverlordWheeledTankDraw.h","cpp":"GeneralsMD/Code/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DOverlordWheeledTankDraw.cpp","bases":["W3DWheeledTankDraw"],"data":"W3DWheeledTankDrawModuleData","groups":[["W3DWheeledTankDrawModuleData","own"],["W3DModelDrawModuleData","inherited"],["W3DTankDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":["W3DOverlordTankDraw"],"notes":["FILE: W3DOverlordWheeledTankDraw.h ///////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 23/09/2026 W3DWheeledTankDraw + W3DOverlordTankDraw in one module: everything W3DWheeledTankDraw does (all of W3DTankDraw -- turret, tread debris, tread UV scrolling -- plus the differential LeftTireBones/RightTireBones spin), and everything W3DOverlordTankDraw does (explicitly drawing the contained rider(s) right after ourselves, and propagating setHidden() to them). Built by subclassing W3DWheeledTankDraw (not W3DOverlordTankDraw): the wheel logic owns real per-instance state and INI fields, while the Overlord part is ~two stateless overrides, so it is far cheaper to re-add the Overlord behavior here than to duplicate the wheel code. The Overlord part is a verbatim copy of W3DOverlordTankDraw's doDrawModule()/setHidden() rider handling, including OverlordContainV2's multi-rider friend_getVisibleRiders() support. Usage -- use on an Overlord-style unit (OverlordContain / OverlordContainV2) instead of W3DOverlordTankDraw or W3DWheeledTankDraw: Draw = W3DOverlordWheeledTankDraw ModuleTag_01 ... every W3DTankDraw field (Model, ConditionState, TreadDebrisLeft/Right, ...) ... TireRotationMultiplier = 0.2 LeftTireBones  = Tire01 Tire02 Tire03 RightTireBones = Tire04 Tire05 Tire06 End No new INI fields of its own -- the module data is just W3DWheeledTankDrawModuleData, reused via the plain MAKE_STANDARD_MODULE_MACRO (same pattern ImmortalBody uses for ActiveBodyModuleData).","Wheeled-tank drawing first (turret, treads, tire bones), then -- exactly like W3DOverlordTankDraw -- wake up and draw our visible rider(s), since their render objects are only positioned correctly once ours has been drawn this frame. */"]},{"name":"W3DPersistentAnimModelDraw","key":"Draw","cat":"Draw","origin":"mod","sum":"W3DModelDraw whose animations keep playing while the object is disabled (EMP, subdued, hacked, paralyzed, unmanned) for chosen types.","body":"Mod-original. Every W3DModelDraw field works unchanged. Normally the engine freezes animation when an object is disabled by HACKED, PARALYZED, EMP, SUBDUED or UNMANNED, regardless of AnimationsRequirePower. This module overrides the pause request and silently ignores it when every active disable type is in <b>AnimateThroughDisabledTypes<\/b> (default ALL), so e.g. a stunned unit can keep playing its idle/glow animation. Other pause reasons (types not listed, or underpowered with AnimationsRequirePower) pass through normally. Only those five types matter; listing others is accepted but inert.","ex":"Draw = W3DPersistentAnimModelDraw ModuleTag_Draw\n  AnimateThroughDisabledTypes = ALL -HACKED\n  DefaultConditionState\n    Model         = MyStunUnit\n    Animation     = MyStunUnit.Idle\n    AnimationMode = LOOP\n  End\nEnd","header":"GeneralsMD/Code/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DPersistentAnimModelDraw.h","cpp":"GeneralsMD/Code/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DPersistentAnimModelDraw.cpp","bases":["W3DModelDraw"],"data":"W3DPersistentAnimModelDrawModuleData","groups":[["W3DPersistentAnimModelDrawModuleData","own"],["W3DModelDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":["W3DModelDraw"],"notes":["FILE: W3DPersistentAnimModelDraw.h ///////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 13/09/2026 Just like W3DModelDraw (every existing field still works -- Model, Animation, ConditionState, AnimationsRequirePower, all of it), except a configurable set of DisabledType values can be told to NOT pause this draw module's animation, even though they normally would. Why this exists: Drawable::getShouldAnimate() (GameClient/Drawable.cpp) unconditionally stops animation whenever an object is disabled by any of a fixed, hardcoded set of types -- DISABLED_HACKED, DISABLED_PARALYZED, DISABLED_EMP, DISABLED_SUBDUED, DISABLED_UNMANNED -- regardless of AnimationsRequirePower (that field only ever gates the separate DISABLED_UNDERPOWERED case). There's no INI-level way to opt a specific Draw module out of that for a specific disable type -- e.g. a unit with a subdual-based \"stun\" mechanic that should keep playing an idle/glow animation while stunned, instead of freezing solid. This module adds that opt-out, per Draw module instance, without touching Drawable.cpp at all. How: W3DModelDraw::doDrawModule() unconditionally calls the VIRTUAL setPauseAnimation() every frame with whatever Drawable::getShouldAnimate() decided (which knows nothing of this module's AnimateThroughDisabledTypes field). Rather than letting that pause happen and trying to undo it afterward -- which was the first approach tried here, and turned out to be actively wrong: every single frame the base freezes the model at its current frame (Set_Animation(..., ANIM_MODE_MANUAL)) and an after-the-fact un-pause resumes it from that SAME frame number, since zero time passes between the two calls; the net effect is the animation's position gets reset to itself dozens of times a second, which is indistinguishable from being frozen -- this module instead OVERRIDES setPauseAnimation() itself and silently swallows the incoming pauseAnim==TRUE request whenever every currently-active fixed-list DisabledType (the same five re-derived below -- there's no way to ask the engine \"what disable type caused this?\", only to re-derive it, so if that list in Drawable.cpp ever changes, this needs to be revisited to match) is one we've been told to animate through. Swallowing means the base W3DModelDraw::setPauseAnimation() is never called at all for that request, so the render object's animation state is never touched and simply keeps playing uninterrupted, exactly as if the object had never been disabled. Any other reason to pause (a fixed-list type NOT in AnimateThroughDisabledTypes, or a real DISABLED_UNDERPOWERED pause via AnimationsRequirePower) is passed through to the base class unchanged -- this module only ever suppresses a pause it would otherwise have made, never forces an unpause that wasn't requested, and never suppresses anything except the exact fixed-list types it's configured for. Usage -- give the target object this instead of a plain W3DModelDraw: Draw = W3DPersistentAnimModelDraw ModuleTag_01 ... every existing W3DModelDraw field still works here, unchanged ... AnimateThroughDisabledTypes = ALL -HACKED         ; NONE/ALL/+X/-X tokens, same convention as ; any other DamageTypeFlags-style field ; (e.g. DamageTypes elsewhere in this mod). ; Only HACKED/PARALYZED/EMP/SUBDUED/UNMANNED ; actually do anything here -- every other ; DisabledType (UNDERPOWERED, FREEFALL, ; AWESTRUCK, BRAINWASHED, HELD, the two ; SCRIPT_* ones, DEFAULT) doesn't pause ; animation in the base engine today, so ; listing them here is accepted but inert. ; Default: ALL -- the whole point of this ; module (as opposed to plain W3DModelDraw) ; is to keep animating through everything by ; default; list the field only to carve out ; exceptions you DO still want to freeze for ; (e.g. \"ALL -HACKED\" above). End","USER INCLUDES ////////////////////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 13/09/2026: unlike GameEngine/.cpp files, GameEngineDevice/.cpp files do NOT start with \"PreRTS.h\" -- this subsystem's own precompiled header (cmake_pch.hxx, built from z_gameenginedevice's target_precompile_headers list) covers the same ground, and PreRTS.h itself (Core/GameEngine/Include/Precompiled/PreRTS.h) is not even on this target's include path.","W3DModelDraw::doDrawModule() unconditionally calls this (virtually) every frame with whatever Drawable::getShouldAnimate() decided. Rather than letting a pause happen and undoing it afterward (the first approach tried here -- and actively wrong: each undo resumes from the exact frame it was just frozen at, since no time passes between the freeze and the undo, so the animation's position gets reset to itself every single frame instead of ever advancing -- which looks identical to being frozen), this swallows the incoming pauseAnim==TRUE request entirely when every currently-active blocking DisabledType (from the same fixed five-type list Drawable::getShouldAnimate() uses -- duplicated here since there's no way to ask the engine \"what type caused this?\", only to re-derive it) is one this module has been told to animate through. Swallowing means the base implementation -- and therefore the underlying render object's Set_Animation() call -- is never invoked for that request, so playback is never touched and simply continues. Any other reason to pause (a fixed-list type NOT listed in AnimateThroughDisabledTypes, or a real DISABLED_UNDERPOWERED pause via AnimationsRequirePower) is passed straight through to the base class, unchanged. */","The exact fixed set Drawable::getShouldAnimate() treats as unconditionally animation-stopping, independent of AnimationsRequirePower. KEEP THIS IN SYNC with that function if its own list ever changes."]},{"name":"W3DPoliceCarDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"W3DTruckDraw with flashing police-light dynamic lights.","body":"Same fields as W3DTruckDraw; additionally creates a flashing red/blue dynamic light on the car (civilian police cars).","ex":"Draw = W3DPoliceCarDraw ModuleTag_Draw\n  LeftFrontTireBone  = Tire01\n  RightFrontTireBone = Tire02\n  DefaultConditionState\n    Model = CVPoliceCar\n  End\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DPoliceCarDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DPoliceCarDraw.cpp","bases":["W3DTruckDraw"],"data":"W3DTruckDrawModuleData","groups":[["W3DTruckDrawModuleData","own"],["W3DModelDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":[],"notes":[]},{"name":"W3DProjectileStreamDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"Draws a textured ribbon connecting all projectiles of a stream (Toxin/Flame sprays), with ProjectileStreamUpdate.","body":"Renders a strip of <b>Texture<\/b> of <b>Width<\/b> through the projectiles tracked by ProjectileStreamUpdate, tiled <b>TileFactor<\/b> times and scrolling at <b>ScrollRate<\/b>, with at most <b>MaxSegments<\/b> segments.","ex":"Draw = W3DProjectileStreamDraw ModuleTag_Draw\n  Texture     = EXToxicStream.tga\n  Width       = 5\n  TileFactor  = 1\n  ScrollRate  = 1.5\n  MaxSegments = 20\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DProjectileStreamDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DProjectileStreamDraw.cpp","bases":["DrawModule"],"data":"W3DProjectileStreamDrawModuleData","groups":[["W3DProjectileStreamDrawModuleData","own"]],"cp":[],"notes":[]},{"name":"W3DPropDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"Very cheap batched draw for static props (rocks, debris) that never animate.","body":"Draws a static model <b>ModelName<\/b> through the batched prop renderer. No condition states, no animation — just a fast static prop.","ex":"Draw = W3DPropDraw ModuleTag_Draw\n  ModelName = PRRock01\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DPropDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DPropDraw.cpp","bases":["DrawModule"],"data":"W3DPropDrawModuleData","groups":[["W3DPropDrawModuleData","own"]],"cp":[],"notes":[]},{"name":"W3DRopeDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"Draws a rope (Chinook rappel ropes). Configured at runtime by the code that creates the rope.","body":"Used on the rope object created by ChinookAIUpdate; length, width, colour and wobble are set by that module at runtime. No INI fields.","ex":"Draw = W3DRopeDraw ModuleTag_Draw\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DRopeDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DRopeDraw.cpp","bases":["DrawModule","RopeDrawInterface"],"data":"(none)","groups":[],"cp":[],"notes":[]},{"name":"W3DScienceModelDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"W3DModelDraw that only draws if the local player owns a given science.","body":"Same as W3DModelDraw, but invisible unless the local player has <b>RequiredScience<\/b> (e.g. showing special markers only to players with a certain general's power).","ex":"Draw = W3DScienceModelDraw ModuleTag_Draw\n  RequiredScience = SCIENCE_SomePower\n  DefaultConditionState\n    Model = MyMarker\n  End\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DScienceModelDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DScienceModelDraw.cpp","bases":["W3DModelDraw"],"data":"W3DScienceModelDrawModuleData","groups":[["W3DScienceModelDrawModuleData","own"],["W3DModelDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":[],"notes":[]},{"name":"W3DSupplyDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"W3DModelDraw that hides supply-box bones as the warehouse/pile is depleted.","body":"Same as W3DModelDraw; as supplies are taken, bones named <b>SupplyBonePrefix<\/b>01…NN are hidden proportionally, so the pile visibly shrinks.","ex":"Draw = W3DSupplyDraw ModuleTag_Draw\n  SupplyBonePrefix = SUPPLY\n  DefaultConditionState\n    Model = CBSupplyDock\n  End\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DSupplyDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DSupplyDraw.cpp","bases":["W3DModelDraw"],"data":"W3DSupplyDrawModuleData","groups":[["W3DSupplyDrawModuleData","own"],["W3DModelDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":[],"notes":[]},{"name":"W3DTankDraw","key":"Draw","cat":"Draw","origin":"patched","sum":"W3DModelDraw for tracked vehicles: scrolling tread textures and tread debris particles.","body":"Everything W3DModelDraw does, plus: the tread meshes' texture UVs scroll with movement (<b>TreadAnimationRate<\/b>), counter-rotating when pivoting slowly (<b>TreadPivotSpeedFraction<\/b>), and tread debris particle systems (<b>TreadDebrisLeft/Right<\/b>) are emitted while moving.","ex":"Draw = W3DTankDraw ModuleTag_Draw\n  OkToChangeModelColor = Yes\n  TrackMarks           = EXTankTrack.tga\n  TreadAnimationRate   = 2.0\n  TreadDebrisLeft      = TrackDebrisDirtLeft\n  TreadDebrisRight     = TrackDebrisDirtRight\n  DefaultConditionState\n    Model  = AVCrusader\n    Turret = Turret01\n    WeaponFireFXBone = PRIMARY Muzzle\n  End\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DTankDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DTankDraw.cpp","bases":["W3DModelDraw"],"data":"W3DTankDrawModuleData","groups":[["W3DTankDrawModuleData","own"],["W3DModelDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":["W3DWheeledTankDraw"],"notes":["a single TREADS* submesh with more than one UV-scroll-mapped vertex material could increment m_treadCount past the end of the fixed m_treads[MAX_TREADS_PER_TANK] array, writing out of bounds into whatever memory follows it (adjacent members, or -- once a pool block gets reused -- a completely unrelated later-allocated object). The outer loop above already guards m_treadCount, but only checks it between sub-objects, not between vertex materials within the same sub-object. GeneralsMod @fix Dimitar 23/09/2026: a TREADS* submesh with multiple passes has one LinearOffset vertex material per pass. Previously each one registered the SAME submesh as a separate tread, so 2 multi-pass treads filled all MAX_TREADS_PER_TANK slots early and later TREADS* submeshes were never visited -> their mappers kept the W3D-authored UV delta and scrolled constantly. Now: zero the delta on EVERY LinearOffset mapper of every TREADS* submesh, but register each submesh only once (the Material_Override is per mesh and the renderer applies it to each pass anyway)."]},{"name":"W3DTankTruckDraw","key":"Draw","cat":"Draw","origin":"patched","sum":"Draw module for vehicles with both treads and wheels (half-tracks): combines W3DTankDraw and W3DTruckDraw.","body":"Has the truck fields (dust, dirt spray, tyre bones, tyre rotation) and the tank fields (tread debris, tread animation) at the same time.","ex":"Draw = W3DTankTruckDraw ModuleTag_Draw\n  Dust               = TankDust\n  LeftFrontTireBone  = Tire01\n  RightFrontTireBone = Tire02\n  TireRotationMultiplier = 0.2\n  TreadAnimationRate = 2.0\n  TreadDebrisLeft    = TrackDebrisDirtLeft\n  TreadDebrisRight   = TrackDebrisDirtRight\n  DefaultConditionState\n    Model = MyHalftrack\n  End\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DTankTruckDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DTankTruckDraw.cpp","bases":["W3DModelDraw"],"data":"W3DTankTruckDrawModuleData","groups":[["W3DTankTruckDrawModuleData","own"],["W3DModelDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":[],"notes":["a single TREADS* submesh with more than one UV-scroll-mapped vertex material could increment m_treadCount past the end of the fixed m_treads[MAX_TREADS_PER_TANK] array, writing out of bounds into whatever memory follows it (adjacent members, or -- once a pool block gets reused -- a completely unrelated later-allocated object). The outer loop above already guards m_treadCount, but only checks it between sub-objects, not between vertex materials within the same sub-object. GeneralsMod @fix Dimitar 23/09/2026: a TREADS* submesh with multiple passes has one LinearOffset vertex material per pass. Previously each one registered the SAME submesh as a separate tread, so 2 multi-pass treads filled all MAX_TREADS_PER_TANK slots early and later TREADS* submeshes were never visited -> their mappers kept the W3D-authored UV delta and scrolled constantly. Now: zero the delta on EVERY LinearOffset mapper of every TREADS* submesh, but register each submesh only once (the Material_Override is per mesh and the renderer applies it to each pass anyway)."]},{"name":"W3DTracerDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"Draws bullet tracers (short bright streaks). Configured by the weapon/FX that creates them.","body":"Used on tracer objects; length, width, colour and speed are set at runtime by the creating code (Tracer FX nugget). No INI fields.","ex":"Draw = W3DTracerDraw ModuleTag_Draw\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DTracerDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DTracerDraw.cpp","bases":["DrawModule","TracerDrawInterface"],"data":"(none)","groups":[],"cp":[],"notes":[]},{"name":"W3DTreeDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"Efficient batched tree drawing with push-aside and topple behaviour.","body":"Map trees use this instead of W3DModelDraw; trees are batched for performance. Units driving through push the tree aside (<b>MoveOutwardTime<\/b>, <b>MoveInwardTime<\/b>, <b>MoveOutwardDistanceFactor<\/b>). With <b>DoTopple<\/b> it can topple like ToppleUpdate (FX, stump, velocity/accel/bounce) and then sink (<b>SinkDistance<\/b> over <b>SinkTime<\/b>). <b>DarkeningFactor<\/b> darkens the tree, <b>DoShadow<\/b> enables its shadow.","ex":"Draw = W3DTreeDraw ModuleTag_Draw\n  ModelName    = PTOak01\n  TextureName  = PTOak01.tga\n  MoveOutwardTime = 300\n  MoveInwardTime  = 1500\n  MoveOutwardDistanceFactor = 1.0\n  DoTopple     = Yes\n  ToppleFX     = FX_TreeFall\n  StumpName    = TreeStumpSmall\n  KillWhenFinishedToppling = Yes\n  SinkDistance = 20\n  SinkTime     = 10000\n  DoShadow     = Yes\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DTreeDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DTreeDraw.cpp","bases":["DrawModule"],"data":"W3DTreeDrawModuleData","groups":[["W3DTreeDrawModuleData","own"]],"cp":[],"notes":[]},{"name":"W3DTruckDraw","key":"Draw","cat":"Draw","origin":"vanilla","sum":"W3DModelDraw for wheeled vehicles: spinning/steering tyres, suspension, dust/dirt sprays, articulated cab/trailer.","body":"Everything W3DModelDraw does, plus: tyre bones rotate with speed (<b>TireRotationMultiplier<\/b>), front tyres steer, suspension bounces, dust/dirt/powerslide particle systems play, and articulated trucks bend at <b>CabBone<\/b>/<b>TrailerBone<\/b>.","ex":"Draw = W3DTruckDraw ModuleTag_Draw\n  OkToChangeModelColor = Yes\n  Dust               = RocketBuggyDust\n  DirtSpray          = RocketBuggyDirtSpray\n  PowerslideSpray    = RocketBuggyDirtPowerSlide\n  LeftFrontTireBone  = Tire01\n  RightFrontTireBone = Tire02\n  LeftRearTireBone   = Tire03\n  RightRearTireBone  = Tire04\n  TireRotationMultiplier = 0.2\n  PowerslideRotationAddition = 0.3\n  DefaultConditionState\n    Model = GVTechnical\n  End\nEnd","header":"Core/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DTruckDraw.h","cpp":"Core/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DTruckDraw.cpp","bases":["W3DModelDraw"],"data":"W3DTruckDrawModuleData","groups":[["W3DTruckDrawModuleData","own"],["W3DModelDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":["W3DWheeledTankDraw"],"notes":[]},{"name":"W3DWheeledTankDraw","key":"Draw","cat":"Draw","origin":"mod","sum":"W3DTankDraw plus skid-steer wheel bones that spin together when driving and counter-rotate when turning.","body":"Mod-original. Everything W3DTankDraw does (turret, tread debris, tread UV scrolling) plus two wheel-bone lists: <b>LeftTireBones<\/b> and <b>RightTireBones<\/b>. Driving forward/backward spins both sides together with speed × <b>TireRotationMultiplier<\/b>; while turning (including pivoting in place) a counter-rotation term is added on top, so the sides spin in opposite directions like a skid-steered vehicle. Use for wheeled vehicles that steer by differential wheel speed (no steering angle/suspension, unlike W3DTruckDraw).","ex":"Draw = W3DWheeledTankDraw ModuleTag_Draw\n  TireRotationMultiplier = 0.2\n  LeftTireBones  = Tire01 Tire02 Tire03 Tire04\n  RightTireBones = Tire05 Tire06 Tire07 Tire08\n  TreadDebrisLeft  = TrackDebrisDirtLeft\n  TreadDebrisRight = TrackDebrisDirtRight\n  DefaultConditionState\n    Model  = MyWheeledAPC\n    Turret = Turret01\n  End\nEnd","header":"GeneralsMD/Code/GameEngineDevice/Include/W3DDevice/GameClient/Module/W3DWheeledTankDraw.h","cpp":"GeneralsMD/Code/GameEngineDevice/Source/W3DDevice/GameClient/Drawable/Draw/W3DWheeledTankDraw.cpp","bases":["W3DTankDraw"],"data":"W3DWheeledTankDrawModuleData","groups":[["W3DWheeledTankDrawModuleData","own"],["W3DModelDrawModuleData","inherited"],["W3DTankDrawModuleData","inherited"],["ModelConditionInfo","nested"]],"cp":["W3DTankDraw","W3DTruckDraw"],"notes":["FILE: W3DWheeledTankDraw.h ///////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 15/09/2026 Just like W3DTankDraw (turret handling, tread debris particles, tread-mesh UV scrolling -- all of it, unchanged), plus a pair of wheel-bone lists that spin like a skid-steered wheeled vehicle instead of (or alongside) scrolling tread textures: LeftTireBones and RightTireBones spin together in the same direction when driving straight forward/backward, but counter-rotate (one side forward, the other backward) while the unit is turning -- the same visual language as real tank treads, just applied to wheel bones via Rotate_Y instead of tread-mesh UV offsets. Why a new module instead of extending W3DTruckDraw: W3DTruckDraw's wheel bones always spin in the same direction as each other (only flipping for forward/backward via Locomotor::isMovingBackwards()) and rely on steering-angle/suspension data (Drawable::getWheelInfo()) for a front-wheel-steer look. This module targets vehicles that steer by differential wheel speed instead (like a tracked vehicle, just with wheels) -- no steering angle, no suspension bounce, just per-side rotation direction driven by the object's actual turn state. How the differential is computed (see W3DWheeledTankDraw::doDrawModule): the turn contribution is ADDED on top of the forward/backward contribution, not a mode switch between them. That means (a) an in-place pivot (zero forward speed, but PhysicsBehavior::getTurning() != TURN_NONE) still shows the wheels counter-rotating, and (b) normal driving with a minor steering correction doesn't visibly snap between \"speed-based\" and \"turn-based\" spin every time getTurning() flips on and off, since the turn term simply adds a small amount either way. PhysicsTurningType's TURN_POSITIVE means turning left and TURN_NEGATIVE means turning right (confirmed against Locomotor::rotateObjAroundLocoPivot, and matches the sign convention W3DTankDraw's own tread-scroll code already uses for the identical turn query). Usage -- give the target object this instead of W3DTankDraw or W3DTruckDraw: Draw = W3DWheeledTankDraw ModuleTag_01 ... every existing W3DTankDraw field still works here, unchanged (Model, ConditionState, TreadDebrisLeft/Right, TreadAnimationRate, etc.) ... TireRotationMultiplier = 0.2      ; radians of bone rotation added per frame per unit of speed; ; also reused (undivided by speed) as the flat per-frame ; counter-rotation magnitude while turning -- see header ; comment above. Same meaning/units as W3DTruckDraw's field ; of the same name. LeftTireBones  = Tire01 Tire02 Tire03 Tire04   ; space-separated bone names, any count RightTireBones = Tire05 Tire06 Tire07 Tire08   ; independent of LeftTireBones's count End","TheSuperHackers @info Tracked independently of W3DTankDraw's own m_prevRenderObj (which it already updates for tread purposes before our doDrawModule code runs each frame) so that a render-object change can still be detected here as a defensive fallback, mirroring the same belt-and-suspenders manual check W3DTruckDraw/W3DTankTruckDraw make in their own doDrawModule in addition to their onRenderObjRecreated() hook.","USER INCLUDES ////////////////////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 15/09/2026: unlike GameEngine/.cpp files, GameEngineDevice/.cpp files do NOT start with \"PreRTS.h\" -- see W3DPersistentAnimModelDraw.cpp for the same note.","Spin LeftTireBones/RightTireBones -- same direction for forward/backward driving, opposite directions while turning (added on top of, not instead of, the forward/backward spin so that normal steering corrections don't cause a visible snap -- see the file header for why). */","PhysicsTurningType: TURN_POSITIVE = turning left, TURN_NEGATIVE = turning right (matches the sign convention W3DTankDraw's own tread-scroll code already uses for the same query). The turn term is a flat per-frame amount (not scaled by speed) so it still shows up during an in-place pivot at zero forward speed, and it's ADDED to forwardDelta rather than replacing it, so a minor steering correction while driving doesn't snap the spin rate/direction.","m_leftWheelRotation/m_rightWheelRotation are purely visual state re-derived every frame from PhysicsBehavior -- nothing here needs to be saved, same as W3DTankDraw/W3DTruckDraw's own per-frame visual state."]},{"name":"WanderAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"AI that gives the unit random move commands so it wanders around (civilians, animals).","body":"When idle, the unit periodically picks a random nearby destination and walks there. Used on ambient civilians/animals. Uses only the AIUpdate fields.","ex":"Behavior = WanderAIUpdate ModuleTag_AI\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/WanderAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/WanderAIUpdate.cpp","bases":["AIUpdateInterface"],"data":"AIUpdateModuleData","groups":[["AIUpdateModuleData","own"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"WaveGuideUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Dam-break flood wave: moves water surface, damages and topples objects, splashes on bridges.","body":"Used on map 'waveguide' objects activated when a dam dies (DamDie). After <b>WaveDelay<\/b> it sweeps across the map: it raises water along a wave front of <b>YSize<\/b> sampled every <b>LinearWaveSpacing<\/b> (curvature <b>WaveBendMagnitude<\/b>), pushes water at <b>WaterVelocity<\/b> leaving it at <b>PreferredHeight<\/b>, deals <b>DamageAmount<\/b> within <b>DamageRadius<\/b> of sample points and topples things with <b>ToppleForce<\/b>. Plays splash/looping sounds and a particle when hitting bridges.","ex":"Behavior = WaveGuideUpdate ModuleTag_Wave\n  WaveDelay          = 1000\n  YSize              = 400\n  LinearWaveSpacing  = 20\n  WaveBendMagnitude  = 50\n  WaterVelocity      = 30\n  PreferredHeight    = 15\n  ShorelineEffectDistance = 30\n  DamageRadius       = 30\n  DamageAmount       = 1000\n  ToppleForce        = 10\n  LoopingSound       = DamWaveLoop\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/WaveGuideUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/WaveGuideUpdate.cpp","bases":["UpdateModule"],"data":"WaveGuideUpdateModuleData","groups":[["WaveGuideUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"WeaponBonusUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Periodically grants a weapon bonus condition to itself/nearby units (aura buff like the GLA Frenzy).","body":"Every <b>BonusDelay<\/b> it pulses: every allied object within <b>BonusRange<\/b> that passes <b>RequiredAffectKindOf<\/b>/<b>ForbiddenAffectKindOf<\/b> receives the <b>BonusConditionType<\/b> weapon-bonus condition (e.g. FRENZY_ONE, ENTHUSIASTIC) for <b>BonusDuration<\/b>. Affected units get the hardcoded frenzy tint. The actual numeric effect comes from WeaponBonus entries in GameData.ini/Weapon bonus sets.","ex":"Behavior = WeaponBonusUpdate ModuleTag_Frenzy\n  RequiredAffectKindOf = INFANTRY VEHICLE\n  ForbiddenAffectKindOf= AIRCRAFT\n  BonusDuration        = 5000\n  BonusDelay           = 1000\n  BonusRange           = 150\n  BonusConditionType   = FRENZY_ONE\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/WeaponBonusUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/WeaponBonusUpdate.cpp","bases":["UpdateModule"],"data":"WeaponBonusUpdateModuleData","groups":[["WeaponBonusUpdateModuleData","own"]],"cp":["WeaponBonusUpdateV2"],"notes":[]},{"name":"WeaponBonusUpdateV2","key":"Behavior","cat":"Update / behavior","origin":"mod","sum":"WeaponBonusUpdate with a custom INI 'Tint' colour applied to every affected unit (infantry and vehicles alike).","body":"Mod-original copy of WeaponBonusUpdate. Behaves identically (periodic pulse granting <b>BonusConditionType<\/b> to units within <b>BonusRange<\/b> for <b>BonusDuration<\/b>), but instead of the hardcoded FRENZY_COLOR / FRENZY_COLOR_INFANTRY tint it uses the <b>Tint<\/b> colour from INI for all kinds of units. Kept as a separate module so the vanilla one stays untouched.","ex":"Behavior = WeaponBonusUpdateV2 ModuleTag_Aura\n  RequiredAffectKindOf = INFANTRY VEHICLE\n  BonusDuration        = 5000\n  BonusDelay           = 1000\n  BonusRange           = 150\n  BonusConditionType   = FRENZY_TWO\n  Tint                 = R:0 G:180 B:255\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/WeaponBonusUpdateV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/WeaponBonusUpdateV2.cpp","bases":["UpdateModule"],"data":"WeaponBonusUpdateV2ModuleData","groups":[["WeaponBonusUpdateV2ModuleData","own"]],"cp":["WeaponBonus
