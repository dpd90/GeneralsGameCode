n","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Transport container (Internet Center) that orders every hacker inside to hack the internet for money.","body":"A TransportContain for China's Internet Center: every passenger that enters is automatically given the 'hack internet' AI command so it generates cash while inside (see HackInternetAIUpdate). Uses all TransportContain fields (Slots, AllowInsideKindOf…).","ex":"Behavior = InternetHackContain ModuleTag_Hack\n  Slots             = 8\n  AllowInsideKindOf = INFANTRY\n  ScatterNearbyOnExit = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/InternetHackContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/InternetHackContain.cpp","bases":["TransportContain"],"data":"InternetHackContainModuleData","groups":[["DieMuxData","mixin"],["OpenContainModuleData","inherited"],["TransportContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"JetAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"AI for airplanes: runway takeoff/landing, returning to the airfield for ammo, lock-on warning, attack locomotor.","body":"AIUpdate for jets that live on an airfield (ParkingPlaceBehavior). Handles taxiing (<b>MinHeight<\/b>, <b>ParkingOffset<\/b>), runway takeoff (<b>NeedsRunway<\/b>, <b>TakeoffPause<\/b>, <b>TakeoffDistForMaxLift<\/b>), returning to base when out of ammo or idle (<b>ReturnToBaseIdleTime<\/b>), and taking damage while out of ammo in the air (<b>OutOfAmmoDamagePerSecond<\/b>). Can switch to a special locomotor while attacking (<b>AttackLocomotorType<\/b>) and returning (<b>ReturnForAmmoLocomotorType<\/b>), and give incoming attacks a miss window after its attack run (<b>AttackersMissPersistTime<\/b>). The Lockon* fields draw the animated lock-on cursor enemies see when targeting it (Aurora style).","ex":"Behavior = JetAIUpdate ModuleTag_AI\n  OutOfAmmoDamagePerSecond = 10%\n  NeedsRunway              = Yes\n  KeepsParkingSpaceWhenAirborne = Yes\n  TakeoffDistForMaxLift    = 0%\n  TakeoffPause             = 500\n  MinHeight                = 5\n  ParkingOffset            = -5\n  SneakyOffsetWhenAttacking= 0\n  AttackLocomotorType      = SET_SUPERSONIC\n  AttackLocomotorPersistTime = 500\n  AttackersMissPersistTime = 0\n  ReturnToBaseIdleTime     = 10000\n  AutoAcquireEnemiesWhenIdle = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/JetAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/JetAIUpdate.cpp","bases":["AIUpdateInterface"],"data":"JetAIUpdateModuleData","groups":[["JetAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"JetSlowDeathBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Jet crash sequence: rolls and falls from the sky, secondary explosion, hits the ground, final blow-up.","body":"SlowDeathBehavior for airplanes. If killed on the ground (parked) it uses <b>FXOnGroundDeath<\/b>/<b>OCLOnGroundDeath<\/b> and dies normally. If killed in the air, it plays the initial death FX/OCL, keeps flying while rolling (<b>RollRate<\/b>, changing by <b>RollRateDelta<\/b>) and losing lift (<b>FallHowFast<\/b>), plays a secondary explosion after <b>DelaySecondaryFromInitialDeath<\/b>, then on hitting the ground plays the hit-ground effects, pitches (<b>PitchRate<\/b>) and after <b>DelayFinalBlowUpFromHitGround<\/b> does the final explosion. <b>DeathLoopSound<\/b> plays throughout.","ex":"Behavior = JetSlowDeathBehavior ModuleTag_JetDeath\n  DeathTypes          = ALL\n  FXOnGroundDeath     = FX_JetOnGroundDeath\n  OCLOnGroundDeath    = OCL_JetOnGroundDeath\n  FXInitialDeath      = FX_JetInitialDeath\n  DelaySecondaryFromInitialDeath = 1000\n  FXSecondary         = FX_JetSecondaryExplosion\n  FXHitGround         = FX_JetHitGround\n  OCLHitGround        = OCL_JetHitGroundDebris\n  DelayFinalBlowUpFromHitGround = 1000\n  FXFinalBlowUp       = FX_JetFinalBlowUp\n  DeathLoopSound      = JetDeathLoop\n  RollRate            = 0.1\n  RollRateDelta       = 98%\n  PitchRate           = 0.05\n  FallHowFast         = 40%\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/JetSlowDeathBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/JetSlowDeathBehavior.cpp","bases":["SlowDeathBehavior"],"data":"JetSlowDeathBehaviorModuleData","groups":[["JetSlowDeathBehaviorModuleData","own"],["DieMuxData","mixin"],["SlowDeathBehaviorModuleData","inherited"]],"cp":[],"notes":[]},{"name":"KeepObjectDie","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Die module that keeps the object in the world as rubble instead of removing it.","body":"For objects (mainly civilian buildings) that should stay as rubble when destroyed and have no other die module to handle it. Without it, such objects would linger in an odd state. Only DieMux filter fields.","ex":"Behavior = KeepObjectDie ModuleTag_Keep\n  DeathTypes = ALL\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/KeepObjectDie.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Die/KeepObjectDie.cpp","bases":["DieModule"],"data":"DieModuleData","groups":[["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"LaserUpdate","key":"ClientUpdate","cat":"Client update","origin":"vanilla","sum":"Client update that drives a laser beam object (Laser Crusader, Patriot link, Particle beam): endpoints, muzzle and target particles.","body":"A ClientUpdate (listed as <code>ClientUpdate = LaserUpdate<\/code>) on laser beam objects created by weapons. It keeps the beam stretched between the firer's bone and the target each frame and attaches <b>MuzzleParticleSystem<\/b> at the source and <b>TargetParticleSystem<\/b> at the impact. If the target disappears, <b>PunchThroughScalar<\/b> extends the beam length beyond where the target was. Rendering is done by W3DLaserDraw.","ex":"ClientUpdate = LaserUpdate ModuleTag_Laser\n  MuzzleParticleSystem = LaserMuzzleFlare\n  TargetParticleSystem = LaserTargetBurn\n  PunchThroughScalar   = 1.5\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/LaserUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/LaserUpdate.cpp","bases":["ClientUpdateModule"],"data":"LaserUpdateModuleData","groups":[["LaserUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"LeafletDropBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Propaganda leaflet drop: after a delay, disables enemy units in a radius (the 'Leaflet Drop' power).","body":"Put on the leaflet-bomb object. After <b>Delay<\/b> (or on death), it plays <b>LeafletFXParticleSystem<\/b> and disables every enemy unit within <b>AffectRadius<\/b> for <b>DisabledDuration<\/b> (units stop fighting, like being subdued).","ex":"Behavior = LeafletDropBehavior ModuleTag_Leaflet\n  Delay            = 3000\n  DisabledDuration = 10000\n  AffectRadius     = 200\n  LeafletFXParticleSystem = LeafletDropExplosion\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/EMPUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/EMPUpdate.cpp","bases":["UpdateModule","DieModuleInterface"],"data":"LeafletDropBehaviorModuleData","groups":[["LeafletDropBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"LifetimeUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Kills the object after a random lifetime between MinLifetime and MaxLifetime.","body":"A countdown chosen randomly between <b>MinLifetime<\/b> and <b>MaxLifetime<\/b> at creation. When it expires the object is KILLED (so die modules, death FX and SlowDeath run) — unlike DeletionUpdate which silently removes it. Used for temporary objects: debris, projectiles, hazards, summoned effects.","ex":"Behavior = LifetimeUpdate ModuleTag_Lifetime\n  MinLifetime = 10000\n  MaxLifetime = 12000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/LifetimeUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/LifetimeUpdate.cpp","bases":["UpdateModule"],"data":"LifetimeUpdateModuleData","groups":[["LifetimeUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"LockWeaponCreate","key":"Behavior","cat":"Create","origin":"vanilla","sum":"On creation, locks the object's weapon choice to one slot.","body":"A create module that locks the weapon set to <b>SlotToLock<\/b> when the object is created (used by objects created with a specific weapon to use, e.g. certain Zero Hour units/objects).","ex":"Behavior = LockWeaponCreate ModuleTag_Lock\n  SlotToLock = SECONDARY\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/LockWeaponCreate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Create/LockWeaponCreate.cpp","bases":["CreateModule"],"data":"LockWeaponCreateModuleData","groups":[["LockWeaponCreateModuleData","own"]],"cp":[],"notes":[]},{"name":"LocomotorSetUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that switches the unit to its upgraded locomotor set (SET_NORMAL_UPGRADED).","body":"When triggered, the unit uses its <code>Locomotor = SET_NORMAL_UPGRADED ...<\/code> locomotors instead of SET_NORMAL (e.g. faster after an engine upgrade).","ex":"Behavior = LocomotorSetUpgrade ModuleTag_Engines\n  TriggeredBy = Upgrade_ChinaNuclearTanks\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/LocomotorSetUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/LocomotorSetUpgrade.cpp","bases":["UpgradeModule"],"data":"UpgradeModuleData","groups":[["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"MaxHealthUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that increases the object's maximum health.","body":"When triggered, adds <b>AddMaxHealth<\/b> to max health. <b>ChangeType<\/b> decides what happens to current health: SAME_CURRENTHEALTH (default, current unchanged), PRESERVE_RATIO (keep the same percentage), ADD_CURRENT_HEALTH_TOO (current health grows by the same amount).","ex":"Behavior = MaxHealthUpgrade ModuleTag_Health\n  TriggeredBy  = Upgrade_ExtraArmor\n  AddMaxHealth = 100\n  ChangeType   = ADD_CURRENT_HEALTH_TOO\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/MaxHealthUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/MaxHealthUpgrade.cpp","bases":["UpgradeModule"],"data":"MaxHealthUpgradeModuleData","groups":[["MaxHealthUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"MinefieldBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Land mine logic: detonates on contact, supports 'virtual' multi-mine objects, regeneration and creator-linked decay.","body":"Put on mine objects. When an object whose relationship matches <b>DetonatedBy<\/b> collides with it, the mine fires <b>DetonationWeapon<\/b>. A single mine object can represent several mines (<b>NumVirtualMines<\/b>): each detonation uses one and the mine is destroyed when none are left; its health also represents remaining mines. <b>Regenerates<\/b> mines recreate themselves (e.g. from a regenerating mine upgrade). <b>StopsRegenAfterCreatorDies<\/b>/<b>DegenPercentPerSecondAfterCreatorDies<\/b> make mines wither when the building that generated them is gone. Workers/dozers don't trigger unless <b>WorkersDetonate<\/b>.","ex":"Behavior = MinefieldBehavior ModuleTag_Mine\n  DetonationWeapon = LandMineWeapon\n  DetonatedBy      = ENEMIES NEUTRAL\n  NumVirtualMines  = 3\n  Regenerates      = No\n  WorkersDetonate  = No\n  StopsRegenAfterCreatorDies = Yes\n  DegenPercentPerSecondAfterCreatorDies = 5%\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/MinefieldBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/MinefieldBehavior.cpp","bases":["UpdateModule","CollideModuleInterface","DamageModuleInterface","DieModuleInterface","LandMineInterface"],"data":"MinefieldBehaviorModuleData","groups":[["MinefieldBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"MissileAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"Guided missile flight AI: ignition, fuel, homing on target, diving, lock-on distance, jamming scatter.","body":"AI for guided missiles created as a weapon's ProjectileObject. After <b>IgnitionDelay<\/b> the missile ignites (<b>IgnitionFX<\/b>) and accelerates from <b>InitialVelocity<\/b> using its locomotor; it flies straight for <b>DistanceToTravelBeforeTurning<\/b> and then homes on the target object (<b>TryToFollowTarget<\/b>) or position. Within <b>DistanceToTargetBeforeDiving<\/b> it ignores its preferred height and dives; within <b>DistanceToTargetForLock<\/b> a hit is guaranteed. <b>FuelLifetime<\/b> limits thrust (0 = infinite); <b>DetonateOnNoFuel<\/b> explodes when out. When jammed (ECM) it scatters by <b>DistanceScatterWhenJammed<\/b>. If the tracked target dies, the vanilla missile simply disappears.","ex":"Behavior = MissileAIUpdate ModuleTag_MissileAI\n  TryToFollowTarget          = Yes\n  FuelLifetime               = 3000\n  IgnitionDelay              = 0\n  InitialVelocity            = 100\n  DistanceToTravelBeforeTurning = 10\n  DistanceToTargetBeforeDiving  = 50\n  DistanceToTargetForLock    = 20\n  IgnitionFX                 = FX_MissileIgnite\n  UseWeaponSpeed             = Yes\n  DetonateOnNoFuel           = Yes\n  DetonateCallsKill          = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/MissileAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/MissileAIUpdate.cpp","bases":["AIUpdateInterface","ProjectileUpdateInterface"],"data":"MissileAIUpdateModuleData","groups":[["MissileAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":["MissileAIUpdateV2"],"notes":[]},{"name":"MissileAIUpdateV2","key":"Behavior","cat":"AI update","origin":"mod","sum":"MissileAIUpdate plus: detonate at the target's last position when it dies, and optional retargeting to a new enemy.","body":"Mod-original copy of MissileAIUpdate that behaves identically, but changes what happens when a tracked target (TryToFollowTarget = Yes) dies. With <b>DetonateAtLastTargetPosition<\/b> = Yes (default) the missile flies to the target's last known position and detonates there (even mid-air) instead of vanishing. With <b>ShouldRetarget<\/b> = Yes, the moment the target is effectively dead it scans once within <b>RetargetRange<\/b> of the dead target for a new target (filtered by <b>RetargetRequiredKindOf<\/b>/<b>RetargetForbiddenKindOf<\/b>, enemy, alive, visible, not contained, and legal for the weapon's Anti* mask) and chases it; this repeats up to <b>MaxRetargets<\/b> times (0 = unlimited). If none is found, it follows the wreck and then detonates at its last position. If the new target has countermeasures, <b>RetargetCanBeDecoyed<\/b> gives it a fresh chance to decoy the missile. Decoyed missiles never retarget; position shots are unaffected.","ex":"Behavior = MissileAIUpdateV2 ModuleTag_MissileAI\n  TryToFollowTarget          = Yes\n  FuelLifetime               = 4000\n  InitialVelocity            = 80\n  DistanceToTravelBeforeTurning = 10\n  DistanceToTargetForLock    = 20\n  UseWeaponSpeed             = Yes\n  DetonateOnNoFuel           = Yes\n  DetonateAtLastTargetPosition = Yes\n  ShouldRetarget             = Yes\n  RetargetRange              = 150\n  MaxRetargets               = 2\n  RetargetRequiredKindOf     = VEHICLE AIRCRAFT\n  RetargetForbiddenKindOf    = INFANTRY\n  RetargetCanBeDecoyed       = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/MissileAIUpdateV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/MissileAIUpdateV2.cpp","bases":["AIUpdateInterface","ProjectileUpdateInterface"],"data":"MissileAIUpdateV2ModuleData","groups":[["MissileAIUpdateV2ModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":["MissileAIUpdate"],"notes":["FILE:\t\tMissileAIUpdateV2.h Author:\tMichael S. Booth, December 2001 Desc:\t\tMissile behavior GeneralsMod @feature Dimitar 25/09/2026: MissileAIUpdateV2 -- a copy of vanilla MissileAIUpdate (behaves identically) plus what happens when a TRACKED target (TryToFollowTarget = Yes) dies: DetonateAtLastTargetPosition = Yes   ; default Yes. When the target object is destroyed, fly to its ; last tracked position and detonate there (mid-air too). No = ; vanilla behavior (missile silently vanishes, no detonation). ShouldRetarget = No                  ; default No. Yes = the moment the target becomes effectively ; dead, scan once for a new target. Found -> chase it (and repeat ; when that one dies). Not found -> keep following the wreck / ; falling hull, then DetonateAtLastTargetPosition when it's gone. RetargetRange = 150                  ; scan radius, measured from the dead target's position MaxRetargets = 0                     ; 0 = unlimited RetargetRequiredKindOf = VEHICLE AIRCRAFT ; optional; candidate must match at least ONE listed KindOf RetargetForbiddenKindOf = INFANTRY   ; optional; candidate must match NONE of these RetargetCanBeDecoyed = Yes           ; default Yes. A new target with countermeasures (flares) gets a ; fresh chance to decoy the missile, same rules as at launch. Candidates must also be enemies, alive, not stealthed-and-undetected, not contained, and legal for the firing weapon's Anti* mask (AntiGround/AntiAirborneVehicle/...). Decoyed missiles never retarget; they detonate (without damage) at the flare's last position. Position shots (TryToFollowTarget = No, or a weapon ScatterRadius) are unaffected by all of the above.","FILE: MissileAIUpdateV2.cpp Author: Michael S. Booth, December 2001 Desc:   Implementation of missile behavior","GeneralsMod: same classification WeaponSet.cpp's file-local getVictimAntiMask() does (copied from PointDefenseUpdateV2.cpp for the same reason) -- which WeaponAntiMaskType bit(s) a weapon needs to be allowed to hit this victim. Used to keep retargeting legal for the fired weapon.","there is no need to destroy the attached particle systems here because the particle systems themselves detect that their \"parent\" object is gone and destroy themselves. but to be clean, for the exhaust particle system, we will invalidate the ID so that we can't do anything else with it since we're being deleted","If I was fired at a flyer and have lost target (most likely they died), then I need to do something better than cloverleaf around their last spot. GeneralsMod: routed through trackTarget() (retarget / last-position detonation) instead of airborneTargetGone().","srj sez: doh, why was this never in place? I guess 'cuz so few \"smart\" missiles ever go in a downward-towards-ground attitude. however, comanche rocket pod missiles do, so this fix is needed for them to target bridges correctly."]},{"name":"MissileLauncherBuildingUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Superweapon silo door logic (Nuke silo, SCUD Storm): opens doors when the power is ready, fires, closes.","body":"Tied to <b>SpecialPowerTemplate<\/b>. As the power becomes ready it opens its doors over <b>DoorOpenTime<\/b> (DOOR_1_OPENING, then DOOR_1_OPEN states with <b>DoorOpeningFX<\/b>/<b>DoorOpenFX<\/b>/<b>DoorOpenIdleAudio<\/b>), stays open until the player fires, waits <b>DoorWaitOpenTime<\/b>, then closes over <b>DoorCloseTime<\/b> with their respective FX.","ex":"Behavior = MissileLauncherBuildingUpdate ModuleTag_Silo\n  SpecialPowerTemplate = SuperweaponNeutronMissile\n  DoorOpenTime      = 6000\n  DoorWaitOpenTime  = 5000\n  DoorCloseTime     = 6000\n  DoorOpeningFX     = FX_NukeSiloOpening\n  DoorOpenFX        = FX_NukeSiloOpen\n  DoorClosingFX     = FX_NukeSiloClosing\n  DoorOpenIdleAudio = NukeSiloOpenLoop\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/MissileLauncherBuildingUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/MissileLauncherBuildingUpdate.cpp","bases":["SpecialPowerUpdateModule"],"data":"MissileLauncherBuildingUpdateModuleData","groups":[["MissileLauncherBuildingUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"MobMemberSlavedUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Keeps Angry Mob members together around their mob nexus, with catch-up and 'squirrelly' wandering.","body":"For the individual members of a mob. If a member is further than <b>MustCatchUpRadius<\/b> from the nexus it runs to catch up; within <b>NoNeedToCatchUpRadius<\/b> it relaxes. If stuck outside for <b>CatchUpCrisisBailTime<\/b> frames it teleports back. <b>Squirrelliness<\/b> adds random jittery movement.","ex":"Behavior = MobMemberSlavedUpdate ModuleTag_MobMember\n  MustCatchUpRadius     = 50\n  NoNeedToCatchUpRadius = 20\n  Squirrelliness        = 0.3\n  CatchUpCrisisBailTime = 999999\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/MobMemberSlavedUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/MobMemberSlavedUpdate.cpp","bases":["UpdateModule","SlavedUpdateInterface"],"data":"MobMemberSlavedUpdateModuleData","groups":[["MobMemberSlavedUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"MobNexusContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Invisible container that represents a mob (e.g. Angry Mob) as a single selectable unit for UI/AI.","body":"Used on the 'nexus' object of mob units: the nexus acts as a proxy for UI selection and AI orders while the individual mob members are slaved to it (MobMemberSlavedUpdate). It has its own copy of transport-like fields (Slots, exit behaviour, InitialPayload, regeneration) rather than inheriting TransportContain.","ex":"Behavior = MobNexusContain ModuleTag_MobNexus\n  Slots         = 10\n  ScatterNearbyOnExit = Yes\n  InitialPayload = GLAInfantryAngryMobPistol01 2\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/MobNexusContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/MobNexusContain.cpp","bases":["OpenContain"],"data":"MobNexusContainModuleData","groups":[["MobNexusContainModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"ModelConditionUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that sets a model condition flag (to show upgraded visuals via condition states).","body":"When triggered, sets <b>ConditionFlag<\/b> on the object permanently so a ConditionState with that flag is used (e.g. UPGRADE_1 or USER_1).","ex":"Behavior = ModelConditionUpgrade ModuleTag_Look\n  TriggeredBy   = Upgrade_SomeUpgrade\n  ConditionFlag = USER_1\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ModelConditionUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/ModelConditionUpgrade.cpp","bases":["UpgradeModule"],"data":"ModelConditionUpgradeModuleData","groups":[["ModelConditionUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"MoneyCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Crate that gives money to the player who picks it up.","body":"On pickup gives <b>MoneyProvided<\/b>, plus <b>UpgradedBoost<\/b> extra for players owning a given upgrade (<code>UpgradeType:Upgrade_X Boost:N<\/code>).","ex":"Behavior = MoneyCrateCollide ModuleTag_Crate\n  RequiredKindOf = INFANTRY VEHICLE\n  ForbidOwnerPlayer = Yes\n  MoneyProvided  = 1000\n  ExecuteAnimation = MoneyPickUp\n  ExecuteAnimationTime = 3.0\n  ExecuteAnimationZRise = 25\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/MoneyCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/MoneyCrateCollide.cpp","bases":["CrateCollide"],"data":"MoneyCrateCollideModuleData","groups":[["MoneyCrateCollideModuleData","own"],["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"NeutronBlastBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"On death, kills all infantry in a radius — even inside buildings and vehicles.","body":"When the object carrying this module dies (typically a neutron shell/missile projectile), every INFANTRY object within <b>BlastRadius<\/b> is killed outright, including infantry that is garrisoned in a building or riding inside a transport. The containers themselves are left intact and empty. <b>AffectAirborne<\/b> controls whether passengers of aircraft are killed, <b>AffectAllies<\/b> whether friendly infantry is also affected. Used by China's Neutron shells.","ex":"Behavior = NeutronBlastBehavior ModuleTag_NeutronBlast\n  BlastRadius     = 75\n  AffectAirborne  = No\n  AffectAllies    = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/NeutronBlastBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/NeutonBlastBehavior.cpp","bases":["UpdateModule","DieModuleInterface"],"data":"NeutronBlastBehaviorModuleData","groups":[["NeutronBlastBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"NeutronMissileSlowDeathBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Death sequence of the Nuclear Missile superweapon warhead: up to 9 staged blast rings with scorch marks, damage and push.","body":"SlowDeathBehavior variant used on the nuclear missile object. When the missile 'dies' (arrives), it plays <b>FXList<\/b> and then runs up to nine independent blast waves, Blast1…Blast9. Each wave is enabled with BlastNEnabled and after BlastNDelay deals damage that falls off from BlastNMaxDamage at BlastNInnerRadius to BlastNMinDamage at BlastNOuterRadius, topples trees/structures (BlastNToppleSpeed) and pushes units (BlastNPushForce). BlastNScorchDelay controls when the scorch mark (<b>ScorchMarkSize<\/b>) is placed. Combining several waves with growing radii produces the expanding nuke effect.","ex":"Behavior = NeutronMissileSlowDeathBehavior ModuleTag_NukeDeath\n  DestructionDelay = 5000\n  ScorchMarkSize   = 400\n  FXList           = FX_NukeExplosion\n  Blast1Enabled     = Yes\n  Blast1Delay       = 0\n  Blast1ScorchDelay = 0\n  Blast1InnerRadius = 50\n  Blast1OuterRadius = 100\n  Blast1MaxDamage   = 2000\n  Blast1MinDamage   = 500\n  Blast1ToppleSpeed = 0.5\n  Blast1PushForce   = 10\n  Blast2Enabled     = Yes\n  Blast2Delay       = 300\n  Blast2InnerRadius = 100\n  Blast2OuterRadius = 200\n  Blast2MaxDamage   = 800\n  Blast2MinDamage   = 100\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/NeutronMissileSlowDeathUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/NeutronMissileSlowDeathUpdate.cpp","bases":["SlowDeathBehavior"],"data":"NeutronMissileSlowDeathBehaviorModuleData","groups":[["NeutronMissileSlowDeathBehaviorModuleData","own"],["DieMuxData","mixin"],["SlowDeathBehaviorModuleData","inherited"]],"cp":[],"notes":[]},{"name":"NeutronMissileUpdate","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Flight logic of the Nuclear Missile superweapon: vertical launch, special speed phase, then dive onto the target.","body":"Controls the nuke missile object after launch from the silo: launch FX, a vertical boost phase (<b>SpecialSpeedTime<\/b>, <b>SpecialSpeedHeight<\/b>, <b>SpecialAccelFactor<\/b>, <b>SpecialJitterDistance<\/b>), then turning toward the target limited by <b>MaxTurnRate<\/b>, approaching from directly above (<b>TargetFromDirectlyAbove<\/b>). It shows <b>DeliveryDecal<\/b> at the target. On arrival it dies, triggering NeutronMissileSlowDeathBehavior.","ex":"Behavior = NeutronMissileUpdate ModuleTag_NukeFlight\n  DistanceToTravelBeforeTurning = 300\n  MaxTurnRate        = 180\n  ForwardDamping     = 0\n  RelativeSpeed      = 1.0\n  TargetFromDirectlyAbove = 500\n  LaunchFX           = FX_NukeLaunch\n  SpecialSpeedTime   = 3000\n  SpecialSpeedHeight = 500\n  SpecialAccelFactor = 1.5\n  SpecialJitterDistance = 0.8\n  DeliveryDecalRadius = 250\n  DeliveryDecal\n    Texture = SCCNuclearMissile_China\n    Style   = SHADOW_ALPHA_DECAL\n    OnlyVisibleToOwningPlayer = No\n  End\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/NeutronMissileUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/NeutronMissileUpdate.cpp","bases":["UpdateModule","DieModuleInterface","ProjectileUpdateInterface"],"data":"NeutronMissileUpdateModuleData","groups":[["NeutronMissileUpdateModuleData","own"],["RadiusDecalTemplate","nested"]],"cp":[],"notes":[]},{"name":"ObjectCreationUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that creates an ObjectCreationList when triggered (e.g. spawn a drone, add-on, or effect).","body":"When the upgrade completes, <b>UpgradeObject<\/b> (OCL) is created at the object — used for drones, Overlord add-ons, etc. Often paired with UpgradeDie on the created object so it can be rebought when destroyed.","ex":"Behavior = ObjectCreationUpgrade ModuleTag_Drone\n  TriggeredBy   = Upgrade_AmericaScoutDrone\n  ConflictsWith = Upgrade_AmericaBattleDrone\n  UpgradeObject = OCL_AmericanScoutDrone\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ObjectCreationUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/ObjectCreationUpgrade.cpp","bases":["UpgradeModule"],"data":"ObjectCreationUpgradeModuleData","groups":[["ObjectCreationUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"OCLSpecialPower","key":"Behavior","cat":"Special power","origin":"vanilla","sum":"Generic special power that creates an ObjectCreationList at/toward the target (paradrops, airstrikes, artillery, A-10s…).","body":"The most common special power implementation. When fired at a target it creates <b>OCL<\/b> using <b>CreateLocation<\/b>: CREATE_AT_EDGE_NEAR_SOURCE (plane comes from the map edge near your base), CREATE_AT_EDGE_NEAR_TARGET, CREATE_AT_EDGE_FARTHEST_FROM_TARGET, CREATE_AT_LOCATION (directly at target), USE_OWNER_OBJECT or CREATE_ABOVE_LOCATION. <b>UpgradeOCL<\/b> (<code>Science OCL<\/code> pairs) swaps to a stronger OCL for higher general's ranks. <b>ReferenceObject<\/b> tells script placement what the final object is (e.g. GLA Sneak Attack tunnel), and <b>OCLAdjustPositionToPassable<\/b> moves the target to the nearest passable cell.","ex":"Behavior = OCLSpecialPower ModuleTag_Paradrop\n  SpecialPowerTemplate = SuperweaponParadropAmerica\n  OCL                  = SUPERWEAPON_Paradrop1\n  UpgradeOCL           = SCIENCE_Paradrop2 SUPERWEAPON_Paradrop2\n  UpgradeOCL           = SCIENCE_Paradrop3 SUPERWEAPON_Paradrop3\n  CreateLocation       = CREATE_AT_EDGE_NEAR_SOURCE\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/OCLSpecialPower.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/OCLSpecialPower.cpp","bases":["SpecialPowerModule"],"data":"OCLSpecialPowerModuleData","groups":[["OCLSpecialPowerModuleData","own"],["SpecialPowerModuleData","inherited"]],"cp":[],"notes":[]},{"name":"OCLUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Creates an ObjectCreationList repeatedly on a random timer (e.g. supply drops, periodic spawns).","body":"Every random delay between <b>MinDelay<\/b> and <b>MaxDelay<\/b> it creates <b>OCL<\/b> on itself, or at the map edge with <b>CreateAtEdge<\/b> (e.g. the USA Supply Drop Zone plane). <b>FactionOCL<\/b> picks a different OCL based on the owning player's faction (<code>Faction:America OCL:OCL_X<\/code>); with <b>FactionTriggered<\/b> the update only runs once a faction is set. The building shows a progress bar for the timer.","ex":"Behavior = OCLUpdate ModuleTag_SupplyDrop\n  OCL          = OCL_AmericaSupplyDropZoneCargoPlane\n  MinDelay     = 120000\n  MaxDelay     = 120000\n  CreateAtEdge = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/OCLUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/OCLUpdate.cpp","bases":["UpdateModule"],"data":"OCLUpdateModuleData","groups":[["OCLUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"OpenContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Base container: lets objects enter and exit this object. Parent of every Contain module.","body":"OpenContain is the generic container that every other *Contain module extends (Transport, Garrison, Tunnel, Heal, Overlord, Helix, Parachute, Prison…). It handles who may enter (<b>AllowInsideKindOf<\/b>, <b>ForbidInsideKindOf<\/b>, <b>AllowAllies/Enemies/NeutralInside<\/b>), how many (<b>ContainMax<\/b>), entering/exiting sounds, unloading via ExitStart/ExitEnd bone paths and door animation time, passengers firing out of fire-points, and what happens to passengers when the container dies (<b>DamagePercentToUnits<\/b>). It also carries DieMux fields because a container needs to react to its own death. On its own it is rarely used; pick the specialised subclass.","ex":"Behavior = OpenContain ModuleTag_Contain\n  ContainMax          = 5\n  AllowInsideKindOf   = INFANTRY\n  PassengersAllowedToFire = Yes\n  DamagePercentToUnits= 100%\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/OpenContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/OpenContain.cpp","bases":["UpdateModule","ContainModuleInterface","CollideModuleInterface","DieModuleInterface","DamageModuleInterface","ExitInterface"],"data":"OpenContainModuleData","groups":[["OpenContainModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"OverchargeBehavior","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Lets a power plant overcharge (extra power) while slowly draining its own health.","body":"Adds the Overcharge toggle used by the USA Cold Fusion Reactor / China Nuclear Reactor. While overcharged the object produces its extra (upgraded) power and loses <b>HealthPercentToDrainPerSecond<\/b> of its max health each second. Overcharge cannot be turned on, and turns itself off, when health is below <b>NotAllowedWhenHealthBelowPercent<\/b>. The on/off toggle comes from a command button using the OVERCHARGE command.","ex":"Behavior = OverchargeBehavior ModuleTag_Overcharge\n  HealthPercentToDrainPerSecond   = 3%\n  NotAllowedWhenHealthBelowPercent = 50%\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/OverchargeBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/OverchargeBehavior.cpp","bases":["UpdateModule","DamageModuleInterface","OverchargeBehaviorInterface"],"data":"OverchargeBehaviorModuleData","groups":[["OverchargeBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"OverlordContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Overlord tank container: holds one add-on (Gattling/Propaganda/Bunker) and forwards transport queries to it.","body":"Acts as a normal TransportContain, but once full it redirects container queries to its first passenger. This is how China's Overlord upgrades work: the add-on (e.g. the Bunker) is a separate object riding on the tank (drawn via W3DDependencyModelDraw), and because queries are forwarded, infantry that 'enter the Overlord' actually go into the Bunker rider. <b>PayloadTemplateName<\/b> creates the rider object(s); <b>ExperienceSinkForRider<\/b> makes the rider's veterancy go to the tank.","ex":"Behavior = OverlordContain ModuleTag_Overlord\n  Slots                  = 1\n  DamagePercentToUnits   = 100%\n  AllowInsideKindOf      = PORTABLE_STRUCTURE\n  PayloadTemplateName    = ChinaTankOverlordGattlingCannon\n  ExperienceSinkForRider = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/OverlordContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/OverlordContain.cpp","bases":["TransportContain"],"data":"OverlordContainModuleData","groups":[["OverlordContainModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"],["TransportContainModuleData","inherited"]],"cp":["OverlordContainV2"],"notes":[]},{"name":"OverlordContainV2","key":"Behavior","cat":"Contain","origin":"mod","sum":"OverlordContain that supports several simultaneously-visible riders of any KindOf.","body":"Mod-original. Keeps OverlordContain's 'redirect transport queries to my single rider' trick for the classic one-rider case, but as soon as a second rider boards, redirection is switched off and it behaves like a normal multi-slot TransportContain whose occupants all stay visibly mounted — each drawn via its own W3DDependencyModelDraw with AttachToBoneInContainer — and all receive the ExperienceSinkForRider, stealth-grant, damage-state and on-capture treatment. Normal Slots / AllowInsideKindOf rules decide who may board, so riders can be any mix of unit types.","ex":"Behavior = OverlordContainV2 ModuleTag_Overlord\n  Slots                  = 3\n  AllowInsideKindOf      = PORTABLE_STRUCTURE INFANTRY\n  PayloadTemplateName    = MyTankTurretAddon\n  PayloadTemplateName    = MyTankGunnerAddon\n  ExperienceSinkForRider = Yes\n  DamagePercentToUnits   = 100%\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/OverlordContainV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/OverlordContainV2.cpp","bases":["TransportContain"],"data":"OverlordContainV2ModuleData","groups":[["OverlordContainV2ModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"],["TransportContainModuleData","inherited"]],"cp":["OverlordContain"],"notes":["FILE: OverlordContainV2.h ////////////////////////////////////////////////////////////////////// Desc: Like OverlordContain, but supports more than one simultaneously-visible rider. OverlordContain's \"redirect transport queries to my one rider\" trick (so a single rider that is itself a container -- e.g. a turret that garrisons infantry -- transparently becomes the Overlord's own inventory) only makes sense when there is exactly one rider. This module keeps that trick for the classic one-rider case, but the instant a second rider boards, redirection is switched off and this container behaves like a normal multi-slot TransportContain whose occupants all stay visibly mounted (each drawn via its own W3DDependencyModelDraw AttachToBoneInContainer bone), all get ExperienceSinkForRider / stealth-grant / damage-state / on-capture treatment, and are governed by the usual Slots / AllowInsideKindOf rules -- so riders can be any mix of KindOfs, not just one specific unit type.","FILE: OverlordContainV2.cpp //////////////////////////////////////////////////////////////////// Desc: Like OverlordContain, but every rider currently mounted on us -- not just the first one -- is drawn, sinks experience, gets the stealth grant, follows body-damage-state changes, and changes hands with us on capture. See OverlordContainV2.h for the full rationale.","I can't use any convenience functions, as they will all get routed to whoever I may be redirecting to. I want just my actual riders. Oh, and I don't want this function trying to do death.  That is more complicated and will be handled on my death.","Only ever redirect when exactly one rider is aboard -- the moment a second one boards, we stop pretending to be \"him\" and just behave like an ordinary multi-slot transport whose occupants all stay visibly mounted.","Everything is fine if I am empty, carrying more than one rider, or carrying a regular guy.  If I have a redirected contain set up, then I need to handle the order of death explicitly, or things will become confused when I stop redirecting in the middle of the process.  Or I will get confused as my commands get sucked up the pipe.","Every rider currently mounted on us needs to change hands with us. (In the classic single-redirected-rider case he will, in turn, kick or keep whatever he's carrying himself, exactly as OverlordContain always did.)","Remove 'obj' from the m_containList of objects in this module. This will trigger an onRemoving event for the object that this module is a part of and an onRemovedFrom event for the object being removed */"]},{"name":"ParachuteContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Parachute object that carries a unit down to the ground (paradrops, ejected pilots, supply crates).","body":"The parachute is a container that holds the falling unit. It free-falls until it has fallen <b>ParachuteOpenDist<\/b>, opens (playing <b>ParachuteOpenSound<\/b>) and then drifts down with sway limited by <b>PitchRateMax<\/b>/<b>RollRateMax<\/b> and damping near the ground. On landing the passenger is released and the parachute removed. If the chute never opens, the passenger takes <b>FreeFallDamagePercent<\/b> damage; landing in water kills it.","ex":"Behavior = ParachuteContain ModuleTag_Chute\n  PitchRateMax       = 60\n  RollRateMax        = 60\n  LowAltitudeDamping = 0.2\n  ParachuteOpenDist  = 30\n  FreeFallDamagePercent = 50%\n  ParachuteOpenSound = ParachuteOpen\n  AllowInsideKindOf  = INFANTRY VEHICLE CRATE\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ParachuteContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/ParachuteContain.cpp","bases":["OpenContain"],"data":"ParachuteContainModuleData","groups":[["ParachuteContainModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"ParkingPlaceBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Airfield parking: manages parking spaces, runways, takeoff/landing, reloading and healing of aircraft.","body":"Used on airfields. It defines a grid of parking spaces (<b>NumRows<\/b> × <b>NumCols<\/b>) using bones named RunwayStart/End, Parking, Prep etc. Aircraft produced here park in a free space; returning jets land, taxi to their spot and are reloaded and healed (<b>HealAmountPerSecond<\/b>, or <b>TimeForFullHeal<\/b>). <b>HasRunways<\/b> gives each column its own runway, <b>ParkInHangars<\/b> uses the production bones instead of real spots (used by helipads), and <b>ExtraHealAmount4Helicopters<\/b> adds bonus heal for helicopters.","ex":"Behavior = ParkingPlaceBehavior ModuleTag_Parking\n  NumRows        = 2\n  NumCols        = 2\n  HasRunways     = Yes\n  ApproachHeight = 50\n  HealAmountPerSecond = 10\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ParkingPlaceBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/ParkingPlaceBehavior.cpp","bases":["UpdateModule","DieModuleInterface","ParkingPlaceBehaviorInterface","ExitInterface"],"data":"ParkingPlaceBehaviorModuleData","groups":[["ParkingPlaceBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"ParticleUplinkCannonUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"USA Particle Cannon superweapon: charge-up states, beam firing, player-steerable swath of destruction.","body":"Drives the Particle Uplink Cannon building for <b>SpecialPowerTemplate<\/b>. It runs through visual states: charging (<b>BeginChargeTime<\/b>, outer node flares on bones <b>OuterEffectBoneName<\/b>01..N), raising the antenna (<b>RaiseAntennaTime<\/b>), ready (<b>ReadyDelayTime<\/b>), then firing: connector lasers between nodes, a base flare and the main orbital beam (<b>ParticleBeamLaserName<\/b>) that grows in width (<b>WidthGrowTime<\/b>), travels down (<b>BeamTravelTime<\/b>) and burns for <b>TotalFiringTime<\/b>. On the ground it deals <b>DamagePerSecond<\/b> in <b>TotalDamagePulses<\/b> pulses (with <b>DamageType<\/b>/<b>DeathType<\/b>), leaves scorch marks and remnant objects, reveals <b>RevealRange<\/b>, and wobbles in a 'swath of death' (<b>SwathOfDeathDistance/Amplitude<\/b>). In Zero Hour the player can steer the beam (<b>ManualDrivingSpeed<\/b>, double-click for <b>ManualFastDrivingSpeed<\/b>). Many *SoundLoop fields add audio.","ex":"Behavior = ParticleUplinkCannonUpdate ModuleTag_PUC\n  SpecialPowerTemplate = SuperweaponParticleUplinkCannon\n  BeginChargeTime      = 5000\n  RaiseAntennaTime     = 5000\n  ReadyDelayTime       = 2000\n  WidthGrowTime        = 2000\n  BeamTravelTime       = 2500\n  TotalFiringTime      = 10000\n  RevealRange          = 200\n  OuterEffectBoneName  = FX\n  OuterEffectNumBones  = 5\n  ConnectorBoneName    = FXConnector\n  FireBoneName         = FireBone\n  ParticleBeamLaserName= ParticleUplinkCannon_OrbitalLaser\n  DamagePerSecond      = 400\n  TotalDamagePulses    = 20\n  DamageType           = PARTICLE_BEAM\n  DeathType            = LASERED\n  DamageRadiusScalar   = 1.0\n  SwathOfDeathDistance = 100\n  SwathOfDeathAmplitude= 50\n  ManualDrivingSpeed   = 20\n  ManualFastDrivingSpeed = 40\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ParticleUplinkCannonUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/ParticleUplinkCannonUpdate.cpp","bases":["SpecialPowerUpdateModule"],"data":"ParticleUplinkCannonUpdateModuleData","groups":[["ParticleUplinkCannonUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"PassengersFireUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that allows passengers to fire out of this container (sets PassengersAllowedToFire).","body":"When triggered, the object's contain module gets PassengersAllowedToFire = Yes (e.g. a transport that gains firing ports after an upgrade).","ex":"Behavior = PassengersFireUpgrade ModuleTag_FirePorts\n  TriggeredBy = Upgrade_FiringPorts\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PassengersFireUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/PassengersFireUpgrade.cpp","bases":["UpgradeModule"],"data":"UpgradeModuleData","groups":[["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"PersistentDecalUpdateV2","key":"Behavior","cat":"Update / behavior","origin":"mod","sum":"Paints one permanent ground decal under the unit (any texture, set in INI), optionally upgrade-triggered — like the Chemical Suits decal.","body":"Mod-original. Uses the same object-bound terrain decal slot as the vanilla Chemical Suits / fake-structure decal, but the texture (<b>Texture<\/b>), size (<b>SizeX<\/b>/<b>SizeY<\/b>) and blend <b>Style<\/b> come from INI, so any modder can add new decal looks without engine changes. The decal follows the unit, is skipped automatically when the unit is off-screen or shrouded, and is released when the unit is destroyed.\n<br><br>Activation: with <b>StartsActive<\/b> = Yes (default) it paints on creation; to make it upgrade-gated set <b>StartsActive = No<\/b> and <b>TriggeredBy<\/b>. Note that a TriggeredBy block without StartsActive = No still paints immediately. <b>OnlyVisibleToOwningPlayer<\/b> shows it only to the owner (re-evaluated when the unit is captured/hijacked). Only one persistent decal per unit (shares the slot with vanilla terrain decals). Survives save/load for free via upgrade replay.","ex":"Behavior = PersistentDecalUpdateV2 ModuleTag_AuraRing\n  Texture      = MyAuraRing.tga\n  SizeX        = 60\n  SizeY        = 60\n  Style        = SHADOW_ADDITIVE_DECAL\n  StartsActive = No\n  TriggeredBy  = Upgrade_MyAuraUpgrade\n  OnlyVisibleToOwningPlayer = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PersistentDecalUpdateV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/PersistentDecalUpdateV2.cpp","bases":["UpdateModule","UpgradeMux","CreateModuleInterface"],"data":"PersistentDecalUpdateV2ModuleData","groups":[["PersistentDecalUpdateV2ModuleData","own"],["UpgradeMuxData","mixin"]],"cp":["RadiusDecalUpdate","ArmorUpgrade"],"notes":["FILE: PersistentDecalUpdateV2.h /////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 14/09/2026 Paints a single, permanent ground decal under this object -- same underlying mechanism as the vanilla KindOf=FS_FAKE / Upgrade_AmericaChemicalSuits tricks (Drawable::setTerrainDecal(), via W3DModelDraw's object-bound TheProjectedShadowManager->addDecal(RenderObjClass*, ...) -- which is why this decal automatically skips its own terrain re-projection work when the unit is off-screen/occluded (Is_Really_Visible()) or shrouded (enableShadowInvisible()), same as the unit's own shadow -- see Drawable::setPersistentDecal()), except the texture name and size come from THIS module's own INI-parsed data instead of a fixed compiled-in TerrainDecalType/array slot or a ThingTemplate-level field -- any modder can point at an arbitrary texture with zero engine changes. Deliberately minimal (no fade, no resize, no throb, no revert): upgradeImplementation() paints the decal exactly once and the object goes back to permanent sleep -- update() should in practice never actually run. The decal is NOT explicitly cleaned up on death: W3DModelDraw's own destructor already releases m_terrainDecal like it does for the chem suit/fake structure cases, so nothing extra is needed here. The unit's own regular shadow (W3DModelDraw's separate m_shadow member) is completely untouched by any of this -- m_terrainDecal/m_shadow are two independent Shadow* members, so a unit keeps its normal shadow at the same time as this decal. Survives save/load for free, same as the vanilla chem suit decal: Object::initObject() (run by ThingFactory::newObject() on every object construction, including save-game reload) calls Object::updateUpgradeModules(), which replays attemptUpgrade()/upgradeImplementation() for any UpgradeMux module still showing !isAlreadyUpgraded() -- true for a freshly-constructed module, since m_upgradeExecuted defaults false until that object's own xfer() runs a moment later. By the time objects are recreated on load, ThePlayerList (CHUNK_Players) has already been restored (GameState.cpp registers it before CHUNK_GameLogic), so a player-wide TriggeredBy upgrade is already satisfied and the decal gets repainted right there. Nothing needs to be xferred for this.","CreateModuleInterface -- GeneralsMod @feature Dimitar 14/09/2026: lets StartsActive paint the decal immediately with no upgrade at all. See the .cpp for why this can't be done directly in the constructor instead (the Drawable isn't bound to the Object yet at that point).","FILE: PersistentDecalUpdateV2.cpp ///////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 14/09/2026 See PersistentDecalUpdateV2.h for the full design rationale.","GeneralsMod @bugfix Dimitar 14/09/2026: MEMORY_POOL_GLUE_WITH_USERLOOKUP_CREATE only declares the virtual destructor prototype in the header -- it still has to be defined here, or every build fails at LINK time (not compile time) with LNK2019 unresolved external symbol on the scalar deleting destructor, the moment anything actually instantiates/destroys one of these (i.e. the first real INI usage). Matches SpyVisionUpdate::~SpyVisionUpdate()'s own trivial empty body -- nothing to clean up here, W3DModelDraw's own destructor already releases m_terrainDecal.","GeneralsMod @feature Dimitar 14/09/2026: this module never wakes itself once constructed -- upgradeImplementation() paints the decal once (below) and never touches the wake state, so the object stays asleep forever. This should never actually run, but UpdateModule::update() is pure virtual and must be defined.","CreateModuleInterface hook -- fires once per object, right after construction completes. Safe to touch the Drawable here (unlike this module's own constructor): ThingFactory::newObject() calls onCreate() only after Object::init() has already run TheGameLogic->sendObjectCreated(), which is what creates and binds the Drawable -- see that function's own comment for the exact same class of bug (\"veterancy create module... chemical suits upgrade... terrain decal\") this mirrors and avoids. Calling giveSelfUpgrade() straight from the constructor instead would look like it works (no crash -- getDrawable() is just null-checked away in upgradeImplementation() below) but would silently paint no decal at all, every time, for StartsActive units. */","GeneralsMod @feature Dimitar 14/09/2026: OnlyVisibleToOwningPlayer -- same one-time, checked-only-here semantics as RadiusDecalTemplate::createRadiusDecal()'s own field of the same name (Core/GameEngine/Source/GameClient/RadiusDecal.cpp): if the observing client isn't this object's own controlling player, this client's local Shadow* is simply never created at all -- every other client still runs upgradeImplementation() identically (this doesn't touch synced sim state, only local rendering), so this is purely per-client. Uses rts::getObservedOrLocalPlayer() (not ThePlayerList->getLocalPlayer()) to behave correctly for a spectator/replay observer following a specific player, matching Drawable::changedTeam()'s own choice of helper for the (differently-scoped) KindOf=FS_FAKE relationship check. Like RadiusDecalTemplate's field, this is NOT re-evaluated later -- a unit captured after this decal is painted keeps whatever visibility was decided here.","ObjectModule hook -- fires on genuine capture only (Object::setTeam() calls this from its own onCapture(), and only when oldTeam && team && !restoring -- never on initial team assignment). GeneralsMod @feature Dimitar 14/09/2026: OnlyVisibleToOwningPlayer's own creation-time check in upgradeImplementation() above is a one-shot decision and by itself goes stale the moment a unit changes hands -- exactly the KindOf=FS_FAKE problem Drawable::changedTeam() solves for the vanilla shadow-texture decal, except that's Drawable-level code with no idea this module or its OnlyVisibleToOwningPlayer field exist. This re-runs the same per-client visibility decision from the new ownership instead: if this client is now the owner and wasn't painting the decal (or never had a reason to check because OnlyVisibleToOwningPlayer was off from another module's implementation -- moot for us, we own our own decal state), (re)paint it; if this client no longer owns the unit, clear it. Nothing to do when OnlyVisibleToOwningPlayer is off (the decal, if any, was already visible to everyone and capture doesn't change that) or when the decal was never actually granted to this unit at all (isAlreadyUpgraded() false -- StartsActive=No and its TriggeredBy upgrade never completed). */"]},{"name":"PhysicsBehavior","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Rigid-body physics for the object: mass, friction, bouncing, collisions, falling damage.","body":"Almost every mobile object has a PhysicsBehavior. It integrates forces (locomotor thrust, gravity, explosions, collisions) into velocity and position, applies friction per axis, and produces the little pitch/roll 'shock' reactions when the unit is hit or fires (<b>ShockResistance<\/b>, <b>ShockMax*<\/b>). It also handles falling damage (<b>MinFallHeightForDamage<\/b>, <b>FallHeightDamageFactor<\/b>), bouncing debris (<b>AllowBouncing<\/b>), being pushed by other objects (<b>AllowCollideForce<\/b>) and what weapon is fired when a flung vehicle crashes into something.","ex":"Behavior = PhysicsBehavior ModuleTag_Physics\n  Mass                  = 50.0\n  ForwardFriction       = 33%\n  LateralFriction       = 33%\n  ZFriction             = 50%\n  AerodynamicFriction   = 2%\n  CenterOfMassOffset    = 0\n  AllowBouncing         = No\n  KillWhenRestingOnGround = No\n  MinFallHeightForDamage= 40\n  FallHeightDamageFactor= 1.0\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PhysicsUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/PhysicsUpdate.cpp","bases":["UpdateModule","CollideModuleInterface"],"data":"PhysicsBehaviorModuleData","groups":[["PhysicsBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"PilotFindVehicleUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Lets ejected pilots automatically find and board an empty/damaged friendly vehicle.","body":"An idle pilot scans <b>ScanRange<\/b> every <b>ScanRate<\/b> for a friendly vehicle it can enter (to give it veterancy) and whose health is at least <b>MinHealth<\/b>, then goes to it.","ex":"Behavior = PilotFindVehicleUpdate ModuleTag_FindVehicle\n  ScanRate  = 1000\n  ScanRange = 300\n  MinHealth = 0.5\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PilotFindVehicleUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/PilotFindVehicleUpdate.cpp","bases":["UpdateModule"],"data":"PilotFindVehicleUpdateModuleData","groups":[["PilotFindVehicleUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"PointDefenseLaserUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Vanilla point-defense laser: independently scans for and shoots down incoming missiles/projectiles.","body":"Every <b>ScanRate<\/b> it looks within <b>ScanRange<\/b> for enemies of <b>PrimaryTargetTypes<\/b> (preferred) or <b>SecondaryTargetTypes<\/b> (e.g. BALLISTIC_MISSILE, SMALL_MISSILE, PROJECTILE) and fires <b>WeaponTemplate<\/b> at the closest one, independent of the unit's normal weapons. <b>PredictTargetVelocityFactor<\/b> was meant to lead fast targets, but in the vanilla code the predicted position is discarded (see PointDefenseUpdateV2). Used by USA Avenger/Paladin point-defense lasers.","ex":"Behavior = PointDefenseLaserUpdate ModuleTag_PDL\n  WeaponTemplate        = PaladinPointDefenseLaser\n  PrimaryTargetTypes    = SMALL_MISSILE BALLISTIC_MISSILE\n  SecondaryTargetTypes  = PROJECTILE\n  ScanRate              = 0\n  ScanRange             = 150\n  PredictTargetVelocityFactor = 2.0\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PointDefenseLaserUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/PointDefenseLaserUpdate.cpp","bases":["UpdateModule"],"data":"PointDefenseLaserUpdateModuleData","groups":[["PointDefenseLaserUpdateModuleData","own"]],"cp":["PointDefenseUpdateV2"],"notes":[]},{"name":"PointDefenseUpdateV2","key":"Behavior","cat":"Update / behavior","origin":"mod","sum":"Reworked point-defense targeting: working velocity prediction, cached multi-target tracking, proper Anti* mask filtering, minimum intercept range, idle sleep.","body":"Mod-original rework of PointDefenseLaserUpdate that coexists with it. Improvements: <b>PredictTargetVelocityFactor<\/b> is actually applied (distance is measured to the predicted point); squared-distance math and enemy filtering inside the partition query; up to <b>MaxTrackedTargets<\/b> candidates cached per scan so losing a target doesn't force an immediate rescan; the target's classification is checked against the weapon's Anti* mask exactly like the engine's WeaponSet does (so a weapon with AntiProjectile but not AntiGround can intercept ballistic shells); <b>MinimumInterceptRange<\/b> leaves projectiles alone once they are closer than that radius (use this instead of the weapon's MinimumAttackRange, which would jam the module); failed shots no longer start a reload. Optional <b>IdleScanRate<\/b> puts the module to sleep when a scan finds nothing (0 = never sleep, vanilla vigilance).","ex":"Behavior = PointDefenseUpdateV2 ModuleTag_PD\n  WeaponTemplate        = ShieldInterceptorLaser\n  PrimaryTargetTypes    = SMALL_MISSILE BALLISTIC_MISSILE\n  SecondaryTargetTypes  = PROJECTILE\n  ScanRate              = 100\n  IdleScanRate          = 500\n  ScanRange             = 180\n  PredictTargetVelocityFactor = 1.0\n  MaxTrackedTargets     = 4\n  MinimumInterceptRange = 40\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PointDefenseUpdateV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/PointDefenseUpdateV2.cpp","bases":["UpdateModule"],"data":"PointDefenseUpdateV2ModuleData","groups":[["PointDefenseUpdateV2ModuleData","own"]],"cp":["PointDefenseLaserUpdate"],"notes":["FILE: PointDefenseUpdateV2.h /////////////////////////////////////////////////////////////////// Desc:   Reworked point-defense laser targeting update. Based on PointDefenseLaserUpdate, with: - PredictTargetVelocityFactor actually used (V1 computed a predicted position and then silently discarded it -- see PointDefenseUpdateV2.cpp for details). - Distance comparisons done with squared distances (no sqrt in the hot path). - The relationship (enemy) check is pushed into the partition-manager query itself via a PartitionFilter, instead of pulling back every nearby object and rejecting most of them one at a time afterward. - Caches up to MaxTrackedTargets candidates per scan instead of exactly one, so losing the current target doesn't require an emergency re-scan before the next shot. - Optional idle sleep (IdleScanRate): when a scan finds absolutely nothing in ScanRange, the module can tell the engine not to call update() again for a while, instead of paying a per-frame call+branch for a unit with nothing nearby. Off (0) by default -- it trades a bit of first-contact latency for CPU, so enable it deliberately per unit.","Classifies a potential victim the same way WeaponSet::getVictimAntiMask() does (that function is file-local/static to WeaponSet.cpp, so it isn't directly callable from here) -- returns which WeaponAntiMaskType bit(s) a weapon needs in order to be allowed to hit it. Needed because we fire this weapon directly (fireWeapon() on a manually-picked target) instead of going through the normal WeaponSet target-acquisition path, so none of the engine's usual Anti* mask enforcement (WeaponSet.cpp's getAbleToUseWeaponAgainstTarget(), ~line 881) ever runs for us -- without reproducing it, every Anti* field on the weapon (AntiGround/AntiProjectile/ AntiSmallMissile/AntiBallisticMissile/etc.) would be silently ignored and this module would just shoot at anything matching PrimaryTargetTypes/SecondaryTargetTypes.","OPTIMIZATION: stagger the very first scan so a batch of these units built or placed on the same frame don't stay locked in step, all doing their expensive full scans on the same tick forever after. Purely cosmetic for load, but costs nothing.","*** UPDATE PHILOSOPHY (vs PointDefenseLaserUpdate) *** Same idea: don't do the expensive full-radius scan every frame, do it every ScanRate frames and coast on cached targets in between. Two differences: 1) We coast on a small LIST of cached targets, not just one, so losing the current target doesn't force an emergency re-scan before the next shot can go out. 2) If a scan finds literally nothing in ScanRange, we can tell the engine to not even call update() again for a while (true sleepy-update), instead of being invoked every frame just to immediately bail out. This is opt-in via IdleScanRate (0 = disabled, matches V1 exactly).","Optimized firing at already-cached targets. (Forcing an early re-scan specifically when the cache runs dry mid-cycle is handled inside fireWhenReady() itself, not here -- see the \"hadTracked\" logic there. Doing it there instead of with a blanket \"m_numTracked > 0\" check here matters: this area can easily have plenty of irrelevant enemies wandering through (infantry near a projectile-only shield, say) that never populate the cache at all, and we don't want that to force a full rescan every single frame -- only actually losing a target we were tracking should.)","MinimumInterceptRange: if the shooter has already breached this inner radius, leave its shot alone rather than swatting it down right on top of us -- and don't fall through to fireWeapon() for it either, since the weapon's own MinimumAttackRange (if any) would silently refuse to fire and still cost us a reload cycle for nothing.","OPTIMIZATION vs V1: instead of V1's blind GameLogicRandomValue(0,3)-frame gamble whenever its one cached target dies, force an early re-scan only when the cache just ran out completely -- and only when it actually had something in it a moment ago. An already-empty cache (nothing worth tracking found last scan) is left alone to respect ScanRate/IdleScanRate normally."]},{"name":"PoisonedBehavior","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Reacts to POISON damage by re-damaging the object periodically for a while (damage over time).","body":"When the object takes POISON damage, it becomes poisoned: every <b>PoisonDamageInterval<\/b> it takes the same amount of damage again (as UNRESISTABLE so it doesn't re-trigger), until <b>PoisonDuration<\/b> has passed since the last poison dose. New doses refresh the duration. Healing cures the poison. Infantry usually have it for GLA toxin weapons.","ex":"Behavior = PoisonedBehavior ModuleTag_Poisoned\n  PoisonDamageInterval = 100\n  PoisonDuration       = 3000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PoisonedBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/PoisonedBehavior.cpp","bases":["UpdateModule","DamageModuleInterface"],"data":"PoisonedBehaviorModuleData","groups":[["PoisonedBehaviorModuleData","own"]],"cp":["DamageOverTimeUpdateV2"],"notes":[]},{"name":"PowerPlantUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Power plant control-rod extension animation when upgraded (Advanced Control Rods).","body":"When the power plant is upgraded (PowerPlantUpgrade), the rods extend over <b>RodsExtendTime<\/b> (POWER_PLANT_UPGRADING then POWER_PLANT_UPGRADED model conditions) before the extra power is applied.","ex":"Behavior = PowerPlantUpdate ModuleTag_PowerPlant\n  RodsExtendTime = 2000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PowerPlantUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/PowerPlantUpdate.cpp","bases":["UpdateModule","PowerPlantUpdateInterface"],"data":"PowerPlantUpdateModuleData","groups":[["PowerPlantUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"PowerPlantUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that increases a power plant's output (uses the template's EnergyBonus).","body":"When triggered, the object's energy production is increased by its EnergyBonus (from the object template). Works with PowerPlantUpdate for the rods animation.","ex":"Behavior = PowerPlantUpgrade ModuleTag_Rods\n  TriggeredBy = Upgrade_AmericaAdvancedControlRods\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PowerPlantUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/PowerPlantUpgrade.cpp","bases":["UpgradeModule"],"data":"UpgradeModuleData","groups":[["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"POWTruckAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"AI of the (cut) POW truck: collects surrendered enemies and brings them to a prison.","body":"In automatic mode, after <b>BoredTime<\/b> the truck seeks surrendered enemy infantry, loads them and returns to a prison (within <b>AtPrisonDistance<\/b> counts as arrived). Unused in the shipped game but functional.","ex":"Behavior = POWTruckAIUpdate ModuleTag_AI\n  BoredTime        = 5000\n  AtPrisonDistance = 60\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/POWTruckAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/POWTruckAIUpdate.cpp","bases":["AIUpdateInterface","POWTruckAIUpdateInterface"],"data":"POWTruckAIUpdateModuleData","groups":[["POWTruckAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"POWTruckBehavior","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Container for the (cut) POW truck that collects surrendered prisoners.","body":"Container logic for the POW Truck: it holds captured (surrendered) enemy infantry and takes them back to a prison. The feature was not used in the shipped game but the module still works with POWTruckAIUpdate. It has only the OpenContain fields.","ex":"Behavior = POWTruckBehavior ModuleTag_POW\n  ContainMax = 8\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/POWTruckBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/POWTruckBehavior.cpp","bases":["OpenContain"],"data":"POWTruckBehaviorModuleData","groups":[["DieMuxData","mixin"],["OpenContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"PreorderCreate","key":"Behavior","cat":"Create","origin":"vanilla","sum":"On creation, sets the PREORDER model condition if the player preordered (bonus visuals).","body":"A create module that applies the PREORDER model condition to the object when the game was a preorder edition — a cosmetic hook (e.g. special flags on buildings). No fields.","ex":"Behavior = PreorderCreate ModuleTag_Preorder\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PreorderCreate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Create/PreorderCreate.cpp","bases":["CreateModule"],"data":"CreateModuleData","groups":[],"cp":[],"notes":[]},{"name":"PrisonBehavior","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Prison container that holds captured prisoners and can show them walking in a prison yard.","body":"Container used for the (cut) prison structure. Prisoners delivered by a POW truck are contained; with <b>ShowPrisoners<\/b> = Yes they are displayed walking around the yard area defined by bones starting with <b>YardBonePrefix<\/b>. PropagandaCenterBehavior extends it.","ex":"Behavior = PrisonBehavior ModuleTag_Prison\n  ContainMax     = 20\n  ShowPrisoners  = Yes\n  YardBonePrefix = PrisonYard\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PrisonBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/PrisonBehavior.cpp","bases":["OpenContain"],"data":"PrisonBehaviorModuleData","groups":[["PrisonBehaviorModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"PrisonDockUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Dock update for prisons: POW trucks dock here to unload prisoners.","body":"Used together with PrisonBehavior (cut POW feature): POW trucks approach and unload captured infantry into the prison. Only the DockUpdate fields.","ex":"Behavior = PrisonDockUpdate ModuleTag_Dock\n  NumberApproachPositions = 3\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PrisonDockUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/DockUpdate/PrisonDockUpdate.cpp","bases":["DockUpdate"],"data":"DockUpdateModuleData","groups":[["DockUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"ProductionUpdate","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Allows a building (or unit) to produce units and research upgrades from a queue.","body":"Required on anything with a build queue. Holds up to <b>MaxQueueEntries<\/b> items, spends money over time, and hands finished units to the object's ProductionExit module. Door animations (<b>NumDoorAnimations<\/b>, <b>DoorOpeningTime<\/b>, <b>DoorWaitOpenTime<\/b>, <b>DoorCloseTime<\/b>) play when units leave; <b>ConstructionCompleteDuration<\/b> holds the CONSTRUCTION_COMPLETE state. <b>QuantityModifier<\/b> makes one purchase produce several units (e.g. <code>QuantityModifier = ChinaInfantryRedguard 2<\/code>). <b>DisabledTypesToProcess<\/b> lists disabled states during which production continues.","ex":"Behavior = ProductionUpdate ModuleTag_Production\n  MaxQueueEntries   = 9\n  NumDoorAnimations = 1\n  DoorOpeningTime   = 1500\n  DoorWaitOpenTime  = 3000\n  DoorCloseTime     = 1500\n  ConstructionCompleteDuration = 1500\n  QuantityModifier  = ChinaInfantryRedguard 2\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ProductionUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/ProductionUpdate.cpp","bases":["UpdateModule","ProductionUpdateInterface","DieModuleInterface"],"data":"ProductionUpdateModuleData","groups":[["ProductionUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"ProjectileClipFeedbackUpdateV2","key":"Behavior","cat":"Update / behavior","origin":"mod","sum":"Keeps launch-bone projectile visibility (and optionally weapon model conditions) in sync for units riding inside a container.","body":"Mod-original, opt-in fix module. Normally the per-frame weapon status helper pushes the current ammo count to the Drawable so projectiles on launch bones hide/show (e.g. rockets on a pod). But units held inside a container (Transport/Overlord/Helix/Garrison…) are DISABLED_HELD, which skips that helper, so a reload that finishes outside an attack never updates the model. This module keeps running while held and re-pushes the state every <b>CheckInterval<\/b>. With <b>OnlyWhenContained<\/b> it does nothing unless inside a container; <b>UpdateWeaponConditions<\/b> also refreshes FIRING/RELOADING/BETWEEN/PREATTACK flags.","ex":"Behavior = ProjectileClipFeedbackUpdateV2 ModuleTag_ClipFeedback\n  CheckInterval          = 250\n  OnlyWhenContained      = Yes\n  UpdateWeaponConditions = No\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ProjectileClipFeedbackUpdateV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/ProjectileClipFeedbackUpdateV2.cpp","bases":["UpdateModule"],"data":"ProjectileClipFeedbackUpdateV2ModuleData","groups":[["ProjectileClipFeedbackUpdateV2ModuleData","own"]],"cp":[],"notes":["FILE: ProjectileClipFeedbackUpdateV2.h ///////////////////////////////////////////////////////// Desc:   Keeps ProjectileBoneFeedbackEnabledSlots (and optionally the weapon FIRING/RELOADING/ BETWEEN/PREATTACK model condition flags) in sync for objects sitting inside a container. Why this exists: every weapon-carrying Object has a built-in ObjectWeaponStatusHelper that calls Object::adjustModelConditionForWeaponStatus() every frame -- that is what pushes the current ammo count to the Drawable (Drawable::updateDrawableClipStatus) so launch-bone projectiles hide/show. But TransportContain (and therefore OverlordContain, Garrison, Helix, Cave...) sets DISABLED_HELD on its riders, and ObjectWeaponStatusHelper uses the default UpdateModule disabled mask (DISABLEDMASK_NONE), so it is skipped for the whole time the rider is held. Firing still hides projectiles (AIAttackState calls the same function itself), but a reload that completes outside of an attack -- clip reload, or the FiringTracker AutoReloadWhenIdle refill -- never reaches the Drawable. This module runs while disabled and re-pushes that state on a configurable interval. Opt-in per object; no existing engine module is changed. INI: Behavior = ProjectileClipFeedbackUpdateV2 ModuleTag_XX CheckInterval          = 250   ; ms between checks (min 1 frame) OnlyWhenContained      = Yes   ; do nothing unless getContainedBy() != null UpdateWeaponConditions = No    ; Yes = call adjustModelConditionForWeaponStatus() (ammo feedback ;       AND weapon model-condition flags); No = ammo feedback only End","Must keep running while the object is DISABLED_HELD (that is the whole point of this module), and also while held + EMP/subdued/etc, since the non-retail update path requires the mask to cover EVERY disabled bit the object has (testForAll)."]},{"name":"ProjectileStreamUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Tracks all projectiles fired by a weapon so they can be drawn as a continuous stream (e.g. Toxin Tractor spray).","body":"Placed on a stream helper object used by weapons with a projectile stream (flame/toxin spray). It keeps a list of the in-flight projectiles so W3DProjectileStreamDraw can render a connected ribbon through them. No INI fields.","ex":"Behavior = ProjectileStreamUpdate ModuleTag_Stream\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ProjectileStreamUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/ProjectileStreamUpdate.cpp","bases":["UpdateModule"],"data":"UpdateModuleData","groups":[],"cp":[],"notes":[]},{"name":"ProneUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Makes infantry go prone (duck) when shot at, for a time proportional to the damage received.","body":"When the unit takes damage it enters the PRONE model condition for a number of frames equal to damage × <b>DamageToFramesRatio<\/b>, during which it can't move or fire.","ex":"Behavior = ProneUpdate ModuleTag_Prone\n  DamageToFramesRatio = 2.0\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ProneUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/ProneUpdate.cpp","bases":["UpdateModule"],"data":"ProneUpdateModuleData","groups":[["ProneUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"PropagandaCenterBehavior","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Prison variant that brainwashes held prisoners so they join the owner's side after a delay.","body":"Extends PrisonBehavior: prisoners kept inside for <b>BrainwashDuration<\/b> are converted to the owning player's team and released as friendly units.","ex":"Behavior = PropagandaCenterBehavior ModuleTag_Brainwash\n  ContainMax        = 10\n  BrainwashDuration = 30000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PropagandaCenterBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/PropagandaCenterBehavior.cpp","bases":["PrisonBehavior"],"data":"PropagandaCenterBehaviorModuleData","groups":[["PropagandaCenterBehaviorModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"],["PrisonBehaviorModuleData","inherited"]],"cp":[],"notes":[]},{"name":"PropagandaTowerBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Propaganda aura: periodically heals and boosts nearby friendly units (China Speaker Tower, Overlord Propaganda).","body":"Every <b>DelayBetweenUpdates<\/b> it scans <b>Radius<\/b> and toggles the propaganda effect on friendly units in range: they heal <b>HealPercentEachSecond<\/b> of their max health per second and receive the propaganda weapon-bonus/rate-of-fire effect. When the player has <b>UpgradeRequired<\/b> (Subliminal Messaging), <b>UpgradedHealPercentEachSecond<\/b> and <b>UpgradedPulseFX<\/b> are used instead. Units that leave the radius lose the effect at the next scan. Also handles the effect being removed when the tower dies or is disabled.","ex":"Behavior = PropagandaTowerBehavior ModuleTag_Propaganda\n  Radius                       = 150\n  DelayBetweenUpdates          = 2000\n  HealPercentEachSecond        = 1%\n  UpgradedHealPercentEachSecond= 2%\n  PulseFX                      = FX_PropagandaPulse\n  UpgradeRequired              = Upgrade_ChinaSubliminalMessaging\n  UpgradedPulseFX              = FX_PropagandaUpgradedPulse\n  AffectsSelf                  = No\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/PropagandaTowerBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/PropagandaTowerBehavior.cpp","bases":["UpdateModule","DieModuleInterface"],"data":"PropagandaTowerBehaviorModuleData","groups":[["PropagandaTowerBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"QueueProductionExitUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Production exit that releases produced units one at a time, waiting for each to clear the exit (e.g. airfields, war factories).","body":"Receives units from ProductionUpdate and places them at <b>UnitCreatePoint<\/b> (relative to the building), sending them to <b>NaturalRallyPoint<\/b> (or the player's rally point). It won't release the next unit until <b>ExitDelay<\/b> has passed and the previous one moved away. <b>AllowAirborneCreation<\/b> lets units be created in the air; <b>InitialBurst<\/b> releases that many immediately.","ex":"Behavior = QueueProductionExitUpdate ModuleTag_Exit\n  UnitCreatePoint   = X:0 Y:0 Z:0\n  NaturalRallyPoint = X:50 Y:0 Z:0\n  ExitDelay         = 300\n  AllowAirborneCreation = No\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/QueueProductionEx
