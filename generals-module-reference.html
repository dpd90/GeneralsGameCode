fected at all (default: no restriction) ForbiddenKindOf = INFANTRY      ; optional; if the TARGET matches any listed KindOf, this ; instance never triggers/refreshes on it (default: none ; excluded). Lets a DefaultThingTemplate-wide InheritableModule ; instance exclude whole unit categories (e.g. INFANTRY) without ; a RemoveModule on every excluded object individually. End Every tick is dealt once per DamageType flagged in DealDamageTypes (NOT DAMAGE_UNRESISTABLE) -- each flagged type gets the full Amount/Amount% independently, so it passes through the target's own ArmorSet Percent coefficient for that type exactly like any other hit of that type would. This is what makes overtime damage scale with armor: give a unit's Armor template a reduced (or increased) Percent for OVERTIME3, say, and both the initial hit AND every subsequent tick are affected by it identically -- and it's also what lets a single instance deal a genuinely mixed effect (DealDamageTypes = NONE +ARMOR_PIERCING +FLAME deals full Amount as BOTH types, every tick, each mitigated independently). The obvious risk -- a tick's own damage re-triggering/refreshing us forever, if a type in DealDamageTypes also happens to be flagged in TriggerDamageTypes -- is closed by m_dealingTick, a reentrancy flag set for the duration of the whole tick-dealing loop in update(); onDamage() ignores anything that arrives while it's set (this guards THIS instance against itself only -- a different DamageOverTimeUpdateV2 instance on the same object that also watches one of our dealt types is a separate, deliberately out-of-scope case; the intended 3 KindOf x 8 OVERTIME-channel usage pattern, see the project checklist doc, never puts two instances watching the same channel on one object in the first place). Getting hit again by a qualifying DamageType (from an outer, non-self source) while already active is a REFRESH, not a stack: Amount/Amount% is recaptured from the newest qualifying hit, Lifetime restarts from now, but the in-progress Rate cadence is preserved (same \"don't push the next tick further out\" logic PoisonedBehavior::startPoisonedEffects() uses). Being healed (onHealing) cancels the effect outright, same as PoisonedBehavior. Intended to be usable from DefaultThingTemplate (wrapped in InheritableModule) so any unit in the game CAN be hit with this, while staying completely inert (no per-frame ticking at all -- see the constructor's UPDATE_SLEEP_FOREVER) until something actually deals it OVERTIME-flagged damage.","default trigger AND default dealt type are both channel 1 of 8 (OVERTIME1..OVERTIME8) -- see GameLogic/Damage.h. Give each separately-configured instance on an object a different single TriggerDamageTypes channel (and ModuleTag) so they coexist without refreshing/clobbering each other; the two fields are independent, so a modder can widen either one on its own (e.g. trigger from one channel but deal a mix of real types, or vice versa).","Skip the Weapon allocation entirely if this instance can never trigger on THIS object -- safe to check here because our KindOf is a static property of our template, already resolved by Thing(tt) at the top of Object's own constructor, well before any behavior module (including us) is constructed. OCL/FXList need no equivalent guard -- both are just raw const pointers into globally-owned template registries (assigned once at INI parse time), never allocated or copied per module instance, so there is nothing to skip for them. Meant for setups using up to 24 KindOf-gated instances per object (3 KindOf variants x 8 OVERTIME channels) on DefaultThingTemplate, where any single object can match at most a handful of them -- this avoids allocating/loading ammo for a Weapon on the ~2/3 of instances that are permanently dead on that particular object.","pipeline (ticks are dealt using type(s) drawn straight from our own DealDamageTypes field, so they can pass through ArmorSet -- see the header comment); ignore it, in case a dealt type is also one we watch for in TriggerDamageTypes, or every tick (including a FireInitially immediate one) would refresh us","KindOf gate -- lets DefaultThingTemplate carry this module (via InheritableModule) while still excluding whole categories of unit (e.g. ForbiddenKindOf = INFANTRY) without a RemoveModule on every excluded object. isKindOfMulti(mustBeSet, mustBeClear): an empty mask on either side is a no-op requirement (testForAll/testForNone against zero bits is vacuously true).","deal the tick damage once per DamageType flagged in DealDamageTypes -- each one goes through the target's own ArmorSet coefficient for that type independently, same as a genuine hit of that type would (this is what lets DealDamageTypes = NONE +ARMOR_PIERCING +FLAME deal a mixed effect: full Amount as BOTH types, every tick, not split between them). m_dealingTick guards the whole loop against re-triggering/refreshing ourselves, in case a dealt type is also flagged in TriggerDamageTypes.","Starts the effect fresh, or refreshes an already-active one from a new qualifying hit. Amount/ Amount% are recaptured from THIS hit (not additive with any previous one -- a refresh, not a stack), and Lifetime restarts from now. If we're already ticking, the next scheduled tick is preserved rather than pushed out (same as PoisonedBehavior::startPoisonedEffects()) -- getting re-hit doesn't delay the damage you were already about to take. If FireInitially is set, this ALSO deals one tick's worth of damage/Weapon/OCL/FXList right now, on every qualifying hit (fresh start or refresh alike) -- on top of, not instead of, the normal Rate-cadence tick already scheduled above. Worth knowing: we're called from onDamage(), which is itself called synchronously from inside the TRIGGERING hit's own ActiveBody::attemptDamage() call (from its module-notify loop) -- so dealTickDamage()'s own getObject()->attemptDamage() call here is a nested, reentrant call into attemptDamage() while that outer call is still on the stack, not a fresh top-level one the way a normal scheduled tick gets from update(). This is safe (nothing in ActiveBody::attemptDamage() is static/non-reentrant, and the object's own behavior-module list is fixed for the duration of combat, so the outer call's own in-progress module-notify loop resumes correctly once our nested call returns) -- it just means any sibling module later in the object's module list is notified of OUR immediate tick's hit before it is notified of the original triggering hit that caused it, since our nested call's full notify pass completes first. */"]},{"name":"DamDie","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Dam death: when the dam dies the water flood (map water wave) is released.","body":"Special-purpose die module for map dams: on death it enables the map's waveguide/flood objects so the water rushes out. The TimeForFullHeal field is parsed but not used by the logic.","ex":"Behavior = DamDie ModuleTag_Dam\n  DeathTypes = ALL\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DamDie.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Die/DamDie.cpp","bases":["DieModule"],"data":"DamDieModuleData","groups":[["DamDieModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"DecalUpdateV2","key":"Behavior","cat":"Update / behavior","origin":"mod","sum":"Self-contained timed ground decal: paints a RadiusDecal at the object, fades/resizes it over Duration, then destroys its object.","body":"Mod-original. Paints the <b>DecalTemplate<\/b> decal at this object's position, eases opacity in over <b>FadeInTime<\/b> and out over <b>FadeOutTime<\/b>, eases radius from <b>RadiusStart<\/b> to <b>RadiusEnd<\/b> over <b>ResizeInTime<\/b> (and back over <b>ResizeOutTime<\/b>), and after <b>Duration<\/b> destroys its own object, firing <b>OnRemovalOCL<\/b>/<b>OnRemovalFX<\/b>. One authoritative timer — no separate LifetimeUpdate needed. Typically put on a short-lived invisible hazard/superweapon-effect object alongside a FireWeaponUpdate that does the actual damage.\n<br><br>Visibility to enemies is controlled by the sub-block's <b>OnlyVisibleToOwningPlayer<\/b> (set No to show to everyone). Concurrency is capped globally by GameData.ini <i>MaxDecalCount<\/i>: when full, new instances simply paint nothing (the object and its other modules are unaffected); <b>CountToMaxDecalCount = No<\/b> exempts an instance. Performance: the update sleeps through settled hold windows (not when an OpacityMin/Max throb is configured), and these decals are culled when off-screen or in fog of war.","ex":"Behavior = DecalUpdateV2 ModuleTag_Scorch\n  RadiusStart   = 20\n  RadiusEnd     = 120\n  Duration      = 15000\n  FadeInTime    = 300\n  FadeOutTime   = 2000\n  ResizeInTime  = 500\n  ResizeOutTime = 0\n  CountToMaxDecalCount = Yes\n  OnRemovalFX   = FX_ToxinPuddleEnd\n  DecalTemplate\n    Texture = EXToxinPuddle\n    Style   = SHADOW_ALPHA_DECAL\n    Color   = R:255 G:255 B:255 A:255\n    OnlyVisibleToOwningPlayer = No\n  End\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DecalUpdateV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/DecalUpdateV2.cpp","bases":["UpdateModule"],"data":"DecalUpdateV2ModuleData","groups":[["DecalUpdateV2ModuleData","own"],["RadiusDecalTemplate","nested"]],"cp":["RadiusDecalUpdate"],"notes":["FILE: DecalUpdateV2.h ///////////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 12/09/2026 Self-contained ground decal effect: paints a RadiusDecal (the same terrain-conforming projected texture used by the ShadowTexture-as-decal trick, but without its owner-only visibility limit and without being tied to a unit's own death) at this object's position, fades and resizes it over a fixed lifetime, then destroys its own object -- a single authoritative timer, no separate LifetimeUpdate racing against the decal's own fade. Modeled directly on FireOCLBehaviorV2's own self-destruct-on-completion pattern (see FireOCLBehaviorV2::update()'s thisIsFinalScan branch). Intended use: attach to a short-lived, usually invisible/inert hazard or superweapon-effect object -- typically alongside a FireWeaponUpdate on the same object for the actual gameplay damage -- so the ground paint and the gameplay effect share exactly one lifetime. Visibility to enemies is controlled entirely by the nested DecalTemplate block's own OnlyVisibleToOwningPlayer field (defined on RadiusDecalTemplate, see GameClient/RadiusDecal.h): set it to No to make the decal visible to everyone, not just the owner/allies -- this is the restriction that made the KindOf=FS_FAKE ShadowTexture-as-decal trick unsuitable in the first place. Concurrency is capped globally (not per-category) by GameData.ini's MaxDecalCount (TheGlobalData->m_maxDecalCount): once that many DecalUpdateV2 instances currently hold a live decal, additional ones simply paint no decal at all -- the object itself, and any other module on it (e.g. FireWeaponUpdate), is completely unaffected -- rather than forcing an existing decal to disappear early. This mirrors how TerrainTracksRenderObjClassSystem::bindTrack() already handles MaxTerrainTracks in this engine (refuse when the pool is full, not evict-the-oldest -- see Core/GameEngineDevice/Source/W3DDevice/GameClient/W3DTerrainTracks.cpp). Update() sleeps through a fully settled hold window (e.g. a short ResizeInTime, then a long stretch of nothing changing, then a short ResizeOutTime) instead of ticking every logic frame for no visible reason -- see computeNextSleepTime() in the .cpp. Disabled automatically whenever an OpacityMin/OpacityMax throb range is configured, since the throb changes every frame anyway. Camera-frustum and fog-of-war culling for the underlying decal itself (added 14/09/2026, fixing the limitation this comment used to describe -- every live RadiusDecal used to be re-projected onto the terrain every frame regardless of on-screen visibility or shroud) now lives one level down, in W3DProjectedShadowManager::renderShadows()'s m_decalList loop (W3DProjectedShadow.cpp) -- it's a manager-level fix, not specific to this module, since it applies to every decal created via the no-owning-robj addDecal(ShadowTypeInfo*) overload, not just DecalUpdateV2's own. Object-bound decals (PersistentDecalUpdateV2's setPersistentDecal(), via the other addDecal(robj, info) overload) already had an equivalent Is_Really_Visible() skip from the original engine code, unchanged by this.","GeneralsMod @feature Dimitar 14/09/2026: lets update() sleep through a long, fully settled hold window (e.g. a 500ms ResizeInTime, then 30 real seconds of nothing changing, then a 500ms ResizeOutTime) instead of ticking every logic frame for no visible reason -- see the .cpp for the full rationale, including why an OpacityMin/OpacityMax throb range disables this entirely rather than trying to sleep through it.","GeneralsMod @feature Dimitar 12/09/2026: neither the constructor nor onObjectCreated() run late enough to see this object's real spawn position (both run from inside Object::Object() itself, before the caller that spawned us calls setPosition()) -- confirmed via debug logging (position read (0,0,0) in both). update() is the first point position is guaranteed valid (see FireOCLBehaviorV2::createEmitters(), which defers for the identical reason). This flag makes the deferred attempt happen exactly once.","GeneralsMod @feature Dimitar 12/09/2026: global (not per-category) cap on concurrently live DecalUpdateV2 decals, enforced against TheGlobalData->m_maxDecalCount. Safe as a bare static: GameLogic::reset() calls destroyAllObjectsImmediate() between matches, which runs every live instance's destructor (and therefore its decrement) before a new game can create any more.","FILE: DecalUpdateV2.cpp /////////////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 12/09/2026 See DecalUpdateV2.h for the full design rationale.","Attempt to create the underlying RadiusDecal, respecting MaxDecalCount. Called from the constructor (normal spawn) and again from loadPostProcess() (after a save load, since RadiusDecal::xferRadiusDecal() never actually restores the visual -- see xfer() below). */","GeneralsMod @feature Dimitar 12/09/2026: CountToMaxDecalCount = No exempts this instance from the global MaxDecalCount pool entirely -- e.g. per-general superweapon ground indicators, which are already self-limited by their own multi-minute cooldowns (at most one per general at a time), so they should always paint even if the general hazard/effect pool is full.","GeneralsMod @feature Dimitar 14/09/2026: allowOffscreenCulling=TRUE -- the only RadiusDecalTemplate consumer that opts into off-screen/fog-of-war culling (see Shadow::ShadowTypeInfo::m_allowOffscreenCulling for why every other consumer must not).","GeneralsMod @feature Dimitar 12/09/2026: RadiusDecal::isEmpty() is guaranteed consistent across all clients regardless of local visibility (see the comment on RadiusDecal.h) -- so gating the cap counter on it, rather than on whether an underlying Shadow* actually got created locally, keeps this cap check deterministic in multiplayer. Instances with CountToMaxDecalCount = No never increment s_liveDecalCount, so m_countedTowardCap correctly stays FALSE and the destructor's decrement below is skipped for them too.","Ease opacity (fade in / hold / fade out) and radius (RadiusStart -> RadiusEnd) for how far into the effect's life we are, and push both to the live decal. No-op if we hold no decal (either because MaxDecalCount was hit, or because the DecalTemplate block had no Texture set). */"]},{"name":"DefaultProductionExitUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Simplest production exit: spawns produced units at a point and sends them to a rally point.","body":"Produced units appear at <b>UnitCreatePoint<\/b> (relative to the building) and move to <b>NaturalRallyPoint<\/b> or the player's rally point. <b>UseSpawnRallyPoint<\/b> makes them use a spawn-point bone rally instead. Used by barracks and most factories.","ex":"Behavior = DefaultProductionExitUpdate ModuleTag_Exit\n  UnitCreatePoint   = X:20 Y:0 Z:0\n  NaturalRallyPoint = X:60 Y:0 Z:0\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DefaultProductionExitUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/ProductionExitUpdate/DefaultProductionExitUpdate.cpp","bases":["UpdateModule","ExitInterface"],"data":"DefaultProductionExitUpdateModuleData","groups":[["DefaultProductionExitUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"DefectorSpecialPower","key":"Behavior","cat":"Special power","origin":"vanilla","sum":"Special power that makes a targeted enemy unit defect to your side.","body":"Click an enemy unit with the power's cursor and it switches to your team. <b>FatCursorRadius<\/b> makes the targeting cursor more forgiving.","ex":"Behavior = DefectorSpecialPower ModuleTag_Defector\n  SpecialPowerTemplate = SuperweaponDefector\n  FatCursorRadius      = 20\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DefectorSpecialPower.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/DefectorSpecialPower.cpp","bases":["SpecialPowerModule"],"data":"DefectorSpecialPowerModuleData","groups":[["DefectorSpecialPowerModuleData","own"],["SpecialPowerModuleData","inherited"]],"cp":[],"notes":[]},{"name":"DeletionUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Silently deletes the object after a random lifetime (no death, no die modules).","body":"Like LifetimeUpdate, but when the time (random between <b>MinLifetime<\/b> and <b>MaxLifetime<\/b>) is up the object is removed from the world directly without being killed — no death FX, no die modules, no score. Use it for purely cosmetic helper objects.","ex":"Behavior = DeletionUpdate ModuleTag_Delete\n  MinLifetime = 3000\n  MaxLifetime = 5000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DeletionUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/DeletionUpdate.cpp","bases":["UpdateModule"],"data":"DeletionUpdateModuleData","groups":[["DeletionUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"DeliverPayloadAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"AI for aircraft that fly to a target, drop their cargo (paratroopers, bombs, crates) and leave.","body":"Used by transport/bomber planes spawned by special-power OCLs (DeliverPayload nugget). The plane approaches the target, opens its doors (<b>DoorDelay<\/b>), and within <b>DeliveryDistance<\/b> releases its contents (<b>DropDelay<\/b>, <b>DropOffset<\/b>, <b>DropVariance<\/b>), optionally putting each dropped item into a <b>PutInContainer<\/b> (e.g. a parachute). If it overshoots it turns around and retries up to <b>MaxAttempts<\/b> times. A <b>DeliveryDecal<\/b> marks the drop zone. Most values are normally overridden by the OCL's DeliverPayload nugget; these INI values are used for script-only reinforcements.","ex":"Behavior = DeliverPayloadAIUpdate ModuleTag_AI\n  DoorDelay        = 1000\n  MaxAttempts      = 3\n  DropOffset       = X:0 Y:0 Z:-10\n  DropVariance     = X:20 Y:20 Z:0\n  DropDelay        = 300\n  PutInContainer   = AmericaParachute\n  DeliveryDistance = 50\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DeliverPayloadAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/DeliverPayloadAIUpdate.cpp","bases":["AIUpdateInterface"],"data":"DeliverPayloadAIUpdateModuleData","groups":[["DeliverPayloadAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"],["RadiusDecalTemplate","nested"]],"cp":[],"notes":[]},{"name":"DemoralizeSpecialPower","key":"Behavior","cat":"Special power","origin":"vanilla","sum":"(Cut) power that demoralizes enemy units in an area; range/duration scale with prisoners held.","body":"Demoralizes enemies in a radius of <b>BaseRange<\/b> + <b>BonusRangePerCaptured<\/b> per prisoner (max <b>MaxRange<\/b>) for <b>BaseDuration<\/b> + bonus per prisoner (max <b>MaxDuration<\/b>), playing <b>FXList<\/b>. Part of the unused prisoner feature.","ex":"Behavior = DemoralizeSpecialPower ModuleTag_Demoralize\n  SpecialPowerTemplate     = SpecialPowerDemoralize\n  BaseRange                = 100\n  BonusRangePerCaptured    = 10\n  MaxRange                 = 200\n  BaseDuration             = 10000\n  BonusDurationPerCaptured = 1000\n  MaxDuration              = 20000\n  FXList                   = FX_Demoralize\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DemoralizeSpecialPower.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/DemoralizeSpecialPower.cpp","bases":["SpecialPowerModule"],"data":"DemoralizeSpecialPowerModuleData","groups":[["DemoralizeSpecialPowerModuleData","own"],["SpecialPowerModuleData","inherited"]],"cp":[],"notes":[]},{"name":"DemoTrapUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"GLA Demo Trap logic: proximity or manual detonation modes.","body":"The trap has two modes toggled by weapon-slot buttons: proximity mode (<b>ProximityModeWeaponSlot<\/b>) where it scans <b>TriggerDetonationRange<\/b> every <b>ScanRate<\/b> and explodes when an enemy (not of <b>IgnoreTargetTypes<\/b>) enters, and manual mode (<b>ManualModeWeaponSlot<\/b>) where it only explodes on command (<b>DetonationWeaponSlot<\/b>). <b>DefaultProximityMode<\/b> picks the start mode. <b>AutoDetonationWithFriendsInvolved<\/b> allows detonating even if friends are in range; <b>DetonateWhenKilled<\/b> makes it explode when destroyed. <b>DetonationWeapon<\/b> is the explosion.","ex":"Behavior = DemoTrapUpdate ModuleTag_Trap\n  DefaultProximityMode     = Yes\n  DetonationWeaponSlot     = PRIMARY\n  ProximityModeWeaponSlot  = SECONDARY\n  ManualModeWeaponSlot     = TERTIARY\n  TriggerDetonationRange   = 30\n  IgnoreTargetTypes        = PROJECTILE\n  ScanRate                 = 500\n  AutoDetonationWithFriendsInvolved = No\n  DetonationWeapon         = DemoTrapDetonationWeapon\n  DetonateWhenKilled       = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DemoTrapUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/DemoTrapUpdate.cpp","bases":["UpdateModule"],"data":"DemoTrapUpdateModuleData","groups":[["DemoTrapUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"DeployStyleAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"AI for units that must deploy to attack and pack up to move (Nuke Cannon, Tomahawk, Inferno style).","body":"A normal AIUpdate plus a deploy state machine. When ordered to attack, the unit stops and plays its unpack animation for <b>UnpackTime<\/b> (DEPLOYED model condition), fires, and packs up for <b>PackTime<\/b> before it can move again. Turrets can be restricted to work only while deployed (<b>TurretsFunctionOnlyWhenDeployed<\/b>) and must recentre before packing (<b>TurretsMustCenterBeforePacking<\/b>, <b>ResetTurretBeforePacking<\/b>). <b>ManualDeployAnimations<\/b> lets the animations be driven by the model's condition states rather than timed.","ex":"Behavior = DeployStyleAIUpdate ModuleTag_AI\n  AutoAcquireEnemiesWhenIdle = Yes\n  UnpackTime = 3000\n  PackTime   = 3000\n  TurretsFunctionOnlyWhenDeployed = Yes\n  TurretsMustCenterBeforePacking  = Yes\n  Turret\n    TurretTurnRate       = 60\n    ControlledWeaponSlots= PRIMARY\n  End\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DeployStyleAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/DeployStyleAIUpdate.cpp","bases":["AIUpdateInterface"],"data":"DeployStyleAIUpdateModuleData","groups":[["DeployStyleAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"DestroyDie","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Default die module: simply removes the object from the world when it dies.","body":"The most basic die module — when the object dies (matching DeathTypes etc.) it is destroyed immediately with no corpse, FX or effects. Most objects that have no SlowDeathBehavior use this so that they actually go away. Only the DieMux filter fields apply.","ex":"Behavior = DestroyDie ModuleTag_Destroy\n  DeathTypes = ALL\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DestroyDie.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Die/DestroyDie.cpp","bases":["DieModule"],"data":"DieModuleData","groups":[["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"DozerAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"Dozer AI: builds structures, repairs buildings/bridges, clears mines, and auto-repairs when bored.","body":"AIUpdate for construction units (KindOf DOZER). Handles building placement orders, repairing structures at <b>RepairHealthPercentPerSecond<\/b>, repairing bridges, disarming mines and fortifying civilian buildings. When idle for <b>BoredTime<\/b> it looks within <b>BoredRange<\/b> for damaged friendly structures and repairs them on its own. Build speed comes from the structure's BuildTime.","ex":"Behavior = DozerAIUpdate ModuleTag_AI\n  RepairHealthPercentPerSecond = 2%\n  BoredTime   = 5000\n  BoredRange  = 150\n  AutoAcquireEnemiesWhenIdle = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DozerAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/DozerAIUpdate.cpp","bases":["AIUpdateInterface","DozerAIInterface"],"data":"DozerAIUpdateModuleData","groups":[["DozerAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":["HealAIUpdateV2"],"notes":[]},{"name":"DumbProjectileBehavior","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Ballistic (unguided) projectile movement along a Bezier arc from launcher to target.","body":"Used on shell/rocket objects created by a weapon's ProjectileObject. The projectile flies a precomputed Bezier curve from launch point to target position, whose shape is controlled by two control points: the first is <b>FirstHeight<\/b> above the highest terrain in the way and <b>FirstPercentIndent<\/b> along the line, the second uses <b>SecondHeight<\/b>/<b>SecondPercentIndent<\/b>. When the curve ends (or it hits something) the projectile detonates and deals its weapon's damage. <b>FlightPathAdjustDistPerSecond<\/b> lets it slightly track a moving target. The GarrisonHitKill fields implement 'shell kills N garrisoned infantry when hitting a building' (e.g. China's Nuke Cannon / Inferno vs. garrisons).","ex":"Behavior = DumbProjectileBehavior ModuleTag_Projectile\n  MaxLifespan        = 10000\n  TumbleRandomly     = No\n  DetonateCallsKill  = Yes\n  OrientToFlightPath = Yes\n  FirstHeight        = 25\n  SecondHeight       = 25\n  FirstPercentIndent = 30%\n  SecondPercentIndent= 70%\n  FlightPathAdjustDistPerSecond = 50\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DumbProjectileBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/DumbProjectileBehavior.cpp","bases":["UpdateModule","ProjectileUpdateInterface"],"data":"DumbProjectileBehaviorModuleData","groups":[["DumbProjectileBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"DynamicGeometryInfoUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Changes the object's collision geometry (height/radii) over time — for growing or shrinking effects.","body":"After <b>InitialDelay<\/b>, the geometry interpolates from Initial(Height/MajorRadius/MinorRadius) to Final* over <b>TransitionTime<\/b>, optionally reversing back (<b>ReverseAtTransitionTime<\/b>). Used on hazard objects (e.g. fire walls, gas clouds) whose collision/affected area grows.","ex":"Behavior = DynamicGeometryInfoUpdate ModuleTag_Geometry\n  InitialDelay       = 0\n  InitialHeight      = 10\n  InitialMajorRadius = 10\n  FinalHeight        = 40\n  FinalMajorRadius   = 100\n  TransitionTime     = 3000\n  ReverseAtTransitionTime = No\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DynamicGeometryInfoUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/DynamicGeometryInfoUpdate.cpp","bases":["UpdateModule"],"data":"DynamicGeometryInfoUpdateModuleData","groups":[["DynamicGeometryInfoUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"DynamicShroudClearingRangeUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Animates the object's vision (shroud clearing) range: grows, holds, then shrinks — e.g. spy satellite / radar scan reveals.","body":"Over time changes how much shroud the object clears. After <b>GrowDelay<\/b> the range grows over <b>GrowTime<\/b>, holds, then after <b>ShrinkDelay<\/b> shrinks over <b>ShrinkTime<\/b> down to <b>FinalVision<\/b>. Vision is updated every <b>ChangeInterval<\/b> (or <b>GrowInterval<\/b> while growing). An optional <b>GridDecalTemplate<\/b> draws a 'radar grid' decal matching the current radius. Used by the Spy Satellite / Radar Van Scan reveal objects.","ex":"Behavior = DynamicShroudClearingRangeUpdate ModuleTag_Reveal\n  ChangeInterval = 200\n  GrowInterval   = 30\n  GrowDelay      = 0\n  GrowTime       = 1000\n  ShrinkDelay    = 20000\n  ShrinkTime     = 5000\n  FinalVision    = 0\n  GridDecalTemplate\n    Texture    = RadarScanGrid\n    Style      = SHADOW_ALPHA_DECAL\n    OpacityMin = 25%\n    OpacityMax = 50%\n    Color      = R:0 G:255 B:0\n    OnlyVisibleToOwningPlayer = Yes\n  End\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/DynamicShroudClearingRangeUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/DynamicShroudClearingRangeUpdate.cpp","bases":["UpdateModule"],"data":"DynamicShroudClearingRangeUpdateModuleData","groups":[["DynamicShroudClearingRangeUpdateModuleData","own"],["RadiusDecalTemplate","nested"]],"cp":[],"notes":[]},{"name":"EjectPilotDie","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Ejects a pilot (veteran vehicles/aircraft) on death, using different OCLs in the air or on the ground.","body":"When a vehicle or aircraft with at least VETERAN rank dies (see VeterancyLevels), a pilot is created using <b>AirCreationList<\/b> when airborne (usually a parachute) or <b>GroundCreationList<\/b> on the ground. The pilot is invulnerable for <b>InvulnerableTime<\/b>. USA pilots can then enter empty vehicles to give them veterancy.","ex":"Behavior = EjectPilotDie ModuleTag_EjectPilot\n  DeathTypes         = ALL -CRUSHED -SPLATTED\n  ExemptStatus       = HIJACKED\n  VeterancyLevels    = ALL -REGULAR\n  AirCreationList    = OCL_EjectPilotViaParachute\n  GroundCreationList = OCL_EjectPilotOnGround\n  InvulnerableTime   = 3000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/EjectPilotDie.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Die/EjectPilotDie.cpp","bases":["DieModule"],"data":"EjectPilotDieModuleData","groups":[["EjectPilotDieModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"EMPUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Electromagnetic pulse field object: grows, spins and fades, disabling vehicles/structures in its radius.","body":"Put on the EMP blast effect object. On creation it disables every eligible object within <b>EffectRadius<\/b> for <b>DisabledDuration<\/b> (DISABLED_EMP; aircraft in flight crash), spawning sparks (<b>DisableFXParticleSystem<\/b>, density <b>SparksPerCubicFoot<\/b>). Visually the object scales from <b>StartScale<\/b> to a random value between <b>TargetScaleMin/Max<\/b>, spins up to <b>SpinRateMax<\/b>, lerps colour from <b>StartColor<\/b> to <b>EndColor<\/b>, and starts fading at <b>StartFadeTime<\/b>, dying at <b>Lifetime<\/b>. Filters: <b>DoesNotAffect<\/b> (SELF, ALLIES, ENEMIES, NEUTRALS…), <b>DoesNotAffectMyOwnBuildings<\/b>, <b>VictimRequired/ForbiddenKindOf<\/b>.","ex":"Behavior = EMPUpdate ModuleTag_EMP\n  Lifetime         = 3000\n  StartFadeTime    = 2000\n  StartScale       = 0.1\n  TargetScaleMin   = 1.8\n  TargetScaleMax   = 2.2\n  StartColor       = R:128 G:128 B:255\n  EndColor         = R:0 G:0 B:64\n  DisabledDuration = 15000\n  EffectRadius     = 200\n  DisableFXParticleSystem = EMPSparks\n  SparksPerCubicFoot = 0.001\n  DoesNotAffect    = ALLIES\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/EMPUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/EMPUpdate.cpp","bases":["UpdateModule"],"data":"EMPUpdateModuleData","groups":[["EMPUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"EnemyNearUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Sets the ENEMYNEAR model condition while an enemy is within vision range.","body":"Every <b>ScanDelayTime<\/b> it checks whether an enemy is within the object's vision range and sets/clears the ENEMYNEAR model condition, so the model can play an alert animation (e.g. civilians panicking, gates closing).","ex":"Behavior = EnemyNearUpdate ModuleTag_EnemyNear\n  ScanDelayTime = 1000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/EnemyNearUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/EnemyNearUpdate.cpp","bases":["UpdateModule"],"data":"EnemyNearUpdateModuleData","groups":[["EnemyNearUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"ExperienceScalarUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that increases how fast the object gains experience.","body":"When triggered, <b>AddXPScalar<\/b> is added to the object's experience gain multiplier (e.g. 0.5 = 50% more XP per kill). Used by training upgrades like USA Advanced Training.","ex":"Behavior = ExperienceScalarUpgrade ModuleTag_Training\n  TriggeredBy = Upgrade_AmericaAdvancedTraining\n  AddXPScalar = 1.0\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ExperienceScalarUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/ExperienceScalarUpgrade.cpp","bases":["UpgradeModule"],"data":"ExperienceScalarUpgradeModuleData","groups":[["ExperienceScalarUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"FireOCLAfterWeaponCooldownUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"When the unit stops firing a weapon after a burst, creates an OCL whose lifetime scales with how long it fired (e.g. smoke after firing).","body":"Tracks firing of the weapon in <b>WeaponSlot<\/b>. Once it stops firing after at least <b>MinShotsToCreateOCL<\/b> shots, <b>OCL<\/b> is created, with lifetime <b>OCLLifetimePerSecond<\/b> per second of firing, capped at <b>OCLLifetimeMaxCap<\/b>. Upgrade-gated through TriggeredBy (e.g. China Gattling barrel smoke / a 'overheat' effect).","ex":"Behavior = FireOCLAfterWeaponCooldownUpdate ModuleTag_Smoke\n  TriggeredBy          = Upgrade_SomeUpgrade\n  WeaponSlot           = PRIMARY\n  OCL                  = OCL_BarrelSmoke\n  MinShotsToCreateOCL  = 5\n  OCLLifetimePerSecond = 1000\n  OCLLifetimeMaxCap    = 8000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FireOCLAfterWeaponCooldownUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/FireOCLAfterWeaponCooldownUpdate.cpp","bases":["UpdateModule","UpgradeMux"],"data":"FireOCLAfterWeaponCooldownUpdateModuleData","groups":[["FireOCLAfterWeaponCooldownUpdateModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"FireOCLBehaviorV2","key":"Behavior","cat":"Update / behavior","origin":"mod","sum":"Expanding-radius sweep (like GrantStealthBehavior) that fires an ObjectCreationList once on every matching object found.","body":"A mod-original module built on the exact scan pattern of GrantStealthBehavior: the radius grows from <b>StartRadius<\/b> by <b>RadiusGrowRate<\/b> each frame up to <b>FinalRadius<\/b>, after which the carrying object deletes itself. Instead of granting stealth, every object inside the radius that passes the <b>KindOf<\/b>/<b>ForbiddenKindOf<\/b> filters has the <b>OCL<\/b> created at/on it — exactly once per object for the whole sweep (objects already hit are remembered, so the cumulative re-scan each frame does not fire twice).\n<br><br>Typical use: a special power spawns an invisible, inert trigger object (KindOf NO_COLLIDE IMMOBILE UNATTACKABLE INERT) that carries this behavior, so that a buff/debuff/effect object is attached to every unit in an expanding circle. It is intentionally not rate-limited per target, because the triggering special power already has its own cooldown.","ex":"Object FireOCLSweepTrigger\n  KindOf = NO_COLLIDE IMMOBILE UNATTACKABLE INERT\n  Behavior = FireOCLBehaviorV2 ModuleTag_Sweep\n    StartRadius      = 0\n    FinalRadius      = 250\n    RadiusGrowRate   = 15\n    KindOf           = INFANTRY VEHICLE\n    ForbiddenKindOf  = AIRCRAFT\n    OCL              = OCL_AttachBuffMarker\n    RadiusParticleSystemName = ShockwaveRing\n  End\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FireOCLBehaviorV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/FireOCLBehaviorV2.cpp","bases":["UpdateModule"],"data":"FireOCLBehaviorV2ModuleData","groups":[["FireOCLBehaviorV2ModuleData","own"]],"cp":["GrantStealthBehavior"],"notes":["FILE: FireOCLBehaviorV2.h ///////////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 08/09/2026 FireOCLBehaviorV2 is GrantStealthBehavior's exact scan pattern (growing radius each frame, up to FinalRadius, then self-destructs) with the payload swapped: instead of granting stealth to every ally found in range, it fires an ObjectCreationList once per object found. Intended use: a special power spawns a short-lived, invisible trigger object (KindOf = NO_COLLIDE IMMOBILE UNATTACKABLE INERT, no real Draw/Body impact -- see the Lazr_WeaponBonus-style pattern) carrying this behavior, which then fires the configured OCL for every matching unit it finds as its radius expands. Deliberately not de-duplicated / rate-limited per target: this module is meant to be triggered by a special power with its own long cooldown (e.g. 5 minutes), where firing once per matching unit found during a single expanding-radius sweep is the intended, expected behavior.","GeneralsMod @feature Dimitar 08/09/2026: the radius scan is cumulative (each frame re-queries from radius 0, not just the newly grown ring), so the same object would otherwise be re-found and re-fired on every frame of the sweep. Track objects we've already fired at so each matching object only ever triggers the OCL once for this trigger's whole lifetime. Not xfer'd -- this object is extremely short-lived (a few frames), so a save/load mid-sweep re-firing at an already-hit object is an acceptable, purely cosmetic edge case.","FILE: FireOCLBehaviorV2.cpp /////////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 08/09/2026 See FireOCLBehaviorV2.h. This is GrantStealthBehavior.cpp's update()/scan logic verbatim, with grantStealthToObject() replaced by fireOCLAtObject(), which fires the configured OCL instead. Uses the ObjectCreationList::create(ocl, primary, secondary) overload with the AFFECTED unit as primary -- so each matching unit behaves as if it fired the OCL itself: the OCL spawns at that unit's own position/orientation, and that unit (not this short-lived trigger object) supplies team ownership and becomes the \"master\" for anything the OCL creates that cares about one (e.g. a spawned unit with SlavedUpdate). The trigger object itself is never a valid master -- it typically self-destructs within a few frames of firing. Because the scan radius is cumulative (grows each frame, but always queried from 0), the same object would otherwise be re-found and re-fired on every remaining frame of the sweep; m_firedObjectIDs makes sure each matching object only ever triggers the OCL once."]},{"name":"FireSpreadUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"While the object is aflame, periodically spreads fire to nearby flammable objects via an embers OCL.","body":"Works with FlammableUpdate. While the object has the AFLAME status, every random delay between <b>MinSpreadDelay<\/b> and <b>MaxSpreadDelay<\/b> it looks for a flammable object within <b>SpreadTryRange<\/b>, creates <b>OCLEmbers<\/b> toward it and sets it on fire. Used by trees and civilian buildings to make fires spread.","ex":"Behavior = FireSpreadUpdate ModuleTag_FireSpread\n  OCLEmbers      = OCL_FireEmbers\n  MinSpreadDelay = 2000\n  MaxSpreadDelay = 6000\n  SpreadTryRange = 30\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FireSpreadUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/FireSpreadUpdate.cpp","bases":["UpdateModule"],"data":"FireSpreadUpdateModuleData","groups":[["FireSpreadUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"FirestormDynamicGeometryInfoUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Firestorm (China Inferno / napalm firestorm) — growing geometry that deals periodic fire damage and drives up to 16 particle systems.","body":"Extends DynamicGeometryInfoUpdate: while the geometry grows it creates up to 16 particle systems (ParticleSystem1…16) plus <b>FXList<\/b> at height offset <b>ParticleOffsetZ<\/b>, scaling them with the geometry, leaves a scorch mark of <b>ScorchSize<\/b>, and every <b>DelayBetweenDamageFrames<\/b> deals <b>DamageAmount<\/b> (flame) to everything inside that is lower than <b>MaxHeightForDamage<\/b>.","ex":"Behavior = FirestormDynamicGeometryInfoUpdate ModuleTag_Firestorm\n  InitialHeight      = 10\n  InitialMajorRadius = 10\n  FinalHeight        = 80\n  FinalMajorRadius   = 120\n  TransitionTime     = 5000\n  ParticleSystem1    = FirestormBase\n  ParticleSystem2    = FirestormFlames\n  FXList             = FX_FirestormSound\n  ParticleOffsetZ    = 0\n  ScorchSize         = 200\n  DelayBetweenDamageFrames = 500\n  DamageAmount       = 30\n  MaxHeightForDamage = 20\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FirestormDynamicGeometryInfoUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/FirestormDynamicGeometryInfoUpdate.cpp","bases":["DynamicGeometryInfoUpdate"],"data":"FirestormDynamicGeometryInfoUpdateModuleData","groups":[["FirestormDynamicGeometryInfoUpdateModuleData","own"],["DynamicGeometryInfoUpdateModuleData","inherited"]],"cp":[],"notes":[]},{"name":"FireWeaponCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Fires a weapon at anything that collides with the object (e.g. burning ground, electrified fences).","body":"Whenever another object collides with this one, <b>CollideWeapon<\/b> is fired at it (every frame of contact, or only once with <b>FireOnce<\/b>). <b>RequiredStatus<\/b>/<b>ForbiddenStatus<\/b> gate it on this object's status.","ex":"Behavior = FireWeaponCollide ModuleTag_Collide\n  CollideWeapon = FirewallContactWeapon\n  FireOnce      = No\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FireWeaponCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/FireWeaponCollide.cpp","bases":["CollideModule"],"data":"FireWeaponCollideModuleData","groups":[["FireWeaponCollideModuleData","own"]],"cp":[],"notes":[]},{"name":"FireWeaponPower","key":"Behavior","cat":"Special power","origin":"vanilla","sum":"Special power that makes the unit fire a specific weapon (loaded from its weapon set) at the target.","body":"When activated, the unit fires its special-power weapon at the target up to <b>MaxShotsToFire<\/b> times (e.g. a unit ability like a one-off artillery barrage bound to a button).","ex":"Behavior = FireWeaponPower ModuleTag_FirePower\n  SpecialPowerTemplate = SpecialAbilityFireBarrage\n  MaxShotsToFire       = 3\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FireWeaponPower.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/FireWeaponPower.cpp","bases":["SpecialPowerModule"],"data":"FireWeaponPowerModuleData","groups":[["FireWeaponPowerModuleData","own"],["SpecialPowerModuleData","inherited"]],"cp":[],"notes":[]},{"name":"FireWeaponUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Fires a weapon at the object's own position as fast as the weapon allows (hazard fields, auras, radiation/toxin puddles).","body":"Allocates <b>Weapon<\/b> and fires it at the object's own feet every time it's ready (respecting the weapon's reload/clip). <b>InitialDelay<\/b> postpones the first shot. <b>ExclusiveWeaponDelay<\/b> suppresses firing if any other weapon of the object fired within that time. Classic uses: toxin/radiation fields, burning ground, pulsing damage auras.","ex":"Behavior = FireWeaponUpdate ModuleTag_Pulse\n  Weapon       = ToxinPoolDamageWeapon\n  InitialDelay = 500\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FireWeaponUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/FireWeaponUpdate.cpp","bases":["UpdateModule"],"data":"FireWeaponUpdateModuleData","groups":[["FireWeaponUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"FireWeaponWhenDamagedBehavior","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Fires a weapon when the object is damaged (reaction) or continuously, chosen by current damage state.","body":"Two sets of weapons indexed by body damage state (Pristine / Damaged / ReallyDamaged / Rubble). A <b>ReactionWeapon*<\/b> is fired each time the object takes a hit that passes the <b>DamageTypes<\/b> filter and is at least <b>DamageAmount<\/b>. A <b>ContinuousWeapon*<\/b> is fired every time it is ready (reload permitting) regardless of hits — e.g. a burning, leaking effect that gets worse as the object is damaged. As an upgrade module it can be gated with TriggeredBy or be always on with StartsActive = Yes.","ex":"Behavior = FireWeaponWhenDamagedBehavior ModuleTag_Leak\n  StartsActive                  = Yes\n  ReactionWeaponPristine        = SmallSparkWeapon\n  ReactionWeaponDamaged         = SparkWeapon\n  ContinuousWeaponReallyDamaged = ToxicLeakWeapon\n  DamageTypes                   = ALL -HEALING\n  DamageAmount                  = 10\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FireWeaponWhenDamagedBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/FireWeaponWhenDamagedBehavior.cpp","bases":["UpdateModule","UpgradeMux","DamageModuleInterface"],"data":"FireWeaponWhenDamagedBehaviorModuleData","groups":[["FireWeaponWhenDamagedBehaviorModuleData","own"],["UpgradeMuxData","mixin"]],"cp":["SwitchStateWhenDamagedBehaviorV2"],"notes":[]},{"name":"FireWeaponWhenDeadBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Fires a weapon at the object's position when it dies (death explosions, upgrade-gated).","body":"A die module that fires <b>DeathWeapon<\/b> at the object's location when it dies with a matching death type. Because it is also an upgrade module, the death weapon can be enabled only after an upgrade (e.g. GLA Demo Trucks/Terrorists with the Demolitions upgrade explode for everyone) by using TriggeredBy with StartsActive = No.","ex":"Behavior = FireWeaponWhenDeadBehavior ModuleTag_DeathBomb\n  StartsActive = No\n  TriggeredBy  = Upgrade_GLADemolitions\n  DeathWeapon  = DemolitionsDeathWeapon\n  DeathTypes   = ALL -CRUSHED -SPLATTED\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FireWeaponWhenDeadBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/FireWeaponWhenDeadBehavior.cpp","bases":["BehaviorModule","UpgradeMux","DieModuleInterface"],"data":"FireWeaponWhenDeadBehaviorModuleData","groups":[["FireWeaponWhenDeadBehaviorModuleData","own"],["UpgradeMuxData","mixin"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"FlammableUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Manages the AFLAME and BURNED statuses: catching fire from flame damage, burning damage over time, burned model.","body":"When the object has taken more than <b>FlameDamageLimit<\/b> flame damage within <b>FlameDamageExpiration<\/b>, it catches fire: it gets AFLAME for <b>AflameDuration<\/b>, takes <b>AflameDamageAmount<\/b> every <b>AflameDamageDelay<\/b>, and loops <b>BurningSoundName<\/b>. After <b>BurnedDelay<\/b> it is marked BURNED (burnt model condition), which is permanent. Trees, buildings and some units use it.","ex":"Behavior = FlammableUpdate ModuleTag_Flammable\n  AflameDuration     = 5000\n  AflameDamageAmount = 3\n  AflameDamageDelay  = 500\n  BurnedDelay        = 3000\n  FlameDamageLimit   = 20\n  FlameDamageExpiration = 2000\n  BurningSoundName   = FireLoop\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FlammableUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/FlammableUpdate.cpp","bases":["UpdateModule","DamageModuleInterface"],"data":"FlammableUpdateModuleData","groups":[["FlammableUpdateModuleData","own"]],"cp":["DamageOverTimeUpdateV2"],"notes":[]},{"name":"FlightDeckBehavior","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"Aircraft carrier flight deck: spawns, launches (catapults), lands, parks and replaces carrier aircraft.","body":"An AIUpdate-based module for the aircraft carrier. It keeps a squadron of <b>PayloadTemplate<\/b> aircraft, parked in named deck spaces. Each runway (1 or 2) has its own list of parking-space bones (RunwayNSpaces), a takeoff strip and landing strip (start/end bone pair), taxi bones and creation bones, plus a catapult particle system. Destroyed aircraft are rebuilt after <b>ReplacementDelay<\/b>; launches come in waves (<b>LaunchWaveDelay<\/b>), with ramp animation delays (<b>LaunchRampDelay<\/b>, <b>LowerRampDelay<\/b>, <b>CatapultFireDelay<\/b>). Parked aircraft heal at <b>HealAmountPerSecond<\/b>.","ex":"Behavior = FlightDeckBehavior ModuleTag_FlightDeck\n  NumRunways          = 1\n  NumSpacesPerRunway  = 4\n  Runway1Spaces       = Space1 Space2 Space3 Space4\n  Runway1Takeoff      = RunwayStart1 RunwayEnd1\n  Runway1Landing      = LandingStart1 LandingEnd1\n  Runway1Taxi         = Taxi1 Taxi2\n  Runway1Creation     = Create1\n  Runway1CatapultSystem = CatapultSteam\n  ApproachHeight      = 60\n  HealAmountPerSecond = 10\n  PayloadTemplate     = CarrierJet\n  ReplacementDelay    = 15000\n  LaunchWaveDelay     = 2000\n  LaunchRampDelay     = 500\n  LowerRampDelay      = 500\n  CatapultFireDelay   = 300\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FlightDeckBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/FlightDeckBehavior.cpp","bases":["AIUpdateInterface","ParkingPlaceBehaviorInterface","DieModuleInterface","ExitInterface"],"data":"FlightDeckBehaviorModuleData","groups":[["FlightDeckBehaviorModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"FloatUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Makes the object bob and float on water surfaces.","body":"When <b>Enabled<\/b>, the object's height is kept at the water surface and it gently rocks with the waves (boats, floating debris).","ex":"Behavior = FloatUpdate ModuleTag_Float\n  Enabled = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FloatUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/FloatUpdate.cpp","bases":["UpdateModule"],"data":"FloatUpdateModuleData","groups":[["FloatUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"FXListDie","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Plays an FXList when the object dies (optionally only after an upgrade).","body":"A die module that plays <b>DeathFX<\/b> at the dying object, oriented to the object if <b>OrientToObject<\/b> = Yes. It's an upgrade module too: with StartsActive = No and TriggeredBy the death FX only plays once the upgrade is present.","ex":"Behavior = FXListDie ModuleTag_DeathFX\n  DeathTypes     = ALL\n  DeathFX        = FX_GenericInfantryDeath\n  OrientToObject = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/FXListDie.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Die/FXListDie.cpp","bases":["DieModule","UpgradeMux"],"data":"FXListDieModuleData","groups":[["FXListDieModuleData","own"],["DieMuxData","mixin"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"GarrisonContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Building garrison: infantry enter and fire from windows (garrison points), move between sides of the building.","body":"The container for garrisonable structures. Passengers are distributed over GARRISON bones and automatically shuffle to the side of the building closest to their target. It supports up to 10 occupants. <b>MobileGarrison<\/b> is for vehicles that act like a garrison (e.g. a bunker vehicle). <b>HealObjects<\/b> + <b>TimeForFullHeal<\/b> heals the occupants. <b>InitialRoster<\/b> spawns occupants at start. <b>ImmuneToClearBuildingAttacks<\/b> protects the occupants from 'clear garrison' weapons (flame, toxin, Ranger flashbang), and <b>IsEnclosingContainer<\/b> = No lets occupants be hit by outside attacks.","ex":"Behavior = GarrisonContain ModuleTag_Garrison\n  ContainMax             = 10\n  EnterSound             = GarrisonEnter\n  ExitSound              = GarrisonExit\n  ImmuneToClearBuildingAttacks = No\n  AllowInsideKindOf      = INFANTRY\n  PassengersAllowedToFire= Yes\n  DamagePercentToUnits   = 100%\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/GarrisonContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/GarrisonContain.cpp","bases":["OpenContain"],"data":"GarrisonContainModuleData","groups":[["GarrisonContainModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"GenerateMinefieldBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Creates a field of mine objects around the object (on creation, on upgrade or on death).","body":"Spawns objects of type <b>MineName<\/b> around the object, either filling a circle/footprint at <b>MinesPerSquareFoot<\/b> density or only along the border (<b>BorderOnly<\/b>, <b>SmartBorder<\/b> hugs the footprint shape). By default it fires when its upgrade triggers (e.g. the Mines/EMP Mines upgrades for USA/China buildings); with <b>GenerateOnlyOnDeath<\/b> it waits for death (e.g. a mine-dropping projectile). If <b>Upgradable<\/b> = Yes and the <b>UpgradedTriggeredBy<\/b> upgrade is bought later, the existing mines are replaced by <b>UpgradedMineName<\/b>.","ex":"Behavior = GenerateMinefieldBehavior ModuleTag_Mines\n  TriggeredBy          = Upgrade_ChinaLandMines\n  MineName             = ChinaStandardMine\n  UpgradedMineName     = ChinaEMPMine\n  UpgradedTriggeredBy  = Upgrade_ChinaEMPMines\n  Upgradable           = Yes\n  SmartBorder          = Yes\n  SmartBorderSkipInterior = Yes\n  DistanceAroundObject = 20\n  GenerationFX         = FX_MinesDeploy\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/GenerateMinefieldBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/GenerateMinefieldBehavior.cpp","bases":["UpdateModule","DieModuleInterface","UpgradeMux"],"data":"GenerateMinefieldBehaviorModuleData","groups":[["GenerateMinefieldBehaviorModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"GrantScienceUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that grants a science (general's power/rank unlock) to the player when triggered.","body":"When the upgrade triggers, the player receives <b>GrantScience<\/b> (from Science.ini) for free, unlocking whatever depends on it.","ex":"Behavior = GrantScienceUpgrade ModuleTag_Science\n  TriggeredBy  = Upgrade_ResearchSomething\n  GrantScience = SCIENCE_SomePower\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/GrantScienceUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/GrantScienceUpgrade.cpp","bases":["UpgradeModule"],"data":"GrantScienceUpgradeModuleData","groups":[["GrantScienceUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"GrantStealthBehavior","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Expanding-radius sweep that grants permanent stealth to allied units, then deletes itself.","body":"Put this on a short-lived helper object (typically created by an OCL from a special power). Every frame the scan radius grows from <b>StartRadius<\/b> by <b>RadiusGrowRate<\/b> until it reaches <b>FinalRadius<\/b>. Every allied object inside the radius that matches <b>KindOf<\/b> and whose StealthUpdate has <i>GrantedBySpecialPower = Yes<\/i> receives permanent stealth. When the final radius is reached the helper object destroys itself. This is the mechanism behind the GLA 'Camo Netting / Sneak Attack' style powers.","ex":"Behavior = GrantStealthBehavior ModuleTag_Grant\n  StartRadius     = 0\n  FinalRadius     = 200\n  RadiusGrowRate  = 10\n  KindOf          = INFANTRY VEHICLE\n  RadiusParticleSystemName = StealthRingEffect\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/GrantStealthBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/GrantStealthBehavior.cpp","bases":["UpdateModule"],"data":"GrantStealthBehaviorModuleData","groups":[["GrantStealthBehaviorModuleData","own"]],"cp":["FireOCLBehaviorV2"],"notes":[]},{"name":"GrantUpgradeCreate","key":"Behavior","cat":"Create","origin":"vanilla","sum":"On creation (or build complete), grants an upgrade to the object/player.","body":"When the object is created (for structures: when construction completes) it grants <b>UpgradeToGrant<\/b> — player upgrades to the player, object upgrades to itself. Skipped if the object has any <b>ExemptStatus<\/b> (e.g. UNDER_CONSTRUCTION to wait for completion).","ex":"Behavior = GrantUpgradeCreate ModuleTag_Grant\n  UpgradeToGrant = Upgrade_GLAFakeBuilding\n  ExemptStatus   = UNDER_CONSTRUCTION\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/GrantUpgradeCreate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Create/GrantUpgradeCreate.cpp","bases":["CreateModule"],"data":"GrantUpgradeCreateModuleData","groups":[["GrantUpgradeCreateModuleData","own"]],"cp":[],"notes":[]},{"name":"HackInternetAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"AI for the China Hacker: unpacks a laptop and generates money periodically ('hack the internet').","body":"When ordered to hack, the unit unpacks (<b>UnpackTime<\/b>, randomised by <b>PackUnpackVariationFactor<\/b>) and then every <b>CashUpdateDelay<\/b> (or <b>CashUpdateDelayFast<\/b> when inside an Internet Center) gives the owner cash depending on its veterancy (<b>Regular/Veteran/Elite/HeroicCashAmount<\/b>), gaining <b>XpPerCashUpdate<\/b> experience each time. Moving requires packing up (<b>PackTime<\/b>).","ex":"Behavior = HackInternetAIUpdate ModuleTag_AI\n  UnpackTime          = 7000\n  PackTime            = 2000\n  PackUnpackVariationFactor = 0.5\n  CashUpdateDelay     = 2000\n  CashUpdateDelayFast = 1800\n  RegularCashAmount   = 5\n  VeteranCashAmount   = 6\n  EliteCashAmount     = 8\n  HeroicCashAmount    = 10\n  XpPerCashUpdate     = 1\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/HackInternetAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/HackInternetAIUpdate.cpp","bases":["AIUpdateInterface","HackInternetAIInterface"],"data":"HackInternetAIUpdateModuleData","groups":[["HackInternetAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"HealAIUpdateV2","key":"Behavior","cat":"AI update","origin":"mod","sum":"Auto-heal AI for any unit: when idle, finds a damaged ally (KindOf-filtered) and heals it with continuous weapon fire until full.","body":"Mod-original, a slimmed-down copy of DozerAIUpdate's 'bored' auto-scan keeping only the heal/repair part (no building/fortifying/mines). Does not require KindOf DOZER. After being idle for <b>BoredTime<\/b> it searches <b>BoredRange<\/b> for a damaged ally matching <b>KindOf<\/b> (and not <b>ForbiddenKindOf<\/b>) and attacks it with its healing weapon (a weapon whose DamageType is a healing type). The module stops the 'attack' itself as soon as the target is back to full health. Heal per shot comes from the weapon's damage; turret aiming is handled by the normal Turret sub-block.","ex":"Behavior = HealAIUpdateV2 ModuleTag_AI\n  AutoAcquireEnemiesWhenIdle = Yes\n  BoredTime       = 2000\n  BoredRange      = 200\n  KindOf          = VEHICLE\n  ForbiddenKindOf = AIRCRAFT\n  Turret\n    TurretTurnRate        = 120\n    ControlledWeaponSlots = SECONDARY\n  End\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/HealAIUpdateV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/HealAIUpdateV2.cpp","bases":["AIUpdateInterface"],"data":"HealAIUpdateV2ModuleData","groups":[["HealAIUpdateV2ModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":["DozerAIUpdate"],"notes":["FILE: HealAIUpdateV2.h ///////////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 11/09/2026 HealAIUpdateV2 is a slimmed-down, non-Dozer copy of DozerAIUpdate's \"bored\" auto-scan pattern (see DozerAIUpdate.h/.cpp), keeping only the repair/heal half of Dozer's behavior and dropping build/fortify/dock-point/bridge-scaffolding/mine-clearing entirely. Differences from Dozer: - Does NOT require KindOf = DOZER on the object using this module. - Target selection is KindOf/ForbiddenKindOf-filtered (same field names/parser as FireOCLBehaviorV2's scan), not hardcoded to KindOf = STRUCTURE, and is not routed through ActionManager::canRepairObject() (which hard-requires KindOf(DOZER) on the healer and KindOf(STRUCTURE) on the target -- unusable here). - Healing is continuous weapon fire (NO_MAX_SHOTS_LIMIT), not a single dock-repair tick. Because the base engine's AIAttackState only ever stops attacking when the victim dies (it has no \"target no longer needs attention\" concept -- never needed for killing enemies), this module adds its own per-frame check in update() that force-stops the attack once the current victim is back to full health. - Turret-vs-body aiming needs no special handling at all: AIAttackAimAtTargetState already skips body rotation entirely whenever the current weapon's slot is on a turret with nonzero TurretTurnRate (see AIStates.cpp) -- purely a matter of this object's INI (Turret / ControlledWeaponSlots), not code. The actual heal-per-shot amount belongs on the healing Weapon's damage (DAMAGE_HEALING_* / IsHealingDamage(), see Damage.h) -- deliberately not duplicated as a field here.","Idle units using this module periodically scan for a damaged, KindOf-filtered ally within BoredRange and heal it with continuous weapon fire, stopping on their own once the target is back to full health. See HealAIUpdateV2.cpp for the full scan / self-stop logic. */","FILE: HealAIUpdateV2.cpp /////////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 11/09/2026 See HealAIUpdateV2.h. findHealTarget() mirrors DozerAIUpdate.cpp's findObjectToRepair(): same PartitionFilter-based range scan, but the KindOf(DOZER)/KindOf(STRUCTURE)-locked ActionManager::canRepairObject() check (which this module can't use) is replaced with a KindOf/ForbiddenKindOf filter plus a plain not-at-full-health check. It uses PartitionFilterPossibleToAttack directly -- exactly like DozerAIUpdate.cpp's findMine() does for enemy mines -- rather than going through AIUpdateInterface::getNextMoodTarget(), so it is never subject to that function's human-player-only AI::WITHIN_ATTACK_RANGE restriction. A target found beyond weapon range still comes back as a valid ATTACKRESULT_POSSIBLE_AFTER_MOVING result. That alone isn't enough to actually get the unit moving, though: AIAttackApproachTargetState::onEnter() (AIStates.cpp) deliberately refuses to chase beyond weapon range for a HUMAN-controlled unit whenever the attack's command source is CMD_FROM_AI, unless isAllowedToChase() is set -- this is almost certainly what broke the original (reverted) AIUpdateInterfaceV2's ally-chasing, and it's also why DozerAIUpdate's mine-scan uses CMD_FROM_DOZER instead of CMD_FROM_AI (sidestepping the check rather than opting into it). update() below calls setAllowedToChase(TRUE) before aiAttackObject() -- the same opt-in AssaultTransportAIUpdate.cpp already uses for its own chasing passengers -- so the target is both found AND actually pursued beyond weapon range, just like an auto-acquired enemy. update() folds DozerPrimaryIdleState::update()'s \"bored\" idle-timeout pattern directly into this module's own update() (no second state machine -- this module only has the one behavior), and adds the full-health self-stop check that the stock AIAttackState has no equivalent for.","GeneralsMod @feature Dimitar 11/09/2026: MEMORY_POOL_GLUE_WITH_USERLOOKUP_CREATE only *declares* the destructor (protected virtual), same as it does for crc/xfer/loadPostProcess -- it must be defined somewhere too, or it's an LNK2019 unresolved external for the scalar deleting destructor. No custom cleanup needed here, so EMPTY_DTOR (see DozerPrimaryIdleState in DozerAIUpdate.cpp for the same pattern) is enough.","Find the closest damaged, KindOf-eligible ally within BoredRange that our weapon can actually target. See file header comment for why this bypasses getNextMoodTarget(). */ static*/ Object* HealAIUpdateV2::findHealTarget( Object *self, const HealAIUpdateV2ModuleData *data )","GeneralsMod @feature Dimitar 11/09/2026: model condition flags live on the Drawable, not the Object -- Object only exposes setters/clearers, no getter/test -- so route through getDrawable() whenever we need to check our own current animation state.","End the current heal attack right now: return to idle at the AI level, and clear the fire-loop flags immediately rather than waiting for the general not-attacking cleanup in update() (below) to catch them a frame later -- see that cleanup's comment for why it exists at all. */","GeneralsMod @feature Dimitar 11/09/2026: the stock AIAttackState only ever stops attacking when the victim dies -- it has no \"target no longer needs attention\" concept, since that was never needed for killing enemies. Self-terminate once our current heal victim is back to full health."]},{"name":"HealContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Container that heals its passengers to full over a fixed time, then releases them.","body":"Objects that enter are healed so that they reach full health after <b>TimeForFullHeal<\/b>, after which they are automatically ejected. Used on the Hospital-style structures and some tech buildings. All OpenContain fields apply.","ex":"Behavior = HealContain ModuleTag_Heal\n  ContainMax      = 5\n  AllowInsideKindOf = INFANTRY\n  TimeForFullHeal = 5000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/HealContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/HealContain.cpp","bases":["OpenContain"],"data":"HealContainModuleData","groups":[["HealContainModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"HealCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Crate that fully heals everything owned by the player who picks it up.","body":"On pickup, all of the collector's player's objects are healed to full. Uses only the common crate fields.","ex":"Behavior = HealCrateCollide ModuleTag_Crate\n  RequiredKindOf = INFANTRY VEHICLE\n  ForbiddenKindOf= PROJECTILE\n  ExecuteFX      = FX_HealCrate\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/HealCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/HealCrateCollide.cpp","bases":["CrateCollide"],"data":"CrateCollideModuleData","groups":[["CrateCollideModuleData","own"]],"cp":[],"notes":[]},{"name":"HeightDieUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Kills the object when it reaches a given height above terrain (e.g. airburst shells, falling bombs).","body":"Each frame, if the object is at or below <b>TargetHeight<\/b> above the ground (optionally counting structures, <b>TargetHeightIncludesStructures<\/b>) — and, if <b>OnlyWhenMovingDown<\/b>, while descending — it is killed. Waits <b>InitialDelay<\/b> first. <b>SnapToGroundOnDeath<\/b> moves it to the ground when killed; <b>DestroyAttachedParticlesAtHeight<\/b> removes trailing particle systems when below that height.","ex":"Behavior = HeightDieUpdate ModuleTag_HeightDie\n  TargetHeight        = 5\n  TargetHeightIncludesStructures = Yes\n  OnlyWhenMovingDown  = Yes\n  SnapToGroundOnDeath = Yes\n  InitialDelay        = 500\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/HeightDieUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/HeightDieUpdate.cpp","bases":["UpdateModule"],"data":"HeightDieUpdateModuleData","groups":[["HeightDieUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"HelicopterSlowDeathBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"SlowDeathBehavior for helicopters: spirals down, loses its rotor blade, crashes and blows up.","body":"Extends SlowDeathBehavior with a scripted helicopter crash. On death the helicopter keeps flying in a downward spiral (<b>SpiralOrbitTurnRate<\/b>, <b>SpiralOrbitForwardSpeed<\/b>) while spinning around itself (<b>MinSelfSpin<\/b>/<b>MaxSelfSpin<\/b>) and losing lift (<b>FallHowFast<\/b>). At a random time between Min/MaxBladeFlyOffDelay the main rotor (<b>BladeBoneName<\/b>) is hidden and a separate blade object (<b>BladeObjectName<\/b>) is thrown off with <b>FXBlade<\/b>/<b>OCLBlade<\/b>. When it hits the ground <b>FXHitGround<\/b>/<b>OCLHitGround<\/b> play, and after <b>DelayFromGroundToFinalDeath<\/b> the final explosion (<b>FXFinalBlowUp<\/b>/<b>OCLFinalBlowUp<\/b>) and the <b>FinalRubbleObject<\/b> are created. All normal SlowDeathBehavior fields still apply.","ex":"Behavior = HelicopterSlowDeathBehavior ModuleTag_HeliDeath\n  DeathTypes               = ALL\n  SpiralOrbitTurnRate      = 140\n  SpiralOrbitForwardSpeed  = 350\n  SpiralOrbitForwardSpeedDamping = 0.8\n  MinSelfSpin              = 100\n  MaxSelfSpin              = 300\n  SelfSpinUpdateDelay      = 500\n  SelfSpinUpdateAmount     = 20\n  FallHowFast              = 15%\n  MinBladeFlyOffDelay      = 1000\n  MaxBladeFlyOffDelay      = 2500\n  BladeObjectName          = ComancheBlade\n  BladeBoneName            = Propeller01\n  FXBlade                  = FX_HelicopterBladeFlyOff\n  FXHitGround              = FX_HelicopterHitGround\n  DelayFromGroundToFinalDeath = 1500\n  FXFinalBlowUp            = FX_HelicopterFinalBlowUp\n  FinalRubbleObject        = ComancheHulk\n  SoundDeathLoop           = HelicopterDeathLoop\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/HelicopterSlowDeathUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/HelicopterSlowDeathUpdate.cpp","bases":["SlowDeathBehavior"],"data":"HelicopterSlowDeathBehaviorModuleData","groups":[["HelicopterSlowDeathBehaviorModuleData","own"],["DieMuxData","mixin"],["SlowDeathBehaviorModuleData","inherited"]],"cp":[],"notes":[]},{"name":"HelixContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"China Helix container: a transport that can also carry one portable add-on structure (Gattling, Bunker, Propaganda...).","body":"TransportContain variant for the Helix helicopter. It carries normal passengers in its slots and additionally hosts a portable structure rider (created from <b>PayloadTemplateName<\/b> or bought by upgrade) which is drawn attached to the helicopter and can fire. <b>ShouldDrawPips<\/b> toggles the passenger pips on the selection UI.","ex":"Behavior = HelixContain ModuleTag_Helix\n  Slots             = 5\n  AllowInsideKindOf = INFANTRY VEHICLE PORTABLE_STRUCTURE\n  ForbidInsideKindOf= AIRCRAFT HUGE_VEHICLE\n  ShouldDrawPips    = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/HelixContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/HelixContain.cpp","bases":["TransportContain"],"data":"HelixContainModuleData","groups":[["HelixContainModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"],["TransportContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"HighlanderBody","key":"Body","cat":"Body","origin":"vanilla","sum":"ActiveBody that takes damage but cannot die from normal damage (stays at 1 HP); only UNRESISTABLE damage kills it.","body":"Same fields as ActiveBody. Damage is applied normally but health never drops below 1 unless the damage type is UNRESISTABLE (used by scripts or special kill weapons). Used for mission-critical objects.","ex":"Body = HighlanderBody ModuleTag_Body\n  MaxHealth     = 1000\n  InitialHealth = 1000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/HighlanderBody.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Body/HighlanderBody.cpp","bases":["ActiveBody"],"data":"ActiveBodyModuleData","groups":[["ActiveBodyModuleData","own"]],"cp":[],"notes":[]},{"name":"HijackerUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Keeps the (hidden) Hijacker with the vehicle he stole; when it dies he pops out (by parachute if airborne).","body":"After a hijack the Hijacker is hidden and kept at the vehicle's position (<b>AttachToTargetBone<\/b>). When the vehicle is destroyed he reappears and becomes a normal unit again; if the vehicle was in the air he's put into <b>ParachuteName<\/b>.","ex":"Behavior = HijackerUpdate ModuleTag_Hijacker\n  AttachToTargetBone = None\n  ParachuteName      = AmericaParachute\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/HijackerUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/HijackerUpdate.cpp","bases":["UpdateModule"],"data":"HijackerUpdateModuleData","groups":[["HijackerUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"HiveStructureBody","key":"Body","cat":"Body","origin":"vanilla","sum":"Structure body that redirects certain damage types to its spawned slaves (Stinger Site takes sniper/poison damage on its soldiers).","body":"Extends StructureBody. Damage of types in <b>PropagateDamageTypesToSlavesWhenExisting<\/b> is passed to one of its slaves (from SpawnBehavior) instead of the structure while slaves exist. Types in <b>SwallowDamageTypesIfSlavesNotExisting<\/b> (subset) are ignored entirely when no slaves exist, so e.g. snipers can't damage an empty Stinger Site.","ex":"Body = HiveStructureBody ModuleTag_Body\n  MaxHealth     = 1000\n  InitialHealth = 1000\n  PropagateDamageTypesToSlavesWhenExisting = NONE +SMALL_ARMS +SNIPER +POISON +RADIATION +SURRENDER +FLAME\n  SwallowDamageTypesIfSlavesNotExisting    = NONE +SNIPER +POISON +RADIATION +SURRENDER\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/HiveStructureBody.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Body/HiveStructureBody.cpp","bases":["StructureBody"],"data":"HiveStructureBodyModuleData","groups":[["HiveStructureBodyModuleData","own"],["ActiveBodyModuleData","inherited"]],"cp":[],"notes":[]},{"name":"HordeUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Grants the HORDE weapon bonus (and flag subobjects) when enough similar units are grouped together.","body":"Every <b>UpdateRate<\/b> the unit counts nearby units matching <b>KindOf<\/b> (and <b>ExactMatch<\/b>/<b>AlliesOnly<\/b>) within <b>Radius<\/b>. If at least <b>Count<\/b> are found it becomes a true horde member; units within <b>RubOffRadius<\/b> of a true member also get horde status. Horde status sets the HORDE weapon bonus condition (or the action chosen by <b>Action<\/b>), shows <b>FlagSubObjectNames<\/b>, and with <b>AllowedNationalism<\/b> the Nationalism upgrade adds its bonus on top. Used by China infantry and tanks.","ex":"Behavior = HordeUpdate ModuleTag_Horde\n  UpdateRate   = 1000\n  KindOf       = INFANTRY\n  AlliesOnly   = Yes\n  ExactMatch   = No\n  Count        = 5\n  Radius       = 60\n  RubOffRadius = 20\n  AllowedNationalism = Yes\n  FlagSubObjectNames = Flag01\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/HordeUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/HordeUpdate.cpp","bases":["UpdateModule","HordeUpdateInterface"],"data":"HordeUpdateModuleData","groups":[["HordeUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"ImmortalBody","key":"Body","cat":"Body","origin":"vanilla","sum":"ActiveBody whose health never drops below 1 (cannot die at all from damage).","body":"Same fields as ActiveBody. Takes damage normally but health is clamped at 1, so the object can't be killed by any damage (unlike HighlanderBody, not even unresistable).","ex":"Body = ImmortalBody ModuleTag_Body\n  MaxHealth     = 500\n  InitialHealth = 500\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ImmortalBody.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Body/ImmortalBody.cpp","bases":["ActiveBody"],"data":"ActiveBodyModuleData","groups":[["ActiveBodyModuleData","own"]],"cp":[],"notes":[]},{"name":"InactiveBody","key":"Body","cat":"Body","origin":"vanilla","sum":"Body with no health: the object is indestructible and ignores damage (props, markers, effects).","body":"Used on objects that should never be damaged or die from damage (decorative props, projectiles-helpers, markers). It has no health data. The object can still be destroyed by code/lifetime modules.","ex":"Body = InactiveBody ModuleTag_Body\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/InactiveBody.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Body/InactiveBody.cpp","bases":["BodyModule"],"data":"(none)","groups":[],"cp":[],"notes":[]},{"name":"InstantDeathBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Die module that plays FX, creates OCLs and fires weapons immediately at the moment of death.","body":"The simplest 'on death' effect module. When the object dies with a death type that matches <b>DeathTypes<\/b> (and passes the veterancy/status filters), it immediately plays every listed <b>FX<\/b>, creates every <b>OCL<\/b> and fires every <b>Weapon<\/b> at the object's position. Each of FX/OCL/Weapon may be listed several times; if more than one entry is listed of the same kind, one is picked at random. Use several InstantDeathBehavior modules with different DeathTypes to give an object different deaths (e.g. burned vs. exploded vs. crushed).","ex":"Behavior = InstantDeathBehavior ModuleTag_DeathExplode\n  DeathTypes = ALL -CRUSHED -SPLATTED\n  FX         = FX_GenericTankDeathEffect\n  OCL        = OCL_GenericTankDeathEffect\n  Weapon     = SmallTankDeathWeapon\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/InstantDeathBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/InstantDeathBehavior.cpp","bases":["DieModule"],"data":"InstantDeathBehaviorModuleData","groups":[["InstantDeathBehaviorModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"InternetHackContai
