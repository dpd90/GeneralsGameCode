itUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/ProductionExitUpdate/QueueProductionExitUpdate.cpp","bases":["UpdateModule","ExitInterface"],"data":"QueueProductionExitUpdateModuleData","groups":[["QueueProductionExitUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"RadarUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Radar dish/tower extension animation; the radar becomes available after RadarExtendTime.","body":"When the radar is granted (by RadarUpgrade or construction), the object plays its radar extending animation for <b>RadarExtendTime<\/b> before the radar actually turns on for the player.","ex":"Behavior = RadarUpdate ModuleTag_Radar\n  RadarExtendTime = 4000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RadarUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/RadarUpdate.cpp","bases":["UpdateModule"],"data":"RadarUpdateModuleData","groups":[["RadarUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"RadarUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that gives the player radar (optionally radar that can't be disabled).","body":"When triggered, the player gets a radar (a radar count is added while the object lives). <b>DisableProof<\/b> makes it a 'super radar' that keeps working even when radar is disabled (e.g. by low power).","ex":"Behavior = RadarUpgrade ModuleTag_Radar\n  TriggeredBy  = Upgrade_GLARadar\n  DisableProof = No\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RadarUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/RadarUpgrade.cpp","bases":["UpgradeModule"],"data":"RadarUpgradeModuleData","groups":[["RadarUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"RadiusDecalUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Shows a radius decal (targeting circle) on the ground at the object for the owner, used by delivery/superweapon targets.","body":"Displays <b>DeliveryDecal<\/b> with radius <b>DeliveryDecalRadius<\/b> at the object's position (typically created by an OCL to mark where a special power will land). The decal lasts until the object dies or is killed; OnlyVisibleToOwningPlayer in the sub-block controls who sees it.","ex":"Behavior = RadiusDecalUpdate ModuleTag_Decal\n  DeliveryDecalRadius = 100\n  DeliveryDecal\n    Texture          = SCCHaloTarget\n    Style            = SHADOW_ALPHA_DECAL\n    OpacityMin       = 25%\n    OpacityMax       = 50%\n    OpacityThrobTime = 500\n    Color            = R:255 G:0 B:0 A:255\n    OnlyVisibleToOwningPlayer = Yes\n  End\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RadiusDecalUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/RadiusDecalUpdate.cpp","bases":["UpdateModule"],"data":"RadiusDecalUpdateModuleData","groups":[["RadiusDecalUpdateModuleData","own"],["RadiusDecalTemplate","nested"]],"cp":["DecalUpdateV2","PersistentDecalUpdateV2"],"notes":[]},{"name":"RailedTransportAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"AI for transports that travel only along waypoint rails between stations.","body":"Moves the transport along map waypoint paths whose names start with <b>PathPrefixName<\/b> from station to station. Players order it to go to the next station; passengers load/unload at RailedTransportDockUpdate stations.","ex":"Behavior = RailedTransportAIUpdate ModuleTag_AI\n  PathPrefixName = TrainPath\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RailedTransportAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/RailedTransportAIUpdate.cpp","bases":["AIUpdateInterface"],"data":"RailedTransportAIUpdateModuleData","groups":[["RailedTransportAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"RailedTransportContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"TransportContain for rail-bound transports (trains) that coordinates with RailedTransportAIUpdate and dock stations.","body":"A TransportContain used together with RailedTransportAIUpdate and RailedTransportDockUpdate on train-like transports that move along waypoint rails between stations. Passengers are only allowed to exit when the transport is docked at a station. Uses all TransportContain fields; no additional ones.","ex":"Behavior = RailedTransportContain ModuleTag_Contain\n  Slots             = 10\n  AllowInsideKindOf = INFANTRY VEHICLE\n  ExitDelay         = 300\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RailedTransportContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/RailedTransportContain.cpp","bases":["TransportContain"],"data":"TransportContainModuleData","groups":[["TransportContainModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"]],"cp":[],"notes":[]},{"name":"RailedTransportDockUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Station dock for rail transports: pulls the transport inside and pushes it back out.","body":"Dock module for railed transport stations. When the transport arrives within <b>ToleranceDistance<\/b> it is pulled into the station over <b>PullInsideDuration<\/b> so passengers can load/unload, then pushed out over <b>PushOutsideDuration<\/b>.","ex":"Behavior = RailedTransportDockUpdate ModuleTag_Dock\n  PullInsideDuration  = 2000\n  PushOutsideDuration = 2000\n  ToleranceDistance   = 50\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RailedTransportDockUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/DockUpdate/RailedTransportDockUpdate.cpp","bases":["DockUpdate","RailedTransportDockUpdateInterface"],"data":"RailedTransportDockUpdateModuleData","groups":[["RailedTransportDockUpdateModuleData","own"],["DockUpdateModuleData","inherited"]],"cp":[],"notes":[]},{"name":"RailroadBehavior","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Train car / locomotive physics following a waypoint railroad track, crushing things in its path.","body":"A PhysicsBehavior subclass for trains. The locomotive (<b>IsLocomotive<\/b> = Yes) follows map waypoints whose names start with <b>PathPrefixName<\/b>, pulls carriages (<b>CarriageTemplateName<\/b>, repeatable, in order), accelerates up to <b>SpeedMax<\/b>, brakes at stations and waits <b>WaitAtStationTime<\/b>. Objects on the track are hit: above <b>KillSpeedMin<\/b> they are killed, with metal/meaty bounce sounds. Running/clickety-clack/whistle sounds are played while moving. If it derails, <b>CrashFXTemplateName<\/b> is used.","ex":"Behavior = RailroadBehavior ModuleTag_Train\n  IsLocomotive         = Yes\n  PathPrefixName       = Railroad\n  CarriageTemplateName = TrainBoxcar\n  CarriageTemplateName = TrainBoxcar\n  SpeedMax             = 4\n  Acceleration         = 1.01\n  Braking              = 0.99\n  WaitAtStationTime    = 10000\n  KillSpeedMin         = 1.0\n  RunningSound         = TrainRunning\n  WhistleSound         = TrainWhistle\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RailroadGuideAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/RailroadGuideAIUpdate.cpp","bases":["PhysicsBehavior"],"data":"RailroadBehaviorModuleData","groups":[["RailroadBehaviorModuleData","own"],["PhysicsBehaviorModuleData","inherited"]],"cp":[],"notes":[]},{"name":"RebuildHoleBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"GLA rebuild hole: spawns a worker that automatically reconstructs the destroyed building.","body":"Used on the 'hole' object created by RebuildHoleExposeDie when a GLA structure dies. After <b>WorkerRespawnDelay<\/b> it spawns a <b>WorkerObjectName<\/b> that rebuilds the original structure on the spot for free. The hole regenerates <b>HoleHealthRegen%PerSecond<\/b> of its health; destroying the hole (or the worker, which is respawned) prevents the rebuild.","ex":"Behavior = RebuildHoleBehavior ModuleTag_Rebuild\n  WorkerObjectName        = GLAInfantryWorker\n  WorkerRespawnDelay      = 5000\n  HoleHealthRegen%PerSecond = 10%\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RebuildHoleBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/RebuildHoleBehavior.cpp","bases":["UpdateModule","DieModuleInterface","RebuildHoleBehaviorInterface"],"data":"RebuildHoleBehaviorModuleData","groups":[["RebuildHoleBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"RebuildHoleExposeDie","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"GLA structure death: creates a rebuild hole that will reconstruct the building.","body":"When the structure dies, a hole object (<b>HoleName<\/b>, with <b>HoleMaxHealth<\/b>) is created in its place; the hole's RebuildHoleBehavior then rebuilds the structure. With <b>TransferAttackers<\/b> units attacking the building retarget the hole.","ex":"Behavior = RebuildHoleExposeDie ModuleTag_Hole\n  DeathTypes        = ALL\n  HoleName          = GLAHoleBarracks\n  HoleMaxHealth     = 100\n  TransferAttackers = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RebuildHoleExposeDie.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Die/RebuildHoleExposeDie.cpp","bases":["DieModule"],"data":"RebuildHoleExposeDieModuleData","groups":[["RebuildHoleExposeDieModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"RepairDockUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Repair bay dock: vehicles that dock are repaired to full over TimeForFullHeal.","body":"Dock module for repair structures (USA/China War Factory repair bays, GLA Arms Dealer…). Vehicles approach via DockWaiting/DockStart/DockEnd bones and are healed to full over <b>TimeForFullHeal<\/b>.","ex":"Behavior = RepairDockUpdate ModuleTag_Repair\n  NumberApproachPositions = 5\n  AllowsPassthrough       = No\n  TimeForFullHeal         = 5000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RepairDockUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/DockUpdate/RepairDockUpdate.cpp","bases":["DockUpdate"],"data":"RepairDockUpdateModuleData","groups":[["RepairDockUpdateModuleData","own"],["DockUpdateModuleData","inherited"]],"cp":[],"notes":[]},{"name":"ReplaceObjectUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that replaces this object with a different object template in the same place.","body":"When triggered, creates <b>ReplaceObject<\/b> at the exact position/orientation (keeping team and selection) and deletes the original. Used for structures that transform into another building after an upgrade.","ex":"Behavior = ReplaceObjectUpgrade ModuleTag_Replace\n  TriggeredBy   = Upgrade_Fortify\n  ReplaceObject = MyFortifiedBunker\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ReplaceObjectUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/ReplaceObjectUpgrade.cpp","bases":["UpgradeModule"],"data":"ReplaceObjectUpgradeModuleData","groups":[["ReplaceObjectUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"RiderChangeContain","key":"Behavior","cat":"Contain","origin":"vanilla","sum":"Combat Bike container: the vehicle changes model, weapons, status and command set depending on which rider is inside.","body":"A TransportContain for GLA's Combat Cycle. Up to eight rider types are defined with Rider1…Rider8. When a unit enters, the matching row is looked up by template and the bike gets that row's model condition (RIDER1…), weapon set flag (WEAPON_RIDER1…), object status (STATUS_RIDER1…), command set override and locomotor set; the rider's veterancy is transferred to the bike. When the rider is killed (KILL_PILOT, e.g. sniper) or leaves, the empty bike is 'scuttled': it gets <b>ScuttleStatus<\/b> (default TOPPLED) and is destroyed after <b>ScuttleDelay<\/b>.\n<br><br>Rider row syntax: <code>RiderN = &lt;InfantryTemplate&gt; &lt;ModelCondition&gt; &lt;WeaponSetFlag&gt; &lt;ObjectStatus&gt; &lt;CommandSet&gt; &lt;LocomotorSet&gt;<\/code>.","ex":"Behavior = RiderChangeContain ModuleTag_Riders\n  Rider1 = GLAInfantryRebel       RIDER1 WEAPON_RIDER1 STATUS_RIDER1 GLAVehicleCombatBikeRebelCommandSet SET_NORMAL\n  Rider2 = GLAInfantryRPGTrooper  RIDER2 WEAPON_RIDER2 STATUS_RIDER2 GLAVehicleCombatBikeRPGCommandSet   SET_NORMAL\n  Rider3 = GLAInfantryTerrorist   RIDER3 WEAPON_RIDER3 STATUS_RIDER3 GLAVehicleCombatBikeTerroristCommandSet SET_NORMAL\n  ScuttleDelay  = 1000\n  ScuttleStatus = TOPPLED\n  Slots         = 1\n  AllowInsideKindOf = INFANTRY\n  ExitDelay     = 100\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RiderChangeContain.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/RiderChangeContain.cpp","bases":["TransportContain"],"data":"RiderChangeContainModuleData","groups":[["RiderChangeContainModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"],["TransportContainModuleData","inherited"]],"cp":["RiderChangeContainV2"],"notes":[]},{"name":"RiderChangeContainV2","key":"Behavior","cat":"Contain","origin":"mod","sum":"RiderChangeContain with an unlimited, repeatable 'Rider =' list (up to 32 distinct flags) and options to keep the vehicle alive when the rider is sniped.","body":"Mod-original replacement for RiderChangeContain. It behaves the same way (rider swaps the vehicle's model condition / weapon set / status / command set / locomotor set, veterancy transfers to the vehicle, vehicle is scuttled when the rider leaves), but instead of fixed Rider1…Rider8 fields every rider row uses the same repeatable <b>Rider<\/b> field and each statement appends one more row — any number of rows. The engine was extended with RIDER1…RIDER32 model conditions, WEAPON_RIDER1…32 weapon-set flags and STATUS_RIDER1…32 statuses, and rows may share flags. Avoid STATUS_RIDER8 on rows (vanilla code uses it as a 'busy' marker).\n<br><br>New behaviour on pilot kill: with <b>ScuttleOnDeath<\/b> = No, a KILL_PILOT death kills only the rider; the vehicle stays alive, empty and mobile under the same owner (veterancy lost) until a valid rider boards again. With <b>NoScuttleTurnNeutral<\/b> = Yes as well, the empty vehicle instead turns neutral and immobile, and the next valid rider of ANY player who boards it takes ownership (needs AllowNeutralInside = Yes, the default). A rider leaving voluntarily still scuttles as before.","ex":"Behavior = RiderChangeContainV2 ModuleTag_Riders\n  Rider = GLAInfantryRebel       RIDER1  WEAPON_RIDER1  STATUS_RIDER1  CommandSet_A SET_NORMAL\n  Rider = GLAInfantryRPGTrooper  RIDER2  WEAPON_RIDER2  STATUS_RIDER2  CommandSet_B SET_NORMAL\n  Rider = GLAInfantryJarmenKell  RIDER9  WEAPON_RIDER9  STATUS_RIDER9  CommandSet_C SET_NORMAL\n  ScuttleDelay         = 1000\n  ScuttleStatus        = TOPPLED\n  ScuttleOnDeath       = No     ; sniping the rider leaves the bike alive\n  NoScuttleTurnNeutral = Yes    ; ...neutral and capturable by any infantry\n  Slots                = 1\n  AllowInsideKindOf    = INFANTRY\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/RiderChangeContainV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Contain/RiderChangeContainV2.cpp","bases":["TransportContain"],"data":"RiderChangeContainV2ModuleData","groups":[["RiderChangeContainV2ModuleData","own"],["DieMuxData","mixin"],["OpenContainModuleData","inherited"],["TransportContainModuleData","inherited"]],"cp":["RiderChangeContain"],"notes":["FILE: RiderChangeContainV2.h /////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 26/09/2026 Desc: RiderChangeContain with an unlimited rider list instead of the fixed Rider1..Rider8 slots. Behaves exactly like vanilla RiderChangeContain (swap rider on entry, transfer veterancy, scuttle the vehicle when the rider leaves), but every rider row is declared with the same repeatable field, and each statement appends one more row: Behavior = RiderChangeContainV2 ModuleTag_Riders Rider = GLAInfantryRebel          RIDER1  WEAPON_RIDER1  STATUS_RIDER1  CommandSet_A  SET_NORMAL Rider = GLAInfantryRPGTrooper     RIDER2  WEAPON_RIDER2  STATUS_RIDER2  CommandSet_B  SET_NORMAL ... Rider = SomeOtherInfantry         RIDER32 WEAPON_RIDER32 STATUS_RIDER32 CommandSet_X  SET_NORMAL ScuttleDelay  = 1000 ScuttleStatus = TOPPLED ScuttleOnDeath = Yes   ; No = KILL_PILOT kills only the rider; the vehicle stays alive, empty, ;      mobile and with the same owner (veterancy is lost) until a valid ;      rider enters again. NoScuttleTurnNeutral = No ; Only used when ScuttleOnDeath = No. Yes = after KILL_PILOT the empty ;      vehicle turns neutral and immobile (veterancy still lost). The ;      next valid rider to board takes ownership of it and it can move again. ;      (Infantry of any player may board it: needs AllowNeutralInside = Yes, ;      which is the default.) ;      A rider leaving voluntarily still scuttles, as before. ; ...plus every normal TransportContain field (Slots, ExitBone, etc.) End Row format is identical to vanilla RiderN: template, model condition, weapon set flag, object status, command set override, locomotor set. The number of rows is unlimited. The number of DISTINCT flags is not: the engine now has RIDER1..RIDER32 model conditions, WEAPON_RIDER1..WEAPON_RIDER32 weapon set flags and STATUS_RIDER1..STATUS_RIDER32 object statuses. Rows may share flags. Note: vanilla code gives STATUS_RIDER8 a hardcoded meaning (Chinook / AIStates use it as a \"busy\" marker), so avoid STATUS_RIDER8 on rider rows, exactly as with vanilla RiderChangeContain.","FILE: RiderChangeContainV2.cpp ///////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 26/09/2026 Desc: RiderChangeContain with an unlimited, repeatable \"Rider =\" list. See header for usage.","Called from ActiveBody for DAMAGE_KILLPILOT. With ScuttleOnDeath = Yes (default) we return FALSE and the vanilla combat-bike logic runs (moving: vehicle dies; stopped: rider killed, vehicle scuttles). With ScuttleOnDeath = No, only the rider dies -- whether or not the vehicle was moving -- and the vehicle is left empty (still mobile, same owner, veterancy lost) until a valid rider enters again. */","Xfer method Version Info: 1: Initial version. Unlike vanilla RiderChangeContain, also persists m_scuttledOnFrame so a vehicle saved mid-scuttle still finishes scuttling (and stays un-enterable) after load, and m_neutralAfterPilotKill (NoScuttleTurnNeutral). */"]},{"name":"SabotageCommandCenterCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Saboteur effect: resets all general's power timers at an enemy command center.","body":"On the saboteur: entering an enemy Command Center resets every special power timer of that player's command center.","ex":"Behavior = SabotageCommandCenterCrateCollide ModuleTag_Sabotage\n  BuildingPickup = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SabotageCommandCenterCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/SabotageCommandCenterCrateCollide.cpp","bases":["CrateCollide"],"data":"SabotageCommandCenterCrateCollideModuleData","groups":[["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"SabotageFakeBuildingCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Saboteur effect: destroys an enemy fake building.","body":"On the saboteur: entering a GLA fake structure destroys it.","ex":"Behavior = SabotageFakeBuildingCrateCollide ModuleTag_Sabotage\n  BuildingPickup = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SabotageFakeBuildingCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/SabotageFakeBuilding.cpp","bases":["CrateCollide"],"data":"SabotageFakeBuildingCrateCollideModuleData","groups":[["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"SabotageInternetCenterCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Saboteur effect: disables an enemy Internet Center (and its hackers) for a while.","body":"Entering an enemy Internet Center disables it for <b>SabotageDuration<\/b>.","ex":"Behavior = SabotageInternetCenterCrateCollide ModuleTag_Sabotage\n  BuildingPickup   = Yes\n  SabotageDuration = 30000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SabotageInternetCenterCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/SabotageInternetCenterCrateCollide.cpp","bases":["CrateCollide"],"data":"SabotageInternetCenterCrateCollideModuleData","groups":[["SabotageInternetCenterCrateCollideModuleData","own"],["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"SabotageMilitaryFactoryCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Saboteur effect: disables an enemy factory's production for a while.","body":"Entering an enemy factory disables it for <b>SabotageDuration<\/b>.","ex":"Behavior = SabotageMilitaryFactoryCrateCollide ModuleTag_Sabotage\n  BuildingPickup   = Yes\n  SabotageDuration = 30000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SabotageMilitaryFactoryCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/SabotageMilitaryFactoryCrateCollide.cpp","bases":["CrateCollide"],"data":"SabotageMilitaryFactoryCrateCollideModuleData","groups":[["SabotageMilitaryFactoryCrateCollideModuleData","own"],["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"SabotagePowerPlantCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Saboteur effect: shuts down an enemy power plant's power output for a while.","body":"Entering an enemy power plant causes its player to lose that plant's power for <b>SabotagePowerDuration<\/b>.","ex":"Behavior = SabotagePowerPlantCrateCollide ModuleTag_Sabotage\n  BuildingPickup        = Yes\n  SabotagePowerDuration = 30000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SabotagePowerPlantCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/SabotagePowerPlantCrateCollide.cpp","bases":["CrateCollide"],"data":"SabotagePowerPlantCrateCollideModuleData","groups":[["SabotagePowerPlantCrateCollideModuleData","own"],["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"SabotageSuperweaponCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Saboteur effect: resets an enemy superweapon's countdown.","body":"Entering an enemy superweapon building resets its special power timer.","ex":"Behavior = SabotageSuperweaponCrateCollide ModuleTag_Sabotage\n  BuildingPickup = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SabotageSuperweaponCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/SabotageSuperweaponCrateCollide.cpp","bases":["CrateCollide"],"data":"SabotageSuperweaponCrateCollideModuleData","groups":[["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"SabotageSupplyCenterCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Saboteur effect: steals cash from the enemy by entering their supply center.","body":"Entering an enemy supply center transfers <b>StealCashAmount<\/b> from that player to the saboteur's player.","ex":"Behavior = SabotageSupplyCenterCrateCollide ModuleTag_Sabotage\n  BuildingPickup  = Yes\n  StealCashAmount = 1000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SabotageSupplyCenterCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/SabotageSupplyCenterCrateCollide.cpp","bases":["CrateCollide"],"data":"SabotageSupplyCenterCrateCollideModuleData","groups":[["SabotageSupplyCenterCrateCollideModuleData","own"],["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"SabotageSupplyDropzoneCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Saboteur effect: steals cash and resets the timer of an enemy Supply Drop Zone.","body":"Entering an enemy Supply Drop Zone steals <b>StealCashAmount<\/b> and resets its drop timer.","ex":"Behavior = SabotageSupplyDropzoneCrateCollide ModuleTag_Sabotage\n  BuildingPickup  = Yes\n  StealCashAmount = 800\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SabotageSupplyDropzoneCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/SabotageSupplyDropzoneCrateCollide.cpp","bases":["CrateCollide"],"data":"SabotageSupplyDropzoneCrateCollideModuleData","groups":[["SabotageSupplyDropzoneCrateCollideModuleData","own"],["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"SalvageCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"GLA salvage crate: gives a weapon upgrade (salvager units), a veterancy level, or money.","body":"Dropped by destroyed vehicles when GLA salvagers kill them. When picked up: first a <b>WeaponChance<\/b> roll for a salvage weapon upgrade (only units with WEAPON_SALVAGER that are not yet fully upgraded), otherwise <b>LevelChance<\/b> for a veterancy level, otherwise <b>MoneyChance<\/b> for random money between <b>MinMoney<\/b> and <b>MaxMoney<\/b>.","ex":"Behavior = SalvageCrateCollide ModuleTag_Salvage\n  RequiredKindOf = SALVAGER\n  WeaponChance   = 100%\n  LevelChance    = 25%\n  MoneyChance    = 75%\n  MinMoney       = 25\n  MaxMoney       = 75\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SalvageCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/SalvageCrateCollide.cpp","bases":["CrateCollide"],"data":"SalvageCrateCollideModuleData","groups":[["SalvageCrateCollideModuleData","own"],["CrateCollideModuleData","inherited"]],"cp":[],"notes":[]},{"name":"ShieldedBody","key":"Body","cat":"Body","origin":"mod","sum":"ActiveBody that lets ShieldGeneratorUpdateV2 freeze the reported damage state while a shield is active.","body":"Mod-original. Identical to ActiveBody (same fields), but a companion module can temporarily freeze the BodyDamageType it reports to the Locomotor (movement penalties) and Drawable (DAMAGED/REALLYDAMAGED visuals), so temporary health effects don't make the unit visibly/mechanically snap between damage states. Real health, death and rubble are unaffected. Used by ShieldGeneratorUpdateV2 as a safety net; objects without it simply skip the freeze. Opt in per unit: <code>Body = ShieldedBody<\/code> instead of ActiveBody.","ex":"Body = ShieldedBody ModuleTag_Body\n  MaxHealth     = 500\n  InitialHealth = 500\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ShieldedBody.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Body/ShieldedBody.cpp","bases":["ActiveBody"],"data":"ActiveBodyModuleData","groups":[["ActiveBodyModuleData","own"]],"cp":["ActiveBody"],"notes":["FILE: ShieldedBody.h //////////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 13/09/2026 Just like ActiveBody, but lets a companion module (e.g. ShieldGeneratorUpdateV2) temporarily freeze the BodyDamageType (PRISTINE/DAMAGED/REALLYDAMAGED/RUBBLE) that this object reports to the rest of the engine, independent of whatever its real current/max health is doing at that moment. Why this exists: BodyDamageType is a pure function of currentHealth/maxHealth (see ActiveBody::calcDamageState() in ActiveBody.cpp), and two separate engine systems read it directly every time it changes: Locomotor::getMaxSpeedForCondition() (and turn rate/acceleration/ lift) call getDamageState() every frame to decide movement penalties, and ActiveBody::evaluateVisualCondition() reports it to the Drawable to drive the DAMAGED/ REALLYDAMAGED model conditions. Any module that temporarily changes health or max health -- such as a \"shield\" that grants extra hit points for a while -- can therefore cause a unit to visibly (and mechanically, via movement speed) snap in and out of REALLYDAMAGED purely as an artifact of the temporary health change, not because anything really changed about how hurt it is. Freezing the reported state for the duration of that effect avoids the snap, without touching the real health/damage-state math at all -- death, rubble collapse, and all other real consequences of actual health changes are completely unaffected; only what gets reported to Locomotor and the Drawable is held fixed. This module does not add any usable capability by itself (freezing a state to itself is not something the object initiates) -- another module reaches it via Object::getBodyModule() and a getModuleNameKey() check against NAMEKEY(\"ShieldedBody\") (findModule() itself is protected on Object, so this is the public-surface equivalent of Object::findUpdateModule() / findDamageModule()'s \"match by name key, then cast\" convention), then calls freezeDamageState() / unfreezeDamageState() directly -- see ShieldGeneratorUpdateV2.cpp for the reference caller. An object not carrying ShieldedBody as its Body (i.e. still plain ActiveBody, or another ActiveBody subclass) simply won't be found by that lookup, and any caller doing it this way should treat that as a normal, harmless case to skip -- this is meant to be an opt-in Body type for whichever specific unit templates need it (e.g. Body = ShieldedBody instead of Body = ActiveBody), not a replacement for ActiveBody everywhere. Usage: Body = ShieldedBody ModuleTag_01 MaxHealth = 500.0     ; same fields as ActiveBody -- nothing new to configure here End","Freeze/unfreeze -- called by whatever module is granting this object a temporary health change and doesn't want it to affect the reported damage state for the duration. Safe to call redundantly (freezing while already frozen, or unfreezing while not frozen, are both harmless no-ops) -- callers are not expected to track whether they've already called these.","Same as ActiveBody::evaluateVisualCondition(), except it reports getDamageState() -- which may be a frozen snapshot rather than the real live value, see the header comment -- to the Drawable, instead of reading the real damage state directly. */","Force one fresh sync now: ActiveBody's own internal logic only calls evaluateVisualCondition() when ITS raw state changes as a direct result of a health change, which may not coincide with this exact moment -- so without this, the Drawable could keep showing the stale frozen value until the next unrelated health change happens to trigger a recheck."]},{"name":"ShieldGeneratorActivateV2","key":"Behavior","cat":"Special power","origin":"mod","sum":"Button-facing half of ShieldGeneratorUpdateV2: the special power the shield command button triggers.","body":"Mod-original. Standard special power bookkeeping only; forwards activation to the ShieldGeneratorUpdateV2 with the same <b>SpecialPowerTemplate<\/b>, which holds all shield configuration.","ex":"Behavior = ShieldGeneratorActivateV2 ModuleTag_01\n  SpecialPowerTemplate = SpecialPower_Shield\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ShieldGeneratorActivateV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/ShieldGeneratorActivateV2.cpp","bases":["SpecialPowerModule"],"data":"ShieldGeneratorActivateV2ModuleData","groups":[["SpecialPowerModuleData","inherited"]],"cp":["SpecialAbility","SwitchStateV2Activate"],"notes":["FILE: ShieldGeneratorActivateV2.h ///////////////////////////////////////////////////////// Desc:   The button-facing half of ShieldGeneratorUpdateV2 (see ShieldGeneratorUpdateV2.h for why this is a separate module -- same reasoning as SwitchStateV2Activate / SwitchStateV2). This is what a CommandButton with Command = SPECIAL_POWER actually finds and calls; it does nothing on its own beyond the standard special power bookkeeping (science gating, recharge timer, FX) already provided by SpecialPowerModule, which in turn hands off to whichever module on the same object implements SpecialPowerUpdateInterface for the same SpecialPowerTemplate -- that's ShieldGeneratorUpdateV2, which does the actual shielding. Both this module and ShieldGeneratorUpdateV2 must be given on the object with the SAME SpecialPowerTemplate so they find each other, e.g.: Behavior = ShieldGeneratorActivateV2 ModuleTag_01 SpecialPowerTemplate = SpecialPower_Shield End Behavior = ShieldGeneratorUpdateV2 ModuleTag_02 SpecialPowerTemplate = SpecialPower_Shield Lifetime = 10000 ShieldAmount = 500.0 ConditionStateType = USER_1 End (see ShieldGeneratorUpdateV2.h for the full field list -- ShieldAmount%, DamageTypes, WeaponIn/WeaponOut, OCLIn/OCLOut, FXListIn/FXListOut, RevertEarlyWhenDepleted, and RunOutLogicOnlyWhenDepleted all live on that module, not this one.)","Nothing extra -- SpecialPowerTemplate (and the standard recharge/science fields) already come from SpecialPowerModuleData. All of the actual configuration lives on the companion ShieldGeneratorUpdateV2 module.","Nothing special: the base implementation validates readiness, starts the recharge, and -- critically -- calls initiateIntentToDoSpecialPower(), which is what finds our companion ShieldGeneratorUpdateV2 module (matched by SpecialPowerTemplate) and asks it to (re-)shield. */"]},{"name":"ShieldGeneratorUpdateV2","key":"Behavior","cat":"Update / behavior","origin":"mod","sum":"Temporary energy shield: grants an absorption pool that refunds incoming damage (optionally only certain damage types) for a duration.","body":"Mod-original. Activated by the companion <i>ShieldGeneratorActivateV2<\/i> button (same <b>SpecialPowerTemplate<\/b>). On activation it creates a private absorption pool of <b>ShieldAmount<\/b> + <b>ShieldAmount%<\/b> × current max health, sets the optional <b>ConditionStateType<\/b> model condition (shield glow) and fires <b>WeaponIn<\/b>/<b>OCLIn<\/b>/<b>FXListIn<\/b>. Every hit whose type matches <b>DamageTypes<\/b> is immediately refunded from the pool (bypassing armor), so only the overflow is real damage; non-matching types pass straight through. The unit's real max health is never changed, so health bar, damage states and movement penalties only reflect real damage.\n<br><br>The shield ends after <b>Lifetime<\/b> (0 = never on its own) or, with <b>RevertEarlyWhenDepleted<\/b> (default Yes), when the pool is used up — firing <b>WeaponOut<\/b>/<b>OCLOut<\/b>/<b>FXListOut<\/b> and clearing the condition. <b>RunOutLogicOnlyWhenDepleted<\/b> restricts the Out effects to the 'shield broke' case. Pressing the button again while shielded recasts (fresh pool), it never stacks. Pair with Body = ShieldedBody for extra damage-state safety.","ex":"Behavior = ShieldGeneratorActivateV2 ModuleTag_ShieldButton\n  SpecialPowerTemplate = SpecialPower_Shield\nEnd\nBehavior = ShieldGeneratorUpdateV2 ModuleTag_Shield\n  SpecialPowerTemplate    = SpecialPower_Shield\n  Lifetime                = 10000\n  ShieldAmount            = 500\n  ShieldAmount%           = 25%\n  DamageTypes             = NONE +ARMOR_PIERCING +EXPLOSION\n  ConditionStateType      = USER_1\n  RevertEarlyWhenDepleted = Yes\n  RunOutLogicOnlyWhenDepleted = Yes\n  FXListIn                = FX_ShieldUp\n  FXListOut               = FX_ShieldShatter\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ShieldGeneratorUpdateV2.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/ShieldGeneratorUpdateV2.cpp","bases":["SpecialPowerUpdateModule","DamageModuleInterface"],"data":"ShieldGeneratorUpdateV2ModuleData","groups":[["ShieldGeneratorUpdateV2ModuleData","own"]],"cp":["SwitchStateV2"],"notes":["FILE: ShieldGeneratorUpdateV2.h ////////////////////////////////////////////////////////////////// GeneralsMod @feature Dimitar 13/09/2026, redesigned 13/09/2026 Temporary \"shield\" module: on activation (via the companion ShieldGeneratorActivateV2 special power button, matched by SpecialPowerTemplate -- same pairing convention SwitchStateV2 / SwitchStateV2Activate use), grants a temporary pool of absorbing health -- ShieldAmount (flat) plus ShieldAmount% (a percentage of max health at the moment of activation, cumulative with the flat amount) -- sets an optional ConditionStateType model condition flag for the duration, and fires optional WeaponIn/OCLIn/FXListIn effects once. The pool is removed again -- either after Lifetime frames, or earlier if RevertEarlyWhenDepleted is Yes and the pool is used up -- firing WeaponOut/OCLOut/FXListOut (optionally only on the depleted case, see RunOutLogicOnlyWhenDepleted) and clearing ConditionStateType. SECOND REVISION -- this module does NOT touch the object's real max health at all (an earlier version did, via ActiveBody::setMaxHealth(); see the project's module checklist doc for the full postmortem on why that approach was abandoned). Instead it tracks its own private absorption pool (m_shieldPool) and, in onDamage(), immediately refunds back whatever portion of each qualifying hit the remaining pool can cover (via BodyModuleInterface::internalChangeHealth(), which bypasses armor/DamageFX/callbacks -- appropriate here since this is a correction, not a hit). Only the overflow beyond the pool ever survives as real, permanent damage. Reasons this is better: 1. DamageTypes filtering falls out for free. A flat max-health boost has no way to say \"only protect against EXPLOSION\" -- every hit reduces the same single health number regardless of type. An absorption pool just skips the refund for a non-matching DamageInfo::in.m_damageType, leaving that hit to deal full, ordinary damage untouched. See DamageTypes below. 2. Real max health never changes, so BodyDamageType (PRISTINE/DAMAGED/REALLYDAMAGED/RUBBLE) -- which Locomotor reads every frame for movement penalties, and which drives the DAMAGED/ REALLYDAMAGED model conditions -- is only ever affected by genuine, permanent damage, never by the shield itself. (For extra safety this module also opportunistically freezes/unfreezes the object's reported damage state via a companion ShieldedBody module, if the object's Body happens to be one -- see ShieldedBody.h. With the pool design this is normally a no-op safety net rather than load-bearing, since max health is never mutated, but it costs nothing to wire in and protects against any future variant of this module that DOES touch health again.) 3. The health bar only ever reflects real, permanent changes -- no more heal-then-unheal look on activation, and no \"restore max health\" math or edge cases on reversion at all. This is a SEPARATE module from SwitchStateV2 rather than an addition to it, specifically so the shield can end (and change the model condition back) the moment its pool is depleted, without that also having to mean \"the Lifetime timer expired\" -- SwitchStateV2's single revert path conflates those two ideas, which doesn't fit a shield that needs a visible \"shield broke\" moment distinct from \"shield duration ran out\". Being a separate module (with its own SpecialPowerTemplate) also means an object can carry more than one of these independently (e.g. two different shield abilities with different ConditionStateType flags) without them interfering with each other. Usage -- give the target object both modules, sharing the same SpecialPowerTemplate: Behavior = ShieldGeneratorActivateV2 ModuleTag_01 SpecialPowerTemplate = SpecialPower_Shield End Behavior = ShieldGeneratorUpdateV2 ModuleTag_02 SpecialPowerTemplate      = SpecialPower_Shield Lifetime                  = 10000            ; 0 = shield never expires on its own (still ends ; early on depletion if RevertEarlyWhenDepleted) WeaponIn                  = ...               ; optional; fired once (at self) on activation WeaponOut                 = ...               ; optional; fired once (at self) on reversion OCLIn                     = ...               ; optional; created once (at self) on activation OCLOut                    = ...               ; optional; created once (at self) on reversion FXListIn                  = ...               ; optional; played once (at self) on activation FXListOut                 = ...               ; optional; played once (at self) on reversion ShieldAmount              = 500.0             ; flat size of the absorption pool ShieldAmount%             = 0%                ; percentage of max health at activation time, ; ADDED to ShieldAmount above (not multiplicative) DamageTypes               = ALL               ; which damage types the pool absorbs -- same ; NONE/ALL/+X/-X token syntax as every other ; DamageTypeFlags field in the engine (see ; INI::parseDamageTypeFlags); e.g. ; \"DamageTypes = NONE +ARMOR_PIERCING +EXPLOSION\" ; to only shield against those two. Damage types ; NOT in this list pass straight through to real ; health, completely unaffected by the pool. ConditionStateType        = USER_1            ; optional; ModelConditionFlagType set while ; shielded, cleared on reversion. MODELCONDITION_ ; prefix omitted, same as SwitchStateV2's states. RevertEarlyWhenDepleted   = Yes               ; No = pool still stops absorbing once used up, ; but ConditionStateType/the \"active\" state stays ; on until Lifetime expires (purely cosmetic once ; depleted); Yes = revert immediately once depleted RunOutLogicOnlyWhenDepleted = No              ; Yes = only fire WeaponOut/OCLOut/FXListOut when ; reverting because the pool was depleted, not when ; Lifetime simply runs out or the button is pressed ; again to refresh. Ignored (out logic always fires) ; if RevertEarlyWhenDepleted is No, since there is ; then no depleted-revert for it to restrict to. End Re-pressing the button while already shielded reverts the current shield and immediately grants a fresh pool -- i.e. it's a refresh/recast, never a stacking bonus.","Looks up this object's Body module and returns it as a ShieldedBody* if (and only if) that's genuinely what it is -- see ShieldedBody.h for why this lookup goes through getBodyModule() + getModuleNameKey() rather than Object::findModule() (which is protected and not callable from here). Returns nullptr for any object whose Body is plain ActiveBody or another subclass -- that's an expected, harmless case, not an error: ShieldedBody is opt-in per unit template. */","BodyModuleInterface is only ever implemented by BodyModule in this engine, and ActiveBody / ShieldedBody sit below it in a single, non-virtual inheritance chain (BodyModule -> ActiveBody -> ShieldedBody), so these static_casts are well-defined once the name key confirms the concrete type -- the same no-RTTI, cast-after-name-match convention findUpdateModule() / findDamageModule() use internally.","Grants the absorption pool (ShieldAmount + ShieldAmount% of current max health), sets ConditionStateType, fires WeaponIn/OCLIn/FXListIn once, and schedules the Lifetime revert (if configured). Real max health is never touched -- see the file header for why. If our Body is a ShieldedBody, also freezes its reported damage state for the duration (defense-in-depth; see ShieldedBody.h). */","Drops the remaining pool, clears ConditionStateType, unfreezes the damage state (if our Body is a ShieldedBody), and -- unless RunOutLogicOnlyWhenDepleted says this particular revert should be silent -- fires WeaponOut/OCLOut/FXListOut once. No health/max-health restoration happens here at all: under the pool model, real health was never mutated by enterShield() in the first place, so there is nothing to restore. Safe to call when not currently active (no-op). wasDepleted should be TRUE only when this call is happening because the pool hit zero (from onDamage()), and FALSE for every other reason (Lifetime expiry, or a refresh recast) -- this is what RunOutLogicOnlyWhenDepleted filters on. */","RunOutLogicOnlyWhenDepleted only means something when RevertEarlyWhenDepleted is set -- without an early-depletion revert path to restrict to, honoring it here would mean the out logic could NEVER run (every revert would look like \"not the depleted one\"), which is exactly the trap the user flagged when asking for this field. So it's only allowed to suppress anything when both RevertEarlyWhenDepleted is on AND this particular revert isn't the depleted one.","Called by our companion ShieldGeneratorActivateV2 module (via the base SpecialPowerModule's doSpecialPower -> initiateIntentToDoSpecialPower hand-off) whenever the button is pressed. Re-pressing while already shielded is a refresh, not a stack: revertShield(FALSE) first (this is neither a Lifetime expiry nor a depletion, so out logic follows RunOutLogicOnlyWhenDepleted's normal rule of firing), then enterShield() grants a brand new pool. */"]},{"name":"ShroudCrateCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Crate that reveals the entire map for the player who picks it up.","body":"On pickup clears the shroud of the whole map for the collector's player. Common crate fields only.","ex":"Behavior = ShroudCrateCollide ModuleTag_Crate\n  RequiredKindOf = INFANTRY VEHICLE\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/ShroudCrateCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/CrateCollide/ShroudCrateCollide.cpp","bases":["CrateCollide"],"data":"CrateCollideModuleData","groups":[["CrateCollideModuleData","own"]],"cp":[],"notes":[]},{"name":"SlavedUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Keeps a slave (drone, Stinger soldier) near its master: guard, attack, scout and repair behaviours.","body":"For objects spawned by SpawnBehavior or object upgrades. The slave stays within <b>GuardMaxRange<\/b> of an idle master (wandering <b>GuardWanderRange<\/b>), goes to the master's target when it attacks (<b>AttackRange<\/b>/<b>AttackWanderRange<\/b>), scouts ahead when it moves (<b>ScoutRange<\/b>). Being within <b>DistToTargetToGrantRangeBonus<\/b> of the target grants the master a range bonus (Scout Drone spotting). Battle drones repair the master when its health is below <b>RepairWhenBelowHealth%<\/b> at <b>RepairRatePerSecond<\/b>, hovering between RepairMin/MaxAltitude and playing a welding particle system at <b>RepairWeldingFXBone<\/b>.","ex":"Behavior = SlavedUpdate ModuleTag_Slaved\n  GuardMaxRange        = 30\n  GuardWanderRange     = 20\n  AttackRange          = 100\n  AttackWanderRange    = 20\n  ScoutRange           = 100\n  ScoutWanderRange     = 10\n  RepairRange          = 20\n  RepairMinAltitude    = 20\n  RepairMaxAltitude    = 25\n  RepairRatePerSecond  = 5\n  RepairWhenBelowHealth% = 90\n  RepairMinReadyTime   = 1000\n  RepairMaxReadyTime   = 2000\n  RepairMinWeldTime    = 500\n  RepairMaxWeldTime    = 1500\n  RepairWeldingSys     = BattleDroneWelding\n  RepairWeldingFXBone  = WeldPoint\n  StayOnSameLayerAsMaster = No\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SlavedUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/SlavedUpdate.cpp","bases":["UpdateModule","SlavedUpdateInterface"],"data":"SlavedUpdateModuleData","groups":[["SlavedUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"SlowDeathBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Multi-phase death: the corpse lingers, sinks into the ground, plays phased FX/OCL/weapons, then is destroyed.","body":"The standard 'corpse' module. When it handles a death, the object gets the DYING status and stays in the world: after <b>SinkDelay<\/b> (+variance) it starts sinking at <b>SinkRate<\/b>; it is finally destroyed after <b>DestructionDelay<\/b> (+variance) or when it sinks below <b>DestructionAltitude<\/b>. Effects are keyed to three phases: INITIAL (at death), MIDPOINT (half-way to destruction) and FINAL (at destruction) — write e.g. <code>FX = INITIAL FX_Name<\/code>. Optional fling (<b>FlingForce<\/b>, <b>FlingPitch<\/b>) throws the corpse (used for infantry blown into the air).\n<br><br><b>Choosing between several SlowDeathBehaviors:<\/b> if an object has several SlowDeathBehavior modules that all accept the death type, exactly ONE is chosen by weighted lottery using <b>ProbabilityModifier<\/b>, plus <b>ModifierBonusPerOverkillPercent<\/b> which increases the weight for each percent of overkill damage — this is how 'blown-up' deaths become more likely with bigger hits.","ex":"Behavior = SlowDeathBehavior ModuleTag_Death\n  DeathTypes        = ALL -CRUSHED -SPLATTED\n  ProbabilityModifier = 10\n  SinkDelay         = 3000\n  SinkDelayVariance = 1000\n  SinkRate          = 0.40\n  DestructionDelay  = 8000\n  FX  = INITIAL FX_GenericTankDeathEffect\n  OCL = INITIAL OCL_TankScorch\n  OCL = FINAL   OCL_TankDeathDebris\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SlowDeathBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/SlowDeathBehavior.cpp","bases":["UpdateModule","DieModuleInterface","SlowDeathBehaviorInterface"],"data":"SlowDeathBehaviorModuleData","groups":[["SlowDeathBehaviorModuleData","own"],["DieMuxData","mixin"]],"cp":["BreakApartDeathBehaviorV2"],"notes":[]},{"name":"SmartBombTargetHomingUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Nudges a falling bomb toward its target position each frame so it lands more accurately.","body":"For bombs dropped from aircraft: each frame the bomb's horizontal position is blended toward the target by <b>CourseCorrectionScalar<\/b> (0.99 = keep 99% of its own position, move 1% toward target), compensating for the aircraft's movement so 'smart bombs' hit their mark.","ex":"Behavior = SmartBombTargetHomingUpdate ModuleTag_SmartBomb\n  CourseCorrectionScalar = 0.99\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SmartBombTargetHomingUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/SmartBombTargetHomingUpdate.cpp","bases":["UpdateModule"],"data":"SmartBombTargetHomingUpdateModuleData","groups":[["SmartBombTargetHomingUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"SpawnBehavior","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Creates and maintains a group of slave units (drones, Stinger soldiers, Angry Mob members) and replaces lost ones.","body":"Keeps <b>SpawnNumber<\/b> slaves of type <b>SpawnTemplateName<\/b> (repeat to cycle through several templates) alive. <b>InitialBurst<\/b> creates some immediately; after that one lost slave is replaced every <b>SpawnReplaceDelay<\/b>. Slaves normally attack what the master attacks unless <b>SlavesHaveFreeWill<\/b>. With <b>SpawnedRequireSpawner<\/b> the slaves die with the master (drones), <b>AggregateHealth<\/b> shows the combined health of all slaves on the master (Stinger Site), <b>ExitByBudding<\/b> creates new ones on top of existing ones (mob), <b>OneShot<\/b> spawns once only, <b>CanReclaimOrphans<\/b> adopts orphaned slaves. <b>PropagateDamageTypesToSlavesWhenExisting<\/b> forwards damage of the listed types to slaves instead of the master.","ex":"Behavior = SpawnBehavior ModuleTag_Spawn\n  SpawnNumber          = 3\n  SpawnReplaceDelay    = 15000\n  SpawnTemplateName    = GLAInfantryStingerSoldier\n  OneShot              = No\n  CanReclaimOrphans    = No\n  AggregateHealth      = Yes\n  SpawnedRequireSpawner= Yes\n  InitialBurst         = 3\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SpawnBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/SpawnBehavior.cpp","bases":["UpdateModule","SpawnBehaviorInterface","DieModuleInterface","DamageModuleInterface"],"data":"SpawnBehaviorModuleData","groups":[["SpawnBehaviorModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"SpawnPointProductionExitUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Production exit that places produced units on named bones (e.g. Stinger Site soldiers at their fighting positions).","body":"Each produced/spawned unit is placed at the next free bone named <b>SpawnPointBoneName<\/b>01, 02… instead of a single exit point. Commonly combined with SpawnBehavior.","ex":"Behavior = SpawnPointProductionExitUpdate ModuleTag_Exit\n  SpawnPointBoneName = SpawnPoint\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SpawnPointProductionExitUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/ProductionExitUpdate/SpawnPointProductionExitUpdate.cpp","bases":["UpdateModule","ExitInterface"],"data":"SpawnPointProductionExitUpdateModuleData","groups":[["SpawnPointProductionExitUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"SpecialAbility","key":"Behavior","cat":"Special power","origin":"vanilla","sum":"Button side of unit special abilities; pairs with SpecialAbilityUpdate which does the work.","body":"The SpecialPowerModule that a unit's special-ability command button talks to (capture building, place charges, snipe, hijack…). It handles recharge and science gating, then hands off to the SpecialAbilityUpdate on the same object with the same <b>SpecialPowerTemplate<\/b>, which should have UpdateModuleStartsAttack semantics.","ex":"Behavior = SpecialAbility ModuleTag_AbilityButton\n  SpecialPowerTemplate     = SpecialAbilityBlackLotusCaptureBuilding\n  UpdateModuleStartsAttack = Yes\n  StartsReady              = Yes\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SpecialAbility.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/SpecialAbility.cpp","bases":["SpecialPowerModule"],"data":"SpecialAbilityModuleData","groups":[["SpecialPowerModuleData","inherited"]],"cp":["ShieldGeneratorActivateV2","SwitchStateV2Activate"],"notes":[]},{"name":"SpecialAbilityUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Does the work of unit special abilities (Black Lotus capture/hack, Colonel Burton timed charges, Jarmen Kell snipe, Hijack...).","body":"Paired with a SpecialAbility (button) module sharing the same <b>SpecialPowerTemplate<\/b>. When triggered the unit moves within <b>StartAbilityRange<\/b> of the target (aborting beyond <b>AbilityAbortRange<\/b>), optionally needing line of sight/facing, unpacks (<b>UnpackTime<\/b>), prepares for <b>PreparationTime<\/b> (e.g. capture/hack time) then triggers the effect, and packs up (<b>PackTime<\/b>). Depending on the power type it can place <b>SpecialObject<\/b>s (charges, up to <b>MaxSpecialObjects<\/b>, optionally persistent), disable the target for <b>EffectDuration<\/b> (with <b>DisableFXParticleSystem<\/b>), capture buildings (<b>DoCaptureFX<\/b>), steal cash (<b>EffectValue<\/b>) etc. Can lose stealth on trigger, award XP/skill points, and flee afterward (<b>FleeRangeAfterCompletion<\/b>).","ex":"Behavior = SpecialAbilityUpdate ModuleTag_Ability\n  SpecialPowerTemplate = SpecialAbilityBlackLotusCaptureBuilding\n  StartAbilityRange    = 15\n  UnpackTime           = 500\n  PreparationTime      = 20000\n  PackTime             = 500\n  DoCaptureFX          = Yes\n  LoseStealthOnTrigger = Yes\n  UnpackSound          = BlackLotusHackStart\n  PrepSoundLoop        = BlackLotusHackLoop\n  TriggerSound         = BlackLotusHackComplete\n  AwardXPForTriggering = 25\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SpecialAbilityUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/SpecialAbilityUpdate.cpp","bases":["SpecialPowerUpdateModule"],"data":"SpecialAbilityUpdateModuleData","groups":[["SpecialAbilityUpdateModuleData","own"]],"cp":["SwitchStateV2"],"notes":[]},{"name":"SpecialPowerCompletionDie","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Tells the script engine that a special power has completed when this object dies.","body":"Placed on objects created by a special power (e.g. the bomber that delivers a payload). When the object dies/is removed, the script engine is notified that <b>SpecialPowerTemplate<\/b> has completed for the owning player, so map scripts can react to 'special power X completed'.","ex":"Behavior = SpecialPowerCompletionDie ModuleTag_SPComplete\n  SpecialPowerTemplate = SuperweaponCarpetBomb\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SpecialPowerCompletionDie.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Die/SpecialPowerCompletionDie.cpp","bases":["DieModule"],"data":"SpecialPowerCompletionDieModuleData","groups":[["SpecialPowerCompletionDieModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"SpecialPowerCreate","key":"Behavior","cat":"Create","origin":"vanilla","sum":"On construction complete, starts the recharge countdown of the building's special powers.","body":"Put on buildings with special powers (superweapons, command center powers) so that their timers start counting when the building is finished, not when placement starts. No fields.","ex":"Behavior = SpecialPowerCreate ModuleTag_SPCreate\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SpecialPowerCreate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Create/SpecialPowerCreate.cpp","bases":["CreateModule"],"data":"CreateModuleData","groups":[],"cp":[],"notes":[]},{"name":"SpectreGunshipDeploymentUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Command-center side of the Spectre Gunship power: spawns the gunship at the map edge and sends it to the target.","body":"Placed on the building that owns the Spectre power. When the power is used (and <b>RequiredScience<\/b> is owned) it creates <b>GunshipTemplateName<\/b> at the location chosen by <b>CreateLocation<\/b> (e.g. CREATE_AT_EDGE_FARTHEST_FROM_TARGET, CREATE_AT_EDGE_NEAR_SOURCE, CREATE_AT_LOCATION) and hands it the target with <b>AttackAreaRadius<\/b>.","ex":"Behavior = SpectreGunshipDeploymentUpdate ModuleTag_SpectreDeploy\n  SpecialPowerTemplate = SuperweaponSpectreGunship\n  RequiredScience      = SCIENCE_SpectreGunship1\n  GunshipTemplateName  = AmericaSpectreGunship\n  AttackAreaRadius     = 200\n  CreateLocation       = CREATE_AT_EDGE_FARTHEST_FROM_TARGET\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SpectreGunshipDeploymentUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/SpectreGunshipDeploymentUpdate.cpp","bases":["SpecialPowerUpdateModule"],"data":"SpectreGunshipDeploymentUpdateModuleData","groups":[["SpectreGunshipDeploymentUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"SpectreGunshipUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"USA Spectre Gunship special power aircraft: orbits a target area firing a howitzer and a strafing gattling.","body":"Controls the gunship object: it inserts into orbit (<b>OrbitInsertionSlope<\/b>) around the target at <b>GunshipOrbitRadius<\/b> for <b>OrbitTime<\/b>. While orbiting its howitzer (<b>HowitzerWeaponTemplate<\/b>, every <b>HowitzerFiringRate<\/b>, with <b>RandomOffsetForHowitzer<\/b> and <b>HowitzerFollowLag<\/b>) and a separate gattling object (<b>GattlingTemplateName<\/b>, strafing with <b>StrafingIncrement<\/b> and <b>GattlingStrafeFXParticleSystem<\/b>) attack targets inside <b>AttackAreaRadius<\/b>. The player moves the targeting reticle; <b>AttackAreaDecal<\/b> and <b>TargetingReticleDecal<\/b> show the area and reticle.","ex":"Behavior = SpectreGunshipUpdate ModuleTag_Spectre\n  SpecialPowerTemplate  = SuperweaponSpectreGunship\n  GattlingTemplateName  = AmericaSpectreGunshipGattling\n  HowitzerWeaponTemplate= SpectreHowitzerGun\n  HowitzerFiringRate    = 1000\n  HowitzerFollowLag     = 500\n  OrbitTime             = 20000\n  AttackAreaRadius      = 200\n  StrafingIncrement     = 20\n  OrbitInsertionSlope   = 0.7\n  RandomOffsetForHowitzer = 20\n  TargetingReticleRadius= 25\n  GunshipOrbitRadius    = 250\n  AttackAreaDecal\n    Texture = SCCSpectreAttackArea\n    Style   = SHADOW_ALPHA_DECAL\n    OnlyVisibleToOwningPlayer = Yes\n  End\n  TargetingReticleDecal\n    Texture = SCCSpectreReticle\n    Style   = SHADOW_ALPHA_DECAL\n  End\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SpectreGunshipUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/SpectreGunshipUpdate.cpp","bases":["SpecialPowerUpdateModule"],"data":"SpectreGunshipUpdateModuleData","groups":[["SpectreGunshipUpdateModuleData","own"],["RadiusDecalTemplate","nested"]],"cp":[],"notes":[]},{"name":"SpyVisionSpecialPower","key":"Behavior","cat":"Special power","origin":"vanilla","sum":"Special power that activates SpyVisionUpdate: see through the eyes of all enemy units for a duration.","body":"When fired, the object's SpyVisionUpdate is turned on for <b>BaseDuration<\/b> (plus <b>BonusDurationPerCaptured<\/b> per prisoner, capped at <b>MaxDuration<\/b> — prisoner scaling is from the cut POW feature).","ex":"Behavior = SpyVisionSpecialPower ModuleTag_SpyVision\n  SpecialPowerTemplate = SpecialPowerSpyVision\n  BaseDuration         = 30000\n  MaxDuration          = 30000\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SpyVisionSpecialPower.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/SpecialPower/SpyVisionSpecialPower.cpp","bases":["SpecialPowerModule"],"data":"SpyVisionSpecialPowerModuleData","groups":[["SpyVisionSpecialPowerModuleData","own"],["SpecialPowerModuleData","inherited"]],"cp":[],"notes":[]},{"name":"SpyVisionUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Lets the owner see everything enemies see (shares enemy vision) for a period — GLA radar/Spy Vision.","body":"While active, the owning player sees what enemy players' objects of kind <b>SpyOnKindof<\/b> can see. Normally activated by SpyVisionSpecialPower; with <b>SelfPowered<\/b> it cycles on its own: on for <b>SelfPoweredDuration<\/b> every <b>SelfPoweredInterval<\/b>. <b>NeedsUpgrade<\/b> makes it require the TriggeredBy upgrade first.","ex":"Behavior = SpyVisionUpdate ModuleTag_SpyVision\n  NeedsUpgrade        = Yes\n  TriggeredBy         = Upgrade_GLARadar\n  SelfPowered         = Yes\n  SelfPoweredDuration = 10000\n  SelfPoweredInterval = 30000\n  SpyOnKindof         = STRUCTURE\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SpyVisionUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/SpyVisionUpdate.cpp","bases":["UpdateModule","UpgradeMux"],"data":"SpyVisionUpdateModuleData","groups":[["SpyVisionUpdateModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"SquishCollide","key":"Behavior","cat":"Collide / crate","origin":"vanilla","sum":"Lets infantry be crushed (squished) by vehicles that drive over them.","body":"When a crusher (vehicle with enough CrusherLevel vs. this object's CrushableLevel) collides with the object, it is killed with the CRUSHED death type. No fields.","ex":"Behavior = SquishCollide ModuleTag_Squish\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SquishCollide.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Collide/SquishCollide.cpp","bases":["CollideModule"],"data":"CollideModuleData","groups":[],"cp":[],"notes":[]},{"name":"StatusBitsUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that sets and/or clears object status bits.","body":"When triggered, sets <b>StatusToSet<\/b> and clears <b>StatusToClear<\/b> on the object — a generic way to toggle behaviours that check status bits (e.g. CAN_STEALTH, stealth detection, REPULSOR…).","ex":"Behavior = StatusBitsUpgrade ModuleTag_Status\n  TriggeredBy   = Upgrade_SomeUpgrade\n  StatusToSet   = CAN_STEALTH\n  StatusToClear = NONE\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/StatusBitsUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/StatusBitsUpgrade.cpp","bases":["UpgradeModule"],"data":"StatusBitsUpgradeModuleData","groups":[["StatusBitsUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"StealthDetectorUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Detects (reveals) stealthed enemy units within a range.","body":"Every <b>DetectionRate<\/b> the object scans <b>DetectionRange<\/b> (0 = use its vision range) and marks every stealthed enemy in range as DETECTED so everyone can see and attack it. Plays ping sounds and IR particle effects on detected units. <b>ExtraRequiredKindOf<\/b>/<b>ExtraForbiddenKindOf<\/b> filter what can be detected. By default it doesn't work while the detector is garrisoned or inside a transport (see CanDetectWhile*). <b>InitiallyDisabled<\/b> lets an upgrade (via StatusBitsUpgrade or code) enable it later.","ex":"Behavior = StealthDetectorUpdate ModuleTag_Detector\n  DetectionRate           = 500\n  DetectionRange          = 250\n  InitiallyDisabled       = No\n  PingSound               = StealthDetectorPing\n  IRParticleSysName       = IRCameraEffect\n  IRParticleSysBone       = Detector01\n  CanDetectWhileGarrisoned= Yes\n  CanDetectWhileContained = No\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/StealthDetectorUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/StealthDetectorUpdate.cpp","bases":["UpdateModule"],"data":"StealthDetectorUpdateModuleData","groups":[["StealthDetectorUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"StealthUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Makes the object stealthed (invisible to enemies) under configurable conditions, including disguise (Bomb Truck).","body":"After <b>StealthDelay<\/b> without breaking stealth the object becomes stealthed: enemies can't see or target it unless a detector reveals it. <b>StealthForbiddenConditions<\/b> lists what breaks stealth (ATTACKING, MOVING, USING_ABILITY, FIRING_PRIMARY, TAKING_DAMAGE, RIDERS_ATTACKING, NO_BLACK_MARKET…), <b>MoveThresholdSpeed<\/b> lets it move slowly while staying hidden. Friendly players see it at an opacity pulsing between <b>FriendlyOpacityMin/Max<\/b>. <b>InnateStealth<\/b> = No means stealth comes only from an upgrade/special power (<b>GrantedBySpecialPower<\/b>). <b>DisguisesAsTeam<\/b> enables the GLA Bomb Truck style disguise (with transition FX). <b>RequiredStatus<\/b>/<b>ForbiddenStatus<\/b> gate stealth on object status bits, e.g. only while DEPLOYED.","ex":"Behavior = StealthUpdate ModuleTag_Stealth\n  StealthDelay               = 2500\n  StealthForbiddenConditions = ATTACKING USING_ABILITY\n  MoveThresholdSpeed         = 3\n  InnateStealth              = Yes\n  FriendlyOpacityMin         = 50%\n  FriendlyOpacityMax         = 100%\n  PulseFrequency             = 500\n  OrderIdleEnemiesToAttackMeUponReveal = No\n  EnemyDetectionEvaEvent     = EnemyBlackLotusDetected\n  OwnDetectionEvaEvent       = OwnBlackLotusDetected\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/StealthUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/StealthUpdate.cpp","bases":["UpdateModule"],"data":"StealthUpdateModuleData","groups":[["StealthUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"StealthUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that gives the object the ability to stealth (sets CAN_STEALTH).","body":"When triggered, sets OBJECT_STATUS_CAN_STEALTH so the object's StealthUpdate starts working (e.g. GLA Camouflage).","ex":"Behavior = StealthUpgrade ModuleTag_Camo\n  TriggeredBy = Upgrade_GLACamouflage\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/StealthUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/StealthUpgrade.cpp","bases":["UpgradeModule"],"data":"UpgradeModuleData","groups":[["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"StickyBombUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Keeps a sticky bomb (timed/remote charge) attached to its target and handles its geometry-sized detonation.","body":"Used on bombs that stick to units (Colonel Burton's charges, TNT, Bomb Truck payload). Each frame the bomb is kept at the target's <b>AttachToTargetBone<\/b> (or <b>OffsetZ<\/b> above it). When it detonates, <b>GeometryBasedDamageWeapon<\/b> is fired with a radius based on the target's geometry, plus <b>GeometryBasedDamageFX<\/b>. Usually combined with LifetimeUpdate / FireWeaponWhenDeadBehavior.","ex":"Behavior = StickyBombUpdate ModuleTag_Sticky\n  AttachToTargetBone        = None\n  OffsetZ                   = 10\n  GeometryBasedDamageWeapon = TimedChargeBonusWeapon\n  GeometryBasedDamageFX     = FX_TimedChargeExplosion\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/StickyBombUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/StickyBombUpdate.cpp","bases":["UpdateModule"],"data":"StickyBombUpdateModuleData","groups":[["StickyBombUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"StructureBody","key":"Body","cat":"Body","origin":"vanilla","sum":"ActiveBody for buildings: tracks the constructing dozer/worker and structure-specific behaviour.","body":"Same fields as ActiveBody, used on structures. Additionally remembers which builder is constructing it and handles structure-specific interactions (repair by dozers, capture, sell).","ex":"Body = StructureBody ModuleTag_Body\n  MaxHealth     = 1500\n  InitialHealth = 1500\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/StructureBody.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Body/StructureBody.cpp","bases":["ActiveBody"],"data":"StructureBodyModuleData","groups":[["ActiveBodyModuleData","inherited"]],"cp":[],"notes":[]},{"name":"StructureCollapseUpdate","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Structure death that makes buildings collapse straight down into the ground with shudders and debris bursts.","body":"On death, after a random <b>Min/MaxCollapseDelay<\/b> the building sinks into the ground (damped by <b>CollapseDamping<\/b>) while shuddering up to <b>MaxShudder<\/b>. Bursts of phase-keyed <b>FXList<\/b>/<b>OCL<\/b> (INITIAL, DELAY, BURST, FINAL phases) happen every <b>Min/MaxBurstDelay<\/b>, with a big burst every <b>BigBurstFrequency<\/b> bursts.","ex":"Behavior = StructureCollapseUpdate ModuleTag_Collapse\n  MinCollapseDelay  = 1000\n  MaxCollapseDelay  = 1500\n  CollapseDamping   = 0.5\n  MaxShudder        = 1.0\n  MinBurstDelay     = 250\n  MaxBurstDelay     = 800\n  BigBurstFrequency = 4\n  FXList = INITIAL FX_StructureMediumDeath\n  FXList = BURST   FX_BuildingCollapseBurst\n  OCL    = FINAL   OCL_LargeStructureDebris\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/StructureCollapseUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/StructureCollapseUpdate.cpp","bases":["UpdateModule","DieModuleInterface"],"data":"StructureCollapseUpdateModuleData","groups":[["StructureCollapseUpdateModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"StructureToppleUpdate","key":"Behavior","cat":"Die / death","origin":"vanilla","sum":"Structure death that makes tall buildings topple over in a direction, crushing what they fall on.","body":"On death, after a random delay (<b>Min/MaxToppleDelay<\/b>) the structure starts to fall over (angle from the killing blow), with bursts of FX every <b>Min/MaxToppleBurstDelay<\/b>. <b>StructuralIntegrity<\/b>/<b>StructuralDecay<\/b> control how fast it accelerates. Everything it lands on is hit with <b>CrushingWeaponName<\/b> and <b>CrushingFX<\/b>. FX hooks: <b>ToppleDelayFX<\/b>, <b>ToppleStartFX<\/b>, <b>TopplingFX<\/b>, <b>ToppleDoneFX<\/b>; <b>AngleFX<\/b> plays FX at specific fall angles; <b>OCL<\/b> is phase-keyed (e.g. debris). <b>DamageFXTypes<\/b> limit which damage types allow the FX.","ex":"Behavior = StructureToppleUpdate ModuleTag_Topple\n  MinToppleDelay      = 500\n  MaxToppleDelay      = 1000\n  MinToppleBurstDelay = 200\n  MaxToppleBurstDelay = 500\n  StructuralIntegrity = 0.1\n  StructuralDecay     = 0.9\n  CrushingWeaponName  = TowerCrushWeapon\n  ToppleStartFX       = FX_TowerToppleStart\n  ToppleDoneFX        = FX_TowerToppleDone\n  CrushingFX          = FX_TowerCrush\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/StructureToppleUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/StructureToppleUpdate.cpp","bases":["UpdateModule","DieModuleInterface"],"data":"StructureToppleUpdateModuleData","groups":[["StructureToppleUpdateModuleData","own"],["DieMuxData","mixin"]],"cp":[],"notes":[]},{"name":"SubObjectsUpgrade","key":"Behavior","cat":"Upgrade","origin":"vanilla","sum":"Upgrade that shows and/or hides model subobjects (visual upgrade parts like armor plates).","body":"When triggered, subobjects listed in <b>ShowSubObjects<\/b> become visible and those in <b>HideSubObjects<\/b> are hidden, on every model condition state.","ex":"Behavior = SubObjectsUpgrade ModuleTag_Visual\n  TriggeredBy    = Upgrade_AmericaCompositeArmor\n  ShowSubObjects = ArmorPlates01 ArmorPlates02\n  HideSubObjects = OldHull\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SubObjectsUpgrade.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Upgrade/SubObjectsUpgrade.cpp","bases":["UpgradeModule"],"data":"SubObjectsUpgradeModuleData","groups":[["SubObjectsUpgradeModuleData","own"],["UpgradeMuxData","mixin"]],"cp":[],"notes":[]},{"name":"SupplyCenterCreate","key":"Behavior","cat":"Create","origin":"vanilla","sum":"On creation, registers a new supply center with every player's resource AI.","body":"Required on supply centers so all AI players' resource gathering logic knows about it. No fields.","ex":"Behavior = SupplyCenterCreate ModuleTag_SCCreate\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SupplyCenterCreate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Create/SupplyCenterCreate.cpp","bases":["CreateModule"],"data":"CreateModuleData","groups":[],"cp":[],"notes":[]},{"name":"SupplyCenterDockUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Supply Center dock: gatherers unload boxes here and they become money.","body":"Dock module for supply centers. A docking gatherer's boxes are converted to money for the owner (value per box from GameData / upgrades). <b>GrantTemporaryStealth<\/b> gives the truck temporary stealth when it leaves (used by GLA with the Camo upgrade).","ex":"Behavior = SupplyCenterDockUpdate ModuleTag_Dock\n  NumberApproachPositions = -1\n  AllowsPassthrough       = No\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SupplyCenterDockUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/DockUpdate/SupplyCenterDockUpdate.cpp","bases":["DockUpdate"],"data":"SupplyCenterDockUpdateModuleData","groups":[["SupplyCenterDockUpdateModuleData","own"],["DockUpdateModuleData","inherited"]],"cp":[],"notes":[]},{"name":"SupplyCenterProductionExitUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Production exit of Supply Centers: new supply trucks/workers are put straight to work gathering.","body":"Like DefaultProductionExitUpdate (<b>UnitCreatePoint<\/b>, <b>NaturalRallyPoint<\/b>) but every produced gatherer is immediately ordered to go gather supplies. <b>GrantTemporaryStealth<\/b> gives the new unit stealth for that long (GLA).","ex":"Behavior = SupplyCenterProductionExitUpdate ModuleTag_Exit\n  UnitCreatePoint   = X:-30 Y:0 Z:0\n  NaturalRallyPoint = X:-60 Y:0 Z:0\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SupplyCenterProductionExitUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/ProductionExitUpdate/SupplyCenterProductionExitUpdate.cpp","bases":["UpdateModule","ExitInterface"],"data":"SupplyCenterProductionExitUpdateModuleData","groups":[["SupplyCenterProductionExitUpdateModuleData","own"]],"cp":[],"notes":[]},{"name":"SupplyTruckAIUpdate","key":"Behavior","cat":"AI update","origin":"vanilla","sum":"AI for supply gatherers: automatically shuttles between supply warehouses and supply centers.","body":"The harvesting AI. The truck docks with a supply warehouse/dock, takes up to <b>MaxBoxes<\/b> boxes (<b>SupplyWarehouseActionDelay<\/b> per box), drives to the nearest supply center and unloads (<b>SupplyCenterActionDelay<\/b>), converting boxes into money. When a warehouse is empty it searches <b>SupplyWarehouseScanDistance<\/b> for another. Also used as the base for ChinookAIUpdate and WorkerAIUpdate's gathering half.","ex":"Behavior = SupplyTruckAIUpdate ModuleTag_AI\n  MaxBoxes                   = 5\n  SupplyCenterActionDelay    = 1500\n  SupplyWarehouseActionDelay = 600\n  SupplyWarehouseScanDistance= 300\n  SuppliesDepletedVoice      = SupplyTruckVoiceSuppliesDepleted\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SupplyTruckAIUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/AIUpdate/SupplyTruckAIUpdate.cpp","bases":["AIUpdateInterface","SupplyTruckAIInterface"],"data":"SupplyTruckAIUpdateModuleData","groups":[["SupplyTruckAIUpdateModuleData","own"],["AIUpdateModuleData","inherited"],["TurretAIData","nested"]],"cp":[],"notes":[]},{"name":"SupplyWarehouseCreate","key":"Behavior","cat":"Create","origin":"vanilla","sum":"On creation, registers a supply warehouse/pile with every player's resource AI.","body":"Required on supply warehouses/docks so AI players see them as supply sources. No fields.","ex":"Behavior = SupplyWarehouseCreate ModuleTag_SWCreate\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SupplyWarehouseCreate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Create/SupplyWarehouseCreate.cpp","bases":["CreateModule"],"data":"CreateModuleData","groups":[],"cp":[],"notes":[]},{"name":"SupplyWarehouseCripplingBehavior","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Supply warehouse disables itself when REALLYDAMAGED and slowly self-heals.","body":"When the warehouse reaches the REALLYDAMAGED state it becomes disabled (can't give supplies). It starts healing <b>SelfHealAmount<\/b> every <b>SelfHealDelay<\/b> once it has not been damaged for <b>SelfHealSupression<\/b>, and re-enables when back above really-damaged.","ex":"Behavior = SupplyWarehouseCripplingBehavior ModuleTag_Cripple\n  SelfHealSupression = 3000\n  SelfHealDelay      = 1000\n  SelfHealAmount     = 5\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SupplyWarehouseCripplingBehavior.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Behavior/SupplyWarehouseCripplingBehavior.cpp","bases":["UpdateModule","DamageModuleInterface"],"data":"SupplyWarehouseCripplingBehaviorModuleData","groups":[["SupplyWarehouseCripplingBehaviorModuleData","own"]],"cp":[],"notes":[]},{"name":"SupplyWarehouseDockUpdate","key":"Behavior","cat":"Update / behavior","origin":"vanilla","sum":"Supply warehouse / supply pile dock: holds a number of boxes that gatherers take away.","body":"Holds <b>StartingBoxes<\/b> supply boxes. Each docking gatherer takes boxes until full or the pile is empty. The model shows depletion via condition states. With <b>DeleteWhenEmpty<\/b> the object disappears when emptied (small supply piles).","ex":"Behavior = SupplyWarehouseDockUpdate ModuleTag_Dock\n  NumberApproachPositions = -1\n  AllowsPassthrough       = No\n  StartingBoxes           = 400\n  DeleteWhenEmpty         = No\nEnd","header":"GeneralsMD/Code/GameEngine/Include/GameLogic/Module/SupplyWarehouseDockUpdate.h","cpp":"GeneralsMD/Code/GameEngine/Source/GameLogic/Object/Update/DockUpdate/SupplyWarehouseDockUpdate.cpp","bases":["DockUpdate"],"data":"SupplyWar
